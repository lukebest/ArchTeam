同源:
  - arXiv:2609.09823 p.1-3
  - P-0147
  - P-0002

CONTEXT: |
  接 P-0147 / P-0002 脉络：自回归解码反复重读增长的 KV；长上下文注意力 GPU 带宽受限。
  后 QK 块选择可跳过 softmax/V/PV，但仍读每个 K 块；近存侧用当前 query 过滤可在 GPU 取 K 前掩码，但仍依赖当前 query——串在 query→score→mask→attn 链上。
  多数合格块决策跨步稳定，但无审计预测丢弃时，被丢掉的块永不计分，错误丢弃抹掉纠正所需证据（选择性标注）。

SYMPTOM: |
  - 约 90% 块稀疏时，K 仍约占剩余逻辑 K+V 流量的 91%——后选择省不掉全 K 读。
  - 近存过滤依赖当前 query，串在 query→score→mask→attn 链上，无法与后续注意力解耦。
  - 约 89.2% 合格块决策下一步保持不变；无审计预测：被丢块永不计分，错丢抹掉纠正证据。
  - 受控消融：对每个预测丢弃做并发审计并折入下一步 → 错丢率约 −68%——暴露无审计预测的证据抹除缺口（数字作差距存在性，不作机制提案）。
  待证伪：在公开长上下文稀疏注意力点上，后选择后 K 流量仍可测主导，或无审计预测使错丢不可恢复、端点质量相对有审计对照可测变差。

CONSTRAINT: |
  难在：块稀疏省的是 softmax/V，不是全 K 读；近存掩码绑死当前 query 串行链；跨步决策高度稳定却不能无审计丢弃——错丢抹证据。
  禁止提出具体预测器、审计电路或近存过滤流水；只问「全 K 仍读 + query 串行链 + 无审计错丢抹证据」是否同时不可接受。
  将「需可复核的丢弃证据」框为症状/约束，不提出审计机制本身。
  证伪条件：若公开工作点上后选择已使 K 流量不再主导、或无审计预测错丢率已可忽略且不抹纠正证据，则本问题不成立。
  及格线：以剩余 K/V 流量与错丢率端点对照，不以稀疏度代理代替。
