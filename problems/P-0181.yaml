generality_score: 8
同源:
  - arXiv:2609.19207 p.1-4
  - P-0147
  - P-0162

CONTEXT: |
  接 P-0147 / P-0162 的长上下文 KV 读压力脉络，但不并入：P-0147 问稠密 NVM 后备与稀疏元数据/固定量程；P-0162 问后选择后全 K 仍读与无审计错丢抹证据；本卡只问自回归 decode 在片上互联上的注入热点。
  对象是片上 mesh / NoC 上的注意力 decode：单查询行（头维约 128）每 token 对增长中的 KV 板做全读；prefill 可摊销片上跳数，decode 不能。
  FP16 LLaMA-2-7B（32 层、32 头、头维 128）在上下文 32768 时 KV 约 16 GiB，每一步 decode 都读满整份缓存。
  当 KV 落在单一逻辑内存控制器之后，mesh 退化成 hub-and-spoke：多请求方汇入同一注入点；片上窗口只是流式 scratch，远程访问与片上搬移叠在一起。
  约 16 GiB 级 KV 板装不进单颗 HBM die（平台注记 HBM2 约 8 GB、460 GB/s），容量与带宽同时把流量推向远端控制器。

SYMPTOM: |
  - FP16 LLaMA-2-7B：32 层、32 头、头维 128；上下文 32768 时 KV 约 16 GiB，每 decode 步读满整份缓存。
  - 单查询行（头维约 128）对增长 KV 板全读；prefill 可摊销片上跳数，decode 不能摊销。
  - KV 落在单一逻辑内存控制器后，mesh 呈 hub-and-spoke：多请求方汇入同一注入点；集中式配置示意约 41% 的剖分链路周期耗在反压，观测区间约 40%–60%。
  - 上下文 32K 的 decode 插桩：约 78% 的段请求在约 12 周期窗口内抵达同一路由器 → 时间与头组空间高度聚类，集中路径热点易发。
  - 约 16 GiB 级 KV 板装不进单颗 HBM die（HBM2 约 8 GB、460 GB/s）；片上窗口仅为流式 scratch，远程访问 + 片上搬移叠压。
  待证伪：在公开长上下文 decode 工作点上，单一逻辑控制器配置下剖分链路反压可测落在约 40%–60%（示意约 41%），或约 78% 段请求在约 12 周期窗口内同路由器到达可测成立，或约 16 GiB KV 相对单 die HBM 容量可测装不下并迫使远程读主导每步时延。

CONSTRAINT: |
  难在三条绑在同一注入点上，不能拆开过线：decode 每步全读增长 KV，不能像 prefill 摊销跳数；单控制器把多请求方收成 hub-and-spoke，剖分链路反压可到约 40%–60%；请求在时间与头组空间高度聚类（约 78%/约 12 周期），热点不是均匀均值能抹平的。
  约 41%（区间约 40%–60%）反压与约 78% 同窗同路由到达是端点观测，不是可被平均跳数抹平的代理：不得以平均 hop 或平均链路利用率判过。
  单控制器 reduced-bbox（局部注入队列、局部路由忙闲）不等于全信封；全信封含多控制器布局、完整 mesh 剖分、以及 decode 逐步全 KV 读。
  本卡不并入 P-0147、P-0162。只说明与稀疏/NVM 侧同源张力，不是机制。
  禁止提出多控制器重映射、请求整形、片上 KV 分片、近存过滤或任何具体 NoC/内存组织机制；只问「decode 全 KV 读 + 单控制器 hub-and-spoke 反压 + 时–头组聚类热点 + 单 die 装不下」是否同时承重失败。
  证伪条件：若公开工作点上单一逻辑控制器下剖分反压已远低于约 40%、或段请求不再在约 12 周期窗口内高度同路由聚类、或约 16 GiB KV 已能在单 die/等价本地带宽下支撑 decode 而不由远程读主导端到端时延，则本问题不成立。
  及格线：以端到端 decode 时延与剖分链路反压对照全信封。反压与同窗聚类是端点不是可被均值抹平的观测；单控制器 reduced-bbox 不得冒充多控制器全信封。不以平均 hop 或平均链路利用率代理代替。
