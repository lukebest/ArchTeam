generality_score: 8
同源:
  - arXiv:2609.12208 p.1-3
  - P-0167
  - P-0147

CONTEXT: |
  接 P-0167 脉络：VQ/权重量化之外，输入相关激活稀疏理论上可砍约 30–50% 计算；
  动态增长的 KV 常超过静态权值，仅压权重不够，需要在线量化吞吐。
  细粒度稀疏要按 token 动态决策，带来不规则计算/访存；批推理用稀疏模式交，有效稀疏随 batch 急剧塌缩。

SYMPTOM: |
  - 细粒度激活稀疏需 per-token 动态决策 → 不规则计算与访存，既有规则脉动/批执行难吃。
  - 批执行取稀疏模式交集：batch=1 约 30.4%；2/4/8/16 → 约 16.5%/9.1%/6.2%/5.1%；收益常锁死在 batch≈1。
  - 仅 weight-only 压缩不足：动态 KV 可超过权值足迹，需要在线量化吞吐，否则长上下文仍撞内存墙。
  待证伪：在公开 LLM decode 工作点上，batch≥2 时有效稀疏相对 batch=1 可测塌缩（如降至约半数及以下），
  或 batch≈1 稀疏收益无法外推到多 batch 端到端加速，或动态 KV 使 weight-only 路径相对全压缩包络可测落后。

CONSTRAINT: |
  难在：输入稀疏按 token 异质，批执行只能吃交集 → batch 一大有效稀疏崩；细粒度又带来不规则；
  同时动态 KV 超出权值，weight-only 压缩盖不住端到端。
  禁止提出上下文稀疏检测器、码本对齐稀疏、在线 VQ 单元或任何具体稀疏-量化共设计；只问「batch=1 稀疏 ≠ 多 batch 包络 + 不规则细粒度 + KV 需在线量化」是否同时承重失败。
  证伪条件：若公开工作点上 batch=2/4/8/16 有效稀疏仍接近 batch=1（约 30% 量级）、且多 batch 端到端已达加速，或 weight-only 已足够覆盖动态 KV 足迹，则本问题不成立。
  及格线：以多 batch 端到端加速对照；batch=1 稀疏率 ≠ 多 batch 包络，不以单 token 稀疏代理代替多 batch 吞吐。
