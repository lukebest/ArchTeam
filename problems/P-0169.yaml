generality_score: 8
同源:
  - arXiv:2609.13420 p.1-3

CONTEXT: |
  对象是安全关键机器人/飞行器上的采样式运动规划：高维构型空间要大量采样才有成功率与路径质量；
  云卸载受不可预测网络时延约束，本地实时是硬门槛。
  即便波前式、类动态规划采样规划器（碰撞懒检查），近邻搜索仍主导开销，而非碰撞检测。
  感知/控制优化后，规划常成闭环最慢环：敏捷飞行 MPCC 约 100 Hz 在线重规划，拓扑重规划窗约 5–7 ms 搜索 + 10 ms 优化，最坏时延一阶；
  纳米平台约 10 cm、27 g 同时收紧功耗与算力，任何 sense-plan-control 时延都进闭环。

SYMPTOM: |
  - 6-DoF 优化规划器仍需数十秒；GPU 上 7-DoF 臂规划仍数十秒量级。
  - Jetson TX-2 + MAVBench：规划相对感知+控制约慢 3.5–8×。
  - ARM Cortex 室内导航查询约 5 s、约 1 W；微机器人目标约 10× 更低功耗与约 100× 吞吐。
  - 工作负载高度不规则、数据依赖、局部性差、控制流发散、活跃节点动态——GPU 负载均衡难；需要能承动态内存与实时的结构，而非套用存量 AI/视觉核。
  待证伪：在公开本地实时规划工作点上，近邻搜索相对碰撞检查可测主导，或规划相对感知+控制端到端时延可测落后（如 ≥3.5×），或 Cortex 级查询功耗/吞吐相对微机器人约 10×/100× 包络可测缺口。

CONSTRAINT: |
  难在：高维采样要质量，却必须本地最坏时延可控；波前类算法把瓶颈从碰撞推到近邻与动态活跃集；
  负载不规则、数据依赖、局部性差，存量 GPU/AI 核难吃动态内存与实时窗（ms 级重规划）。
  禁止提出多树扩展、KD 子系统、前瞻提交、并行检索或任何具体算法-硬件共设计；只问「本地实时 + NN 主导 + 不规则动态工作负载 vs 存量 AI/视觉核」是否同时承重失败。
  证伪条件：若公开工作点上近邻不再主导、规划相对感知+控制已在闭环窗内（不出现约数倍落后）、或存量 GPU/AI 核已在约 1 W 与微机器人吞吐包络内承住不规则活跃集，则本问题不成立。
  及格线：以端到端规划时延、相对感知+控制倍率、功耗与查询吞吐对照闭环窗；不以单次碰撞检查吞吐代理代替近邻主导与最坏时延。
