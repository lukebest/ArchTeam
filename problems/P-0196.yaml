# 中文题目: 尖峰视觉 Transformer 的多头注意力在边缘侧仍被参数访存与片上拥堵卡住，现有加速常 >4 W（FPGA）或 >200 mW（ASIC）
generality_score: 8
同源:
  - arXiv:2609.33207 p.1-3
  - P-0178

CONTEXT: |
  标准视觉 Transformer（ViT）依赖海量参数与复杂的多头自注意力（MHSA），在功耗与面积紧约束的边缘场景难以能效部署。
  换成尖峰视觉 Transformer（SViT）后，巨大参数量仍因内存访问与计算的高延迟、高能耗构成挑战。SViT 族共享相似的 MHSA 子图要素（尖峰卷积、线性与注意力），瓶颈集中在这一共用子图。
  朴素注意力复杂度可达 O(N²D)，其中 N 为 token 数、D 为嵌入维。既有加速器设计常依赖全局片上存储保存处理中数据与参数，导致片上访存拥堵并抬高功耗。既有实现尚未覆盖采用重参数化模块的较新 SViT 变体。

SYMPTOM: |
  - 既有 FPGA 类 SViT 加速功耗常 >4 W；专用 ASIC 仍常 >200 mW——对功耗苛刻、长续航边缘场景不合适。
  - 换成尖峰表示后，海量参数带来的访存与计算延迟/能耗仍是一阶成本，并未因稀疏尖峰自动消失。
  - 依赖全局片上存储保存中间数据与参数时，片上访存拥堵与功耗同步上升。
  - MHSA 朴素复杂度可达 O(N²D)；SViT 族共享该 MHSA 子图，瓶颈不随具体变体分散，而是集中在同一结构。
  - 较新的、带重参数化模块的 SViT 变体尚未被既有加速器覆盖，覆盖缺口与功耗超标并存。
  - 端点包括端到端推理功耗（mW/W）、能量/帧或能量/推理、吞吐（FPS 或 tokens/s）、片上存储占用与访存拥堵指标，以及在公开 SViT 工作点上的精度。
  待证伪：在公开边缘功耗信封（远低于 4 W FPGA / 200 mW ASIC 量级）与公开 SViT 工作点上，若 MHSA 子图的端到端功耗、能量与吞吐不再由参数访存与片上拥堵主导，且 O(N²D) 与全局片上存储假设不再约束端点，则本问题不足以成立。

CONSTRAINT: |
  难在同一边缘功耗信封上同时承受海量参数访存、O(N²D) 的 MHSA 计算与全局片上存储带来的拥堵：尖峰表示并未消除参数规模，共用 MHSA 子图使瓶颈跨变体集中，而把中间态与参数都放进全局片上存储又把访存拥堵直接标价到功耗。
  端到端功耗、能量/帧、吞吐、片上存储占用与精度是 endpoints；单层 MAC 利用率、峰值尖峰稀疏率或只计计算核不计访存的加速比都是 proxies，endpoints ≠ proxies。
  只在更大功耗信封（如 >4 W）、只用截断的小型网络、或忽略全局片上存储拥堵的实验属于 reduced-bbox，不等于覆盖功耗苛刻长续航边缘、完整 MHSA 子图与较新重参数化变体的 full envelope；reduced-bbox ≠ full envelope。
  及格判定若采用 0.85，0.85 是 pass bar，不是 measured mean；不得用平均层利用率过线冒充端到端功耗与能量端点都过线。
  同源但不并入 P-0178：P-0178 问轨道辐射下 ViT 故障传播与静态保护；本卡只问边缘侧 SViT 的 MHSA 在参数访存、片上拥堵与功耗信封下的可部署性。
  无解法提案，不提出具体尖峰编码、注意力近似、片上存储分层、重参数化实现或任何加速器微架构。
