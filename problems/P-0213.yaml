# 中文题目: Transformer 块级混合精度在硬件上落不下去：per-tensor 仍主导，非均匀块与固定通路错配，精度选择决定不了有效并行
generality_score: 8
同源:
  - arXiv:2610.00207 p.1-3
  - P-0143
  - P-0182

CONTEXT: |
  常规加速器对张量内异构精度支持有限，量化部署仍大量停留在 per-tensor 精度赋值，细粒度混合精度难以落到高效硬件路径。
  Transformer（含视觉与扩散）推理反复执行大规模矩阵与注意力；扩散还把同一 backbone 在多步去噪上放大计算与访存成本。
  激进低比特（尤其 sub-8-bit）常因参数对量化的非均匀敏感度（不同层/通道/参数组）导致分类或生成质量不可接受下降。
  分块量化可比 tensor-wise 提供更细缩放与更激进整体压缩，但现有 GPU 等推理平台因非均匀访存与固定功能计算通路，难高效执行混合精度块。
  软件侧已有按层敏感度或 channel-wise 张量内混合精度的路线，硬件侧仍多为粗粒度精度配置或以稀疏跳过代替变精度权重。
  若要把块粒度 bit-width 真正变成吞吐/能效，需要量化块几何与处理单元配置同构——否则精度选择无法直接决定有效块维与计算并行度。
  视觉 Transformer 核心可收敛到线性投影、注意力 softmax 与非线性，但仍有 embedding、LayerNorm、位置编码等常被留在加速器外，端到端收益取决于边界如何划。

SYMPTOM: |
  - 量化部署大量仍停在 per-tensor 精度赋值；张量内异构精度在常规加速器上缺少高效路径。
  - 激进 sub-8-bit 常因层/通道/参数组敏感度非均匀，使分类或生成质量不可接受下降。
  - 分块量化能给更细缩放与更强压缩，但 GPU 等平台的非均匀访存与固定功能通路难高效执行混合精度块。
  - 软件侧可做到层敏感度或 channel-wise 混合精度；硬件侧仍多为粗粒度精度档，或以稀疏跳过代替真正变精度权重。
  - 块粒度 bit-width 若与处理单元几何不同构，精度选择无法直接决定有效块维与计算并行度，吞吐/能效端点不跟着精度表走。
  - embedding、LayerNorm、位置编码等常留在加速器外时，只加速线性/注意力核心不等于端到端吞吐与能效收益。
  - 在约 16nm、GHz 级实现口径下，需同时报告吞吐、面积效率与能效，并对照「更低有效位宽换可接受准确率/生成质量」的权衡。
  - 端点包括端到端吞吐、面积效率、能效、有效位宽下的准确率/生成质量，以及混合精度块在目标平台上的可执行效率（相对 tensor-wise 基线）。
  待证伪：在公开视觉/扩散 Transformer 工作点与约 16nm/GHz 级口径下，若块级混合精度可在现有固定通路上高效执行、精度选择可直接决定有效并行与吞吐/能效、且加速器边界外算子不再吃掉端到端收益，则本问题不足以成立。

CONSTRAINT: |
  难在同一硬件通路上同时承受：(1) 参数敏感度非均匀要求的块/通道变精度；(2) 固定功能与非均匀访存对混合精度块的执行摩擦；(3) 加速器边界外算子对端到端收益的侵蚀——只报更低平均位宽或只加速核心算子都不等于端到端过线。
  吞吐、面积效率、能效、准确率/生成质量与混合精度块可执行效率是 endpoints；平均位宽、单层 MAC 利用率、稀疏跳过率、或忽略边界外算子的核心加速比都是 proxies，endpoints ≠ proxies。
  只在更大工艺节点、只用 tensor-wise、关掉非均匀块、或把 LayerNorm/embedding 排除在测量外的实验属于 reduced-bbox，不等于覆盖块级混合精度全图与约 16nm/GHz 全信封；reduced-bbox ≠ full envelope。
  及格判定若采用 0.85，0.85 是 pass bar，不是 measured mean；不得用平均位宽或平均层加速过线冒充吞吐、能效与质量端点都过线。
  同源但不并入 P-0143：P-0143 问算法连续混合精度掉进硬件离散档空隙；本卡进一步钉在块几何与处理单元同构、以及固定通路对混合精度块的执行摩擦。
  同源但不并入 P-0182：P-0182 问边缘 VLM 多模态激活动态范围打穿块共享尺度；本卡问 Transformer 块级 bit-width 与硬件并行同构，不绑定多模态激活范围。
  无解法提案，不提出具体分块量化算法、精度搜索、稀疏跳过替代、处理单元几何或任何加速器微架构。
