generality_score: 8
同源:
  - arXiv:2609.05764 p.1-3

CONTEXT: |
  对象是长上下文 Transformer 的 KV 缓存：容量随序列长度线性膨胀，SRAM 面积与漏电难承。
  NVM（如 RRAM）被考虑作稠密后备，但 KV 访问带大量稀疏压缩与元数据，且写代价显著高于读。
  量化与量程常在流片时写死，与运行时分布不对齐。

SYMPTOM: |
  - KV 侧元数据可占到约 25%，稀疏压缩结构无法直接落在稠密 NVM 阵列上。
  - 同容量下 RRAM 面积约可到 SRAM 的 1/23，但写能耗/时延远高于读，热写路径吃掉面积收益。
  - 流片固定转换量程与 GPU 风格量化，读路径能量常落在约 3.1–3.6× 相对理想动态量程基线。
  待证伪：在公开长上下文工作点上，元数据占比与固定量程使 NVM KV 读能量相对可调/稀疏友好路径
  可测升高，或稠密阵列无法容纳稀疏压缩索引而不回退到大块稠密读写。

CONSTRAINT: |
  难在：NVM 面积优势建立在稠密阵列上，而 KV 压缩是稀疏+元数据主导；写贵与固定量程把「大容量」
  转不成「可用带宽/能量」。
  禁止提出具体稀疏 NVM 组织或动态量程电路；只问稠密后备与稀疏压缩、固定量程三者是否同时不可接受。
  证伪条件：若公开长上下文下元数据可忽略、稀疏索引可无损落稠密阵列，且固定量程读能量
  不高于动态量程基线约 3×，则本问题不成立。
