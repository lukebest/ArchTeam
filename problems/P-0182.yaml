generality_score: 8
同源:
  - arXiv:2609.19683 p.1-4
  - P-0143
  - P-0167

CONTEXT: |
  接 P-0143 / P-0167 的边缘低比特与压缩张力，但不并入：P-0143 问算法连续混合精度掉进硬件离散档空隙；P-0167 问 VQ/码本高压缩在脉动阵列上换不成端到端加速；本卡只问边缘 VLM 多模态激活动态范围把标准块共享尺度格式打穿。
  对象是边缘 VLM 部署：带宽严重受限，需要激进 sub-8-bit 量化。多模态 token 动态范围鸿沟使标准块尺度格式崩溃：共享指数被离群值劫持 → 邻域下溢 → 注意力图被毁。
  业界权值-only（如 W4A16）对 VLM 不够：视觉 KV 与动态激活仍未压缩；单元要么走昂贵混合精度乘法，要么把权值反量化回 FP16，面积/动态功耗仍粘在 16-bit 逻辑上。
  画像：视觉激活约跨 −20 到 10，文本 token 贴零；单一共享尺度要么狠裁视觉离群，要么逼文本细粒度下溢。

SYMPTOM: |
  - 边缘 VLM 带宽严重受限，需激进 sub-8-bit；业界 W4A16 类权值-only 仍留下视觉 KV 与动态激活未压，面积/动态功耗粘 16-bit 逻辑。
  - 视觉激活约跨 −20 到 10，文本贴零；单一共享尺度要么狠裁视觉离群，要么逼文本细粒度下溢。
  - Qwen2-VL-7B OCRBench 画像：视觉 token 平均幅值约 0.312，文本约 0.0091 → 约 34× 通道动态范围鸿沟；视觉第 99 百分位离群可超约 2.07，文本同百分位鲜少超约 0.061。
  - 块大小 32 时，共享尺度 Layer-27 Key 矩阵背景 token 致命下溢约 44.8%（MXINT4）、约 38.4%（MXFP4）；更紧嵌套尺度（块 32）仍约 38.3% 下溢——多模态信号在离群污染区大体丢失。
  待证伪：在公开边缘 VLM / OCRBench 工作点上，视觉–文本平均幅值比可测约 34×，或块大小 32 共享尺度下 Layer-27 Key 背景 token 致命下溢可测约 38%–45%（MXINT4/MXFP4/嵌套尺度），或权值-only 路径下激活/视觉 KV 仍迫使 16-bit 逻辑面积与动态功耗主导。

CONSTRAINT: |
  难在三件事绑在同一共享尺度上：多模态通道动态范围鸿沟（约 34×）劫持共享指数；块尺度下背景 token 致命下溢约 38%–45%，注意力图被毁；权值-only 压不掉视觉 KV/动态激活，硬件仍粘 16-bit。
  约 44.8% / 38.4% / 38.3% 下溢与约 34× 幅值鸿沟是端点观测，不是可被「平均量化误差」抹平的代理：不得以平均位宽或权值比特数判过。
  Batch=1 / 纯文本 reduced-bbox（仅文本通道、仅权值压缩）不等于多模态全信封；全信封含视觉+文本激活、视觉 KV、以及 OCRBench/任务端点。
  本卡不并入 P-0143、P-0167。只说明与边缘低比特/压缩侧同源张力，不是机制。
  禁止提出逐 token 尺度、双路径量化、混合精度乘法单元、视觉–文本分通道格式或任何具体量化/数据通路机制；只问「多模态动态范围鸿沟 + 共享尺度致命下溢 + 权值-only 仍粘 16-bit」是否同时承重失败。
  证伪条件：若公开工作点上标准块共享尺度已使视觉–文本同块下溢可忽略且 OCRBench/任务指标相对未量化基线无明显崩坏、或权值-only 已足够使激活/视觉 KV 不再主导面积与动态功耗，则本问题不成立。
  及格线：以 OCRBench/任务指标与激活保真（下溢率、注意力图是否被毁）对照全信封。下溢率与动态范围鸿沟是端点不是可被均值抹平的观测；Batch=1 / 纯文本 reduced-bbox 不得冒充多模态全信封。不以权值比特数或平均量化误差代理代替。
