CONTEXT: |
  父问题能写 v_3(δ)、G mod 3，是因为信封把请求标签写成地址的等差数列。
  现在问「标签 ∈ Z 且成一条等差列」这个前提在可测作业上占多大比例。
  硬件仍冻：120 core / 384 DMC / 18432 bank，8GiB，512B，outstanding 128。

SYMPTOM: |
  定义：8GiB 窗内全部请求的标签集合 T。
  最长等差子列 AP* 对信封合法步长取最大；p_AP = |AP*| / |T|。
  - 纯 stride 扫描：p_AP=1（公理，不是测量）。
  - 待测：扫描请求与对象/句柄请求按实际发出比例混合，测 p_AP。
  - 判定阈值 0.5：若 p_AP<0.5，则 3-adic 塌缩是信封特有症状，
    n_DMC 按 3 切开或 8→3 直方图都不应再作为该作业的合格项。
  - 若 p_AP≥0.5，前提成立，本问题关闭。

CONSTRAINT: |
  禁止把「改成对象 ID / 随机句柄」写成寻址设计。
  只问前提在数字上是否测得到。
  证伪条件：在该 8GiB 作业上测得 p_AP≥0.5，则本问题不成立。
