generality_score: 8
同源:
  - arXiv:2609.07059 p.1-3
  - P-0141

CONTEXT: |
  接 P-0141 脉络：模拟 CIM 阵列乘加本身可扩，但端到端精度与吞吐常被 ADC/外围而非阵列芯核限制。
  精度同时绑在 ADC 分辨率、噪声与动态范围上；开关电容等比特流路径还受相关噪声影响。
  精度常靠拉长比特流 N 换得，延迟随之线性上升。

SYMPTOM: |
  - 系统瓶颈落在 ADC/外围而非阵列：抬精度直接抬 ADC 成本与能量。
  - 开关电容比特流存在相关；精度随比特流长度 N 改善，延迟 ∝ N。
  - ViT-Base 公开点：模拟路径 Top-1 约 84.48% 对 BF16 约 84.51%，精度接近但以更长 N/更高外围开销换得。
  待证伪：在公开 ViT/CIM 工作点上，ADC/外围能量或面积相对阵列可测主导，
  或达到与 BF16 可比精度所需 N 使延迟相对数字基线不可接受。

CONSTRAINT: |
  难在：阵列线性乘加便宜，ADC/噪声/量程把精度标价到外围；拉长 N 保精度同时拉长延迟。
  禁止提出具体 ADC 架构或去相关电路；只问「精度—ADC 代价—延迟∝N」是否同时承重失败。
  证伪条件：若公开模型上低成本 ADC/短 N 即可对齐 BF16 精度，且外围不再主导能量/面积，
  则本问题不成立。
