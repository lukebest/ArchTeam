generality_score: 8
同源:
  - arXiv:2609.04266 p.1-3

CONTEXT: |
  对象是 Transformer attention 的 score→weight：每个 head/层反复做 softmax。
  存内计算阵列可自然产出模拟分数电压/电流，但 softmax 需要非线性指数再加向量级归一化。
  常规路径常在模拟 CIM 输出与数字 softmax 之间插入转换。

SYMPTOM: |
  - 序列长度与模型规模上升后，指数与归一化成为不可忽略的开销（相对矩阵乘本身）。
  - 模拟分数到数字 softmax 的转换路径付出 ADC/接口代价；不做转换则指数律只在弱反型成立，
    输入逼近中/强反型后 I–V 偏离指数，可用输入电压动态范围被压缩。
  - 弱反型路径还受温度依赖、漏电、尾电流精度、失配、以及「全部输入器件必须留在目标工作区」约束，
    实际可用区间更窄。
  - 公开 128 路并行后仿量级：时延约 242.97 ns、总功率约 13.44 mW（约 25.5 pJ/输出元）、
    相对理想 softmax 的 RMSE 约 24.46 mV；单元约 70.2 µm²、含共享结构的 128 路约 9453.42 µm²。
  待证伪：在公开 head/序列工作点上，CIM 模拟分数接数字/混合 softmax 时转换+归一化开销
  相对理想片内指数路径可测，或弱反型可用动态范围不足以覆盖该工作点分数分布。

CONSTRAINT: |
  难在：CIM 擅长线性乘加，softmax 要的是指数+向量归一化；中间夹一层转换就把存内收益吃掉一截。
  弱反型指数窗与真实 score 分布不对齐时，不是「再训一下」能拉宽的物理工作区。
  禁止把问题改写成具体指数电路；只问转换代价与工作区是否承重。
  证伪条件：若公开工作点上模拟分数可在目标工作区内完成指数+归一化，
  且无片外/数字 softmax 时延迟与能量不成为 attention 主项，则本问题不成立。
