generality_score: 7
同源:
  - arXiv:2609.01948 p.1-3
  - P-0135

CONTEXT: |
  接 P-0135：训练仍想用同一物理阵列既做前向也做反传。
  两条常见缓解路径都默认「器件足够线性」或「网络能吞掉非理想」；反传还要求权重矩阵的转置数据通路。

SYMPTOM: |
  - 仅靠更线性的器件工艺缓解非理想性，会绑定特定先进制程与材料，跨代/跨厂可移植性差。
  - 噪声感知训练强烈依赖器件线性度：公开非线性度扫描上，线性度从「可训」掉到「精度崩溃」
    时，任务精度相对理想线性基线可掉数个点以上，收敛轮数发散或早停失败。
  - 同阵列加速反传需要权重矩阵的转置数据通路；无反向数据流时反传无法在阵列内完成，
    被迫回到片外搬运，抵消算存靠近相对片外往返的数量级收益。
  待证伪：存在公开非线性度阈值，低于该阈值时噪声感知训练精度崩溃；且同阵列反传
  在无转置/反向通路时必须片外往返（往返次数 ≥ 每层 1 次量级）。

CONSTRAINT: |
  难在：工艺绑定与噪声感知训练两条路都把「线性度够好」当前提，线性度掉了就同时失效。
  同阵列反传把拓扑问题（转置/反向数据流）叠在器件非理想之上，不是多训几轮能替代的。
  禁止提出具体电路或训练算法；只问前提是否承重。
  证伪条件：若存在不绑定特定先进工艺的路径，在公开非线性度范围内仍收敛且精度不崩，
  且同阵列反传在无额外反向数据通路时仍成立，则本问题不成立。
