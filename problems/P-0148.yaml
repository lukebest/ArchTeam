generality_score: 8
同源:
  - arXiv:2609.05982 p.1-3

CONTEXT: |
  对象是 CGRA 上的数据流映射：PE 阵列算力可扩展，但片上/端口内存口数有限。
  多簇并行会抬高内存利用率，却引入副本同步与启动间隔（II）代价。
  小内核与大 GEMM 对端口压力表现不同。

SYMPTOM: |
  - 2×2 内核在内存口受限时，理论 MII 4 被抬到实际 II 5（多一拍等待口）。
  - 6×6 gemm：cluster=1 加速约 1.15×、MUR 约 8.33%；cluster=6 加速约 1.56×、MUR 约 50%，
    吞吐抬升伴随端口与副本压力同步上升。
  - 多簇副本同步开销可达约 68×4 bit 量级交换，吃掉部分并行收益。
  待证伪：在公开 CGRA 端口配置下，小内核 II 相对 MII 可测恶化，或提高 cluster 数后
  MUR/加速比提升不足以抵消副本同步与端口争用。

CONSTRAINT: |
  难在：算力按 PE 扩展，带宽按内存口封顶；多簇抬 MUR 的同时把同步与 II 一起抬高。
  禁止提出具体端口仲裁或副本协议；只问「口数上限 vs 多簇并行」是否同时承重失败。
  证伪条件：若在同等端口下 II 可回到 MII，且 cluster 增大时同步开销相对计算可忽略，
  则本问题不成立。
