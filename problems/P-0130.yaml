CONTEXT: |
  S∈{1.5MiB,2MiB} 上 n_DMC 能从 6/3 回到 384，靠的是 8GiB 窗口里 S=2MiB 仍有 K=4096 个点，
  冻结线以上还有未冻位去填 128 个 2 幂档。
  现在不问索引怎么取位，问这个「窗口足够大」的前提在可测作业上是否成立。
  若真实工作集 W 使得 K=W/S 在 S=2MiB 上 <128，则像集基数 ≤K <128，
  n_DMC 上界 <384，384 合格项是空的。

SYMPTOM: |
  128 档的下界：S=2MiB 时需要 K≥128，即 W≥128×2MiB=256MiB。
  - 信封：W=8GiB，K=4096≥128，前提满足（公理，不是测量）。
  - 待测：公开 decode/推理工作集（单请求 KV+权值驻留，或单作业 footprint）。
    13B 级 S≈2048 单序列 KV 约 1.7GB；若实际 W 取 64–128MiB 量级，
    S=2MiB 上 K=32–64 <128。
  - 判定阈值：若公开工作点上 p(W<256MiB)≥0.5，则「128 档能满」在生产 footprint
    上不成立；该工作点占用应由 min(384,K) 解释，不是由索引窗口位置解释。
  - 若公开工作点 W 均 ≥256MiB，前提成立，本扩展关闭。

CONSTRAINT: |
  禁止改映射，禁止把「加大作业窗口 / 改组数」写成机制。
  只问 W 与 256MiB 的关系在公开工作点上测得到、否得到。硬件仍冻。
  难在：信封把 8GiB 写成公理，但公理没有对照真实 footprint；
  没有 K≥128 这一条，384 合格项的对象体积未知。
  证伪条件：若所有公开工作点 W≥256MiB（S=2MiB 时 K≥128），
  则「窗口足够大」成立，本问题不成立。
