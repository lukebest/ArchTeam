同源:
  - P-0103
  - drafts/D-0103-M4-foundational

CONTEXT: |
  信封把作业写成 8GiB。8GiB=2^33 B，地址的 4GiB 位（bit 32）在 S=2MiB=2^21 时
  于 8GiB 窗内翻转 2 次。满 128 个 2 幂档暗含这一位仍在走。
  现在不问索引怎么取位，问「工作集是 8GiB」这个前提在可测作业上是否成立。
  工作集 ≤4GiB 时该位冻结。120 核若同相位，公共冻结高位把全机打成同一组相位。

SYMPTOM: |
  - W=8GiB、S=2MiB：K=4096，4GiB 位翻转 2 次。
  - W≤4GiB、S=2MiB：K≤2048，4GiB 位恒 0。若 128 档依赖这一位与中段位的组合，
    冻结后 |组| 是否仍 128 是待测项。
  - 120 核同相位：公共冻结高位不提供核间差，120×128 在途落在同一相位类。
  - 公开对照：13B 级 S≈2048 单序列 KV 约 1.7GB；端侧/单请求 footprint 常 <4GiB。
  判定：若公开工作点上 p(W≤4GiB)≥0.5，且该条件下 S∈{1.5MiB,2MiB} 上 |组|<128
  或 120 核同相位使 min/mean BW<0.85，则 8GiB 窗是信封特有前提。
  1.5MiB 与 2MiB 分列（≤4GiB 时两行冻结图案不同，不得平均）。

CONSTRAINT: |
  禁止改映射，禁止把「加大窗口 / 改取位」写成机制。
  只问 W≤4GiB 时 4GiB 位冻结、120 核同相位，组数与 BW 是否仍达标。
  硬件仍冻。只用公开 footprint。
  证伪条件：若公开工作点均 W>4GiB，或 W≤4GiB 时 S∈{1.5MiB,2MiB} 上 |组|=128
  且 min/mean BW≥0.85（两行各自，不得平均），则「8GiB 窗」成立，本问题不成立。
