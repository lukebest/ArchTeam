generality_score: 8
同源:
  - arXiv:2609.14092 p.1-3

CONTEXT: |
  对象是边缘推理：功耗与时延一阶；同一层内各输出元素的非零匹配计数可差数倍——输出矩阵上负载极不均。
  VGG-16 中层卷积（256→256、3×3，im2col 成 3136×256 GEMM；图示 128×128 裁剪）：激活稀疏约 63.0%、全局剪枝权重约 80%，剩余有效非零匹配仍不均；16×16 tile 可同时装高/低负载元素。
  纯 ANN（MAC）快但耗电；纯 SNN（多时间步累加）单次运算能量更低但时延随 T 缩放——层内各元素能-时权衡不均。
  整层 ANN/SNN 切换：一侧干活另一侧空转；评测中 PE 利用率约 40–45%。
  固定 tile 路由仍迫使每 tile 单模式；更细粒度若依赖有损 ANN→SNN 转换，则按被路由元素烧精度——无层级平均可掩盖误差。

SYMPTOM: |
  - 同层输出元素有效非零匹配可差数倍；VGG-16 中层约 63.0% 激活稀疏 + 约 80% 剪枝后，剩余匹配仍不均，16×16 tile 混高低负载。
  - 纯 ANN 能耗高、纯 SNN 时延随 T 涨；元素级能-时权衡不一致，整层单模式必留下一边浪费。
  - 整层混合：一侧核工作另一侧空闲，评测 PE 利用率约 40–45%。
  - 固定 tile 仍一 tile 一模式；有损转换到更细粒度时，误差无层级平均可藏，逐元素精度风险一阶。
  待证伪：在公开边缘稀疏推理工作点上，同层元素匹配负载可测差数倍，或整层/固定 tile 混合 PE 利用率可测停在约 40–45%（或同类空转）量级，或有损细粒度路由相对层级平均使精度可测劣化。

CONSTRAINT: |
  难在：元素级能-时不匹配与粗粒度混合空转同时成立；tile 仍锁单模式；有损细粒度又把误差暴露到无平均可藏的单元素。
  禁止提出 ANN→SNN 无损/有损转换、元素级路由/调度、双核共执行或任何具体混合执行机制；只问「元素级能-时不均 + 整层/tile 粗粒度空转 + 有损细粒度无平均可藏」是否同时承重失败。
  证伪条件：若公开工作点上同层元素匹配已近似均匀、或整层/tile 混合 PE 利用率已接近满占用且无空转核、或细粒度模式切换不引入可测精度损失且不依赖有损转换，则本问题不成立。
  及格线：以层内元素负载分布、PE 利用率、端到端能耗/时延与精度对照；不以层平均稀疏率代理代替元素级不均与粗粒度空转。
