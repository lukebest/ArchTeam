CONTEXT: |
  冻结信封：120 core / 384 DMC=2^7×3 / 18432 bank=2^11×9 / 每 DMC 48=2^4×3 bank；
  8GiB 共享；512B；outstanding 128；stride 1B～2MiB。不能改带 3 的资源个数。
  假设 S=3·2^k 上 n_DMC 已回到 min(384,K)，X_rel=1。不是在问怎么再映。

SYMPTOM: |
  - 100% good、S=2MiB：K=4096，bank 占用上界 22.2%（鸽笼）。发行队列 15360/384=40/DMC。
  - 1/3 图案坏 bank：每 DMC 48=16×3 中一整奇类 16 bank 全坏。
    即便控制器占用已回到 384，重试只改 bank、不改控制器时，
    流量可再对齐到同一奇类，有效存活 32/48≈66.7% 或 16/48≈33.3%。
  待证伪：X_rel=1 之后，S=2MiB 占用仍被 22.2% 锁死，或 40/DMC 成为发行墙，
  或 1/3 图案把重试重新对齐到单一奇类，min/mean BW 越出 0.85。

CONSTRAINT: |
  硬件冻住，不能改带 3 的资源个数，不能跨 DMC steal。禁止再写新映射。
  难在：奇数剩余冻结置零之后，剩下 bank 基数鸽笼、每控制器队列 40、
  以及 1/3 图案再相关，都不随映射改变。
  证伪条件：若满分假设之后，100% good 下所有 stride 的 min/mean BW≥0.85
  且 40/DMC 不构成发行上限，并且 1/3 图案不把重试再对齐到单一奇类，则本问题不成立。
