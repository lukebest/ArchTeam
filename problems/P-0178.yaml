generality_score: 8
同源:
  - arXiv:2609.17556 p.1-3

CONTEXT: |
  对象是卫星/任务关键边缘：轨道上连续穿过功率、辐射与环境分区，且无人干预。日食使太阳能消失，辐射强度随轨道区域变，观测分布随周期、光照与传感器老化漂移。
  高能粒子在推理期间以 SEU 改写片上存放的网络参数；故障概率随时间连续变化，不是全任务常数。全程同一套保护：低风险窗浪费算力与能耗，高辐射窗可能不够。
  ViT 故障注入呈高度不均匀：多数比特故障功能无害，一小部分沿残差与共享表示打出 NaN/Inf，整条计算流失效；置信度估计或后处理救不了，因为流本身已无效。常规 TMR 假定静态条件与固定开销。
  ViT 编码器残差是严格加法；每块 LayerNorm 做 2 次（MHSA 入口 1 次、MLP 入口 1 次），γ/β 跨 token 共享，单点故障可放大到整批。现有边缘加速器是静态流水加固定资源分配，不打断推理就难以切换执行形态。

SYMPTOM: |
  - 日食窗口太阳能供给掉到 0；辐射随轨道区连续变化。全程 1 套保护：低风险窗多付算力/能耗，高辐射窗可能不足。观测分布随周期、光照、传感器老化漂，且不能靠人工干预。
  - ViT 故障注入：多数比特故障功能无害，少数沿残差加共享表示传播 NaN/Inf，整条计算流无效；置信度或后处理无法挽回。
  - 常规 TMR 按静态条件计价，开销锁定在 3 模，不随轨道风险窗口收缩。
  - 每 encoder block 残差为严格加，无中间门控；LayerNorm 在 MHSA 与 MLP 入口各 1 次（每块 2 次），γ/β 跨序列全部 token 共享，1 个 γ 或 β 故障同时缩放整批。
  - 现有边缘加速器静态流水、固定资源分配；切换执行形态会打断推理。任务关键输出直接驱动决策，中断不是可接受的性能损失。
  待证伪：在公开轨道/任务关键 ViT 工作点上，故障概率可测随时间变化而全程同一保护在低风险窗可测多付开销或在高辐射窗可测不足，或少数比特故障沿残差/共享 γ/β 可测打出无法后处理的 NaN/Inf，或静态流水在不打断推理的前提下可测无法切换执行形态。

CONSTRAINT: |
  难在：功率、辐射与输入分布三个轴同时在变，保护强度却被 TMR 一类机制锁成固定开销；ViT 的失败模式不是平均精度掉一点，而是残差严格加加上每块 2 次、跨 token 共享的 LayerNorm 把单点故障放大成整批数值崩溃。
  执行平台是静态流水与固定资源，执行形态切换与推理不中断互相排挤。三条必须同时承重：变条件、灾难性数值失效、不打断切换。
  禁止提出通道切分、多运行模式调度、子网络隔离或任何运行时自适应可靠性机制；只问「连续变化的轨道条件 + 静态固定开销保护 + 残差/共享 LayerNorm 的灾难性数值崩溃 + 静态流水切不动」是否同时承重失败。
  证伪条件：若公开工作点上故障概率近似常数且全程固定保护已同时不过税又足够、或比特故障不再产生无法后处理的 NaN/Inf、或静态流水已能在不打断推理下切换执行形态，则本问题不成立。
  及格线：以轨道窗口下的功能失效（NaN/Inf 使整条计算流无效）、功耗/算力开销与推理是否被打断对照；不以平均准确率下降代理代替灾难性数值失效，不以全程固定 3 模开销代理「低风险窗不过税、高辐射窗仍够」。
