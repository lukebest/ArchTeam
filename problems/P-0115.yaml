CONTEXT: |
  冻结信封把成功标准写成 DMC 占用 ≈1.0。这成立，当且仅当 384 个控制器是独立发行口，
  BW ≤ n_hot × μ_d。现在不问怎么铺 DMC，问「带宽是 384 个独立口之和」这个前提是否承重。
  硬件仍冻：120 core / 384 DMC / 18432 bank；8GiB；512B；outstanding 128。

SYMPTOM: |
  - 独立口模型：9 热 DMC ⇒ BW ≤ 9μ_d；384 热 ⇒ BW ≤ 384μ_d，比值 42.7。
  - 池模型：峰值 β_pool 与 n_hot 无关（只要有请求），占用比不进入 roofline。
  - 待测：人工把请求限制到 n_hot∈{9,48,128,384} 个 DMC，测 min/mean BW
    是否随 n_hot 线性，还是过早饱和到同一 β_pool。
  - 判定：若 BW(n_hot) 在 n_hot≪384 已达到 BW(384) 的 ≥85%，则 DMC 占用合格项是空的。
  - 若 BW(9)/BW(384) ≈ 9/384=2.3%，独立口前提成立，本问题关闭。

CONSTRAINT: |
  禁止改映射。只问 BW 对 n_hot 是否线性。
  难在：信封把 384 个单发行口写成公理，但公理没有对照测量。
  证伪条件：若 BW 在 n_hot∈{9,48,128,384} 上近似线性（相对 384μ_d 的误差 <15%），
  则「独立口」成立，本问题不成立。
