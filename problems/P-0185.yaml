generality_score: 8
同源:
  - arXiv:2609.21774 p.1-3

CONTEXT: |
  对象是超大规模训练跨站互联：单机房供电/散热不够，必须把数万–数十万 GPU 的集群用 WAN 连成逻辑一体；传统机内无损假设与低 RTT 重传在广域上失效。
  量级：GPT-4 约 25000 块 A100；后续报道约 15× 扩到约 20 万 GPU，路线图指向约 100 万——单数据中心电力/冷却不足 → 必须跨站互联。
  跨 WAN 时，基于重传的丢包恢复把 RTT 放大到数十毫秒量级，严重拉长流完成时间（FCT）。
  经典 in-flight 位图跟踪乱序到达：位图须覆盖全部在途包，尺寸随 BDP（固定带宽下随 RTT）近似线性增长；在 400 Gbps 与 1.6 Tbps、RTT 约 5–25 ms 时，每连接位图可达数十–数百 KiB（文献示意约 4×/5× 跃升）。
  典型 FPGA NIC 片上 BRAM 约 9 MiB（Alveo U280），部分已预留给 DMA/CMAC IP；在 WAN RTT + Tbps 速率下，BDP 规模位图迅速超出片上存储并成为数据通路瓶颈。
  多路径喷洒提高利用率，但接收端面临跨路径乱序/抖动；擦除恢复需要精确知道缺哪些包——接收状态与完成逻辑须同时在线速下撑住高带宽、多连接与乱序。

SYMPTOM: |
  - 超大规模训练：GPT-4 约 25000 A100；后续约 15× 至约 20 万 GPU，路线图约 100 万——单机房供电/冷却不足，必须跨站 WAN 互联。
  - 跨 WAN 重传式丢包恢复把 RTT 放大到数十 ms 量级，严重拉长 FCT。
  - 经典 in-flight 位图：须覆盖全部在途包，尺寸随 BDP（固定带宽下随 RTT）近似线性增长；400 Gbps 与 1.6 Tbps、RTT 约 5–25 ms 时，每连接位图达数十–数百 KiB（示意约 4×/5× 跃升）。
  - 典型 FPGA NIC 片上 BRAM 约 9 MiB（Alveo U280），部分已留给 DMA/CMAC；WAN RTT + Tbps 下 BDP 位图迅速超出片上存储并成数据通路瓶颈。
  - 多路径喷洒提高利用率，接收端跨路径乱序/抖动；擦除恢复须精确知道缺失包——接收状态 + 完成逻辑须同时撑住高 BW、多连接与线速乱序。
  待证伪：在公开 WAN / FPGA NIC 工作点上，400 Gbps–1.6 Tbps 且 RTT 约 5–25 ms 时每连接位图可测达数十–数百 KiB 并相对低 RTT 示意约 4×/5× 跃升，或约 9 MiB 级片上 BRAM（扣除 DMA/CMAC）可测装不下目标 BDP 位图并成为数据通路瓶颈，或重传路径下 FCT 可测被数十 ms 级 RTT 放大主导。

CONSTRAINT: |
  难在三件事绑在同一接收数据通路：WAN 上重传把 RTT 放大到数十 ms，FCT 被拉长；位图须覆盖全部在途包，尺寸随 BDP（BW×RTT）线性涨到每连接数十–数百 KiB，迅速打穿约 9 MiB 级片上 BRAM；多路径喷洒换利用率却把跨路径乱序/抖动与「精确缺失包」知识同时压给线速完成逻辑。
  数十–数百 KiB/连接位图与 FCT 是端点约束，不是可被「平均丢包率」抹平的代理：不得以平均丢包率或仅链路利用率判过。
  单路径 / 低 RTT 实验室 reduced-bbox（机内无损、单路径、毫秒以下 RTT）不等于 WAN 多路径全信封；全信封含目标 BW×RTT 的 BDP 状态、跨路径乱序/抖动、以及线速多连接完成逻辑。
  禁止提出 cache 化丢包跟踪、条带语义重定义、软硬协同卸载或任何具体 NIC 跟踪/擦除机制；只问「重传放大 FCT + BDP 位图打穿片上存储 + 多路径乱序下线速精确缺失知识」是否同时承重失败。
  证伪条件：若公开工作点上目标 BW×RTT 下每连接跟踪状态已远低于片上预算且不再成数据通路瓶颈、或重传路径 FCT 已不再被数十 ms 级 RTT 放大主导、或单路径/低 RTT 结论已覆盖多路径 WAN 乱序信封，则本问题不成立。
  及格线：以 FCT 与目标 BW×RTT 下的片上状态尺寸对照 WAN 多路径全信封。位图/状态尺寸与 FCT 是端点不是可被均值抹平的观测；单路径或低 RTT 实验室 reduced-bbox 不得冒充全信封。不以平均丢包率代理代替。无解法提案。
