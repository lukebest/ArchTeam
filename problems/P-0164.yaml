generality_score: 8
同源:
  - arXiv:2609.10861 p.1-3

CONTEXT: |
  对象是 AI 加速器侧 HBM：$/GB 仍约 5–10× 于商品 DRAM，容量是一阶系统成本；当可靠性目标放宽以换更低单价时，控制器需更强保护且不牺牲加速器可见服务。
  HBM 请求细粒度（加速器可见 32B 事务，聚合可达多 TB/s）；按次本地 ECC 受单次请求内冗余上限约束，加重本地冗余则每次访问都烧容量与传输。
  控制器长码字：小访问耦合到 span 级状态，并在 HBM 带宽上做昂贵译码；即便理想 2KB 聚合，3.35 TB/s → 约 1.64×10⁹ 受保护 span/s（未计奇偶流量），每个 span 都要检查，出错走完整恢复流水。
  LLM decode 读多、顺序友好，但控制器仍须保持 32B 地址/序/完成语义；公开规格不暴露统一片上校验矩阵，厂商中立 32B 片上 ECC 基线最多纠正 1 个受影响 16-bit 组。

SYMPTOM: |
  - HBM $/GB 相对商品 DRAM 仍约 5–10×，容量成本一阶；可靠性目标若放松，控制器保护强度与加速器可见服务之间张力加剧。
  - 加速器可见 32B 事务 + 聚合多 TB/s：按次本地 ECC 受单请求冗余上限；加重本地冗余 → 每次访问容量与传输开销同步上升。
  - 理想 2KB 聚合、3.35 TB/s → 约 1.64×10⁹ 受保护 span/s（奇偶流量前）；直铺长码使小访问耦合 span 状态，译码压在 HBM 带宽上，出错即全恢复流水。
  - 稀疏写相对长 span 粒度差距约 64:1；顺序读可分摊 span 工作，稀疏写仍触碰 span ECC 状态并需对每个被接受 span 做长码处理。
  - 公开规格无统一片上校验矩阵；厂商中立 32B 片上 ECC 基线最多纠正 1 个受影响 16-bit 组——控制器侧更强保护无公开片上统一矩阵可依。
  待证伪：在公开 HBM/LLM 推理工作点上，$/GB 与容量成本仍可测主导，或直铺长码在 32B 语义下相对短码基线在带宽/译码/写放大上可测恶化，或片上 32B ECC 纠正能力停在单 16-bit 组而控制器无法在不改 PHY/事务宽度下承重更高原始 BER。

CONSTRAINT: |
  难在：容量成本逼放松 binning/可靠性目标，但加速器仍要 32B 可见语义与多 TB/s 服务；本地短码冗余不够强，直铺长码又把小访问绑到 span 状态与昂贵译码；稀疏写相对长 span 约 64:1，读可分摊、写仍触状态。
  禁止提出分层内外码、差分奇偶、重要性位面 ECC 或任何具体控制器微架构；只问「$/GB 主导 + 32B 细粒度 vs 长码 span 耦合 + 稀疏写放大 + 片上基线弱」是否同时承重失败。
  证伪条件：若公开工作点上 HBM 成本不再一阶主导、或直铺长码在保持 32B 语义下带宽/译码开销可忽略、或片上 32B ECC 已足以在放松可靠性目标下维持端到端正确性与吞吐，则本问题不成立。
  及格线：以 $/GB、受保护 span 吞吐、写放大与端到端正确性/吞吐对照短码/直铺长码基线，不以中间校验延迟代理代替。