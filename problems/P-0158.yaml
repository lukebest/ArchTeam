generality_score: 8
同源:
  - arXiv:2609.09423 p.1-3

CONTEXT: |
  对象是 FPGA 上全同态加密（FHE）相对明文慢数量级；密文约 100–1000× 更大，内存带宽成瓶颈。
  密钥切换（KS）在每次乘/旋转后出现，可占运行时大头；新类方法削减 NTT 次数却抬高评估密钥内存与精度需求。
  相对延迟依赖并行度、安全参数与片上存储，内存与并行度耦合；静态选定单一 KS 方法会把可调度延迟留在桌上。

SYMPTOM: |
  - FHE 相对明文慢数量级；密文约 100–1000× 更大 → 内存 BW 瓶颈。
  - KS 可占约 80% 运行时（每次乘/旋转都要）；自举/应用含大量 mul/rotate。
  - 较新 KLSS 类削减 NTT 次数，但抬高评估密钥内存与精度；在 FPGA 上是否总优于 hybrid KS 不清晰。
  - 相对延迟随并行度、安全参数、片上存储变化；内存 vs 并行度权衡使静态单方法常非总延迟最优。
  待证伪：在公开 FHE/FPGA 工作点上，KS 占比可测主导，或静态单方法相对可切换设定总延迟可测落后。

CONSTRAINT: |
  难在：密文体积把计算推成 BW 瓶颈；KS 频率高且方法间 NTT/密钥内存/精度此消彼长；片上存储与并行度耦合，静态挑一种留下可调度延迟。
  禁止提出自适应 KS 电路、动态方法切换或具体混合调度；只问「静态单 KS + 内存/并行耦合」是否使总延迟不可接受。
  证伪条件：若公开设定上 KS 不再主导、或单一静态 KS 在内存与并行约束下已达可切换方法总延迟下界，则本问题不成立。
  及格线：以端到端延迟与片上内存包络对照，不以单一 NTT 计数代理代替。
