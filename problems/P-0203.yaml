# 中文题目: 有限并发登记槽在高扇入下溢出，授权前占槽与无序重试共同支配完成时间
generality_score: 8
同源:
  - P-0198
  - github:lukebest/bufferless-ring-noc tests/soc_sim
  - 扩展自 P-0198/M-2 横向
  - 同源但不并入 P-0198 及其他 sibling expansion cards

CONTEXT: |
  对象是共享每拍有限发送权、无深度队列的环状或总线状介质上的 LLM/HPC 集合通信：N 个源先登记同一事务的成员，成员齐备后才进入可注入阶段；有限并发登记槽数为 K，表满或超时则进入无序竞争。该结构不依赖某一 SoC 桥的专名。
  对照范围为 N∈{8,12,16}、K∈{2,4,8} 的 gather、allreduce 与置换类集合，并以同 N 的广播/扇出作对照；缓冲式虚通道很深的信封不在范围。
  源对照信封为 bufferless-ring-noc tests/soc_sim 的 DV200：12 top + 2 bottom、每方向每拍单槽、多环互联；公开基线中的均匀读与集合症状用于量纲对照。

SYMPTOM: |
  - 当 N=12、K=4 且同时活跃事务数大于 4 时，每源发送权的几何上界约为 1/N≤8.3%；若溢出回退占比 p_fb≥30%，或回退重试占比≥50%，完成时间被无序竞争主导。
  - 公开对照中，512 B、12+2 的均匀读 makespan 约 4403.2 ns，峰值后 goodput 降至约 2.8–3.4 TB/s；多类扇入集合 collapsed=true，而广播约 117.76 B/ns 未崩。
  - 成员尚未齐备的阶段若仍占用共享介质，使有效注入机会相对“齐备后才占用”的测量对照下降≥10%，则完成时间同时受授权前占槽与 K 槽溢出影响。
  - 端点需分别报告扇入完成时间、每源成功率、回退比例、失败重试比例，并与 N 相同的扇出完成时间对照；不能以字节量除以峰值带宽替代这些数值。

  待证伪：在 N∈{8,12,16}、有限并发登记槽的公开工作点上，若扇入完成时间均可由字节量/介质峰值解释，且 p_fb 与授权前占槽对照均不可测主导，则本问题不成立。

CONSTRAINT: |
  不把问题限定为某一桥芯片或某一控制表；难点是有限并发登记与共享单槽介质的耦合，而不是某个实现名词。不得把剩余症状改写为登记信息还未到达。
  扇入完成时间、完成数、p_fb、失败重试比例与有效注入机会是 endpoints；介质峰值带宽、平均利用率或只报扇出成绩是 proxies，endpoints ≠ proxies。
  只测 N=2、K≥N、深度队列可吸收突发，或不含扇出对照的实验属于 reduced-bbox，不等于 N∈{8,12,16}、K∈{2,4,8}、无深度队列的 full envelope；reduced-bbox ≠ full envelope。
  若采用 0.85，0.85 is pass bar, not measured mean；不得用单一 N 或单一集合类的结果替代整个 N/K 范围。
  同源但不并入 P-0198 及其他 sibling expansion cards；  证伪条件同 SYMPTOM 末行。不得用扇出成绩或平均利用率冒充扇入端点过线。
  无解法提案。
