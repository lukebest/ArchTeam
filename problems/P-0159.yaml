CONTEXT: |
  接 P-0153 脉络：全连接（FC）数字退火机每步要么付 N² 权重带宽，要么串行扫遍全部 N 个自旋；N 到数千时周期/面积/功耗一起炸。
  近期 FC 数字退火器约 512–576 自旋、亚 400 MHz，即便多芯片仍数百 mW 量级。
  N² 串行化使单次退火延迟达数千周期；并行路径要 N 路 mux + N² 权重读——数百自旋以上难以维持。

SYMPTOM: |
  - 近期 FC 数字退火器约 512–576 自旋、亚 400 MHz，仍数百 mW（含多芯片）。
  - N² 串行 → 单次退火延迟数千周期；并行路径 N mux + N² 权重读，数百自旋以上难承。
  - 稠密约 2000 自旋图：不论实际翻转多少，每温度步约 2000 周期。
  - GPU SA 基线约 52.8 W、单次退火数百 ms——相对专用路径约 3 个数量级功率叙事落差。
  待证伪：在公开稠密 FC 退火点上，每步周期随 N 线性/平方可测膨胀，或面积/功耗相对 GPU SA 功率差距不可接受。

CONSTRAINT: |
  难在：全连接要每步见全体权重或串扫全体自旋；并行化把 N² 读与 N mux 推到面积墙，串行化把延迟推到数千周期。
  禁止提出具体稀疏化、分块退火或专用互连拓扑；只问「FC N² 带宽/串扫 + 千自旋规模」是否同时不可接受。
  证伪条件：若公开千自旋稠密实例上每温度步周期不随 N 膨胀、且专用数字退火功耗/延迟相对 GPU SA 无数量级落差，则本问题不成立。
  及格线：以每温度步周期、面积/功耗端点对照，不以代理翻转率代替。