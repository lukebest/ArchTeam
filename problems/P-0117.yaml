generality_score: 8
同源:
  - P-0103
  - P-0006
  - drafts/D-0103-M1-horizontal

CONTEXT: |
  对象是 mesh/HBM 集体通信，或 decode 把逐步 KV 按 token/rank 下标铺到通道。
  不是 DRAM 内部 bank 映射。
  等差到达 G_k=G0+kδ，资源个数 N 含奇数因子时，δ 与 N 共享该因子则像落进一个剩余类，
  占用 |im|≤N/gcd(δ,N)。
  同构：token/rank 步长为 3 的倍数，或通道/mesh 维个数本身含因子 3。
  只用公开模型和公开 (B,S)。

SYMPTOM: |
  13B 级、S≈2048 时单序列 KV 约 1.7GB。
  - HBM C=8 或 16：gcd(d,C)=g>1 时占用 C/g。C=8、d 偶数：占用 4，通道 max/min≥2。
  - 通道组或 2D mesh 某一维含因子 3（维长 3，或 C=12=4×3）：
    步长为 3 的倍数时该轴占用掉到 C/3（C=12→4；维长 3→1）。
    按满通道 bytes/β 记账时，时间约差 ×3。
  待证伪：存在公开 (B,S)，使步长与资源个数共享因子 3 时占用 <C，
  且每 token 时间不能用满通道 bytes/β 解释。

CONSTRAINT: |
  不改通道内部 bank 映射，不写成 DRAM 交织移植。
  难在流量是等差的、模数固定且含奇数因子，像集由 gcd 锁死，与 2 幂轴是否打散无关。
  证伪条件：若所有公开工作点上，即便步长与资源共享因子 3，占用仍 =C
  且时间由满通道带宽解释，则该同构不成立。
