generality_score: 8
同源:
  - arXiv:2609.09746 p.1-3

CONTEXT: |
  对象是虫洞路由正确性：需要路径存在，且允许路径之并不得形成资源循环依赖。
  6 度三角格：基本环与最短路径扇区不同于正交网格；周期商图存在非可缩通道环；正交网格理论不可直接套用。
  单条静态双向链路故障在路由纪元前已知时，希望相对健康最短路径跳数 ≤+1，且同 VC 数与全连通。

SYMPTOM: |
  - 6 度三角格基本环与最短路径扇区 ≠ 正交网格；周期商图有非可缩通道环——正交理论不可复制粘贴。
  - n≥3 环面：仅 1 条虚通道仍留下有向哈密顿资源环。
  - 既有六角环面族声称 3 个 VC 类使 CDG 无环；在所述规则下复现发现同型/同 VC 的有向资源环反例。
  - 单条静态双向链路故障已知：目标 ≤+1 跳相对健康最短，且同 VC 数与全连通——既有正交结论不自动成立。
  待证伪：在公开三角/六角环面设定上，既有 VC 类声明可测出现有向资源环，或故障下同 VC 无法同时保全连通与 ≤+1 跳。

CONSTRAINT: |
  难在：正确性要路径存在且允许路径并无环；三角格环结构与正交网格不同，正交 VC 理论不能搬；故障下还要同 VC 保连通与跳数上界。
  禁止提出具体新路由函数、额外 VC 分配或自适应避障机制；只问「非正交格 + 既有 VC 声明 + 静态故障 ≤+1 跳」是否同时不可接受。
  证伪条件：若公开复现下既有 3 VC 六角族确无有向资源环，且静态单链路故障下同 VC 已同时满足全连通与 ≤+1 跳，则本问题不成立。
