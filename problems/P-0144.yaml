generality_score: 8
同源:
  - arXiv:2609.04724 p.1-3
  - P-0143

CONTEXT: |
  同一边缘 LLM 加速问题，数据流通路是输出静止脉动阵列：按组量化的权值按列流入。
  组边界与列（输出通道）的对齐关系决定 rescale 要复制多少份。

SYMPTOM: |
  - 组边界通常与列不对齐时，同一列跨越多个 scale，相邻 PE 常需不同 rescale。
  - 若每 PE 复制 rescale，面积开销随阵列边长恶化：16 nm FinFET、TPU 类 N×N 上，
    逐 PE rescale 在 32×32 核面积开销约 32.1%。
  - 逐列共享 rescale 在 32×32 低于约 1%，并随 N 增大按 1/N 下降——但前提是组边界与列对齐；
    不对齐时共享列量表会算错。
  待证伪：在公开按组量化配置与 32×32 级脉动模型上，组–列不对齐迫使逐 PE rescale，
  核面积开销 ≥约 30%，或为共享 rescale 而改组边界导致精度掉出合格线。

CONSTRAINT: |
  难在：量化组是算法对象，脉动列是硬件对象，两者边界不对齐时面积与正确性互斥。
  禁止把「改成逐列一个 scale」写成无代价机制（那是回到粗粒度，见 P-0143）。
  证伪条件：若公开按组量化在 32×32 上可与列对齐，使 rescale 面积开销 <1% 且精度不掉，
  则本问题不成立。
