generality_score: 8
同源:
  - arXiv:2609.19859 p.1-3

CONTEXT: |
  对象是 Posit 融合乘加（fused MAC）：为保证无中间舍入与长序列不溢出，依赖覆盖全动态范围的宽定点累加器（quire）；但挂上如此大的累加器会带来显著面积与功耗。
  文献量级：quire 寄存器及相关运算约占 Posit 算术单元面积一半；其位宽也显著拉长累加延迟，限制 Posit MAC 吞吐。
  除 quire 外，乘法级仍主导单元面积/功耗/延迟，进一步卡住可达成时钟。
  标准 es=2：Posit32 quire 宽 512 bit，Posit64 为 1024 bit——宽累加是高频融合路径上的一等公民约束。
  单一高性能前缀加法器：低延迟、高功耗/面积；多段流水累加：时钟更高，但对短序列因多级进位付出严重延迟代价。

SYMPTOM: |
  - Posit 融合 MAC 依赖覆盖全动态范围的宽 quire，以避免中间舍入并支撑长序列不溢出；挂上该累加器后面积与功耗显著上升。
  - 文献量级：quire 寄存器及相关运算约占 Posit 算术单元面积约 1/2；位宽同时拉长累加延迟，限制 MAC 吞吐。
  - 乘法级仍主导单元面积/功耗/延迟，可达成时钟被进一步卡住。
  - 标准 es=2：Posit32 quire 宽 512 bit，Posit64 宽 1024 bit。
  - 单前缀加法器路径：低延迟但高功耗/面积；多段流水累加：时钟更高，短序列上多级进位使延迟代价严重——短序列延迟与时钟不可免费兼得。
  待证伪：在公开 Posit MAC / es=2 工作点上，quire 相关逻辑可测约占算术单元面积约 1/2，或 Posit32/64 的 512/1024 bit quire 位宽可测拉长累加关键路径，或乘法级可测主导面积/功耗/延迟并限制时钟，或短序列上多段流水相对单前缀路径可测付出显著延迟代价。

CONSTRAINT: |
  难在 quire 宽度与乘法级关键路径同时绑定：无中间舍入/长序列不溢出要求全动态范围宽累加（512/1024 bit），其面积约半单元且拉长延迟；乘法级又主导面积/功耗/延迟，卡住时钟；短序列延迟与高时钟在单前缀 vs 多段流水之间不可免费兼得。
  quire 位宽与面积占比、乘法级主导的延迟/功耗是端点约束，不是可被「平均操作延迟」抹平的代理：不得以平均 MAC 延迟或仅长序列吞吐判过。
  短序列 / 单前缀 reduced-bbox（只看长序列吞吐、只看某一加法器拓扑）不等于全信封；全信封含短序列延迟、可达成时钟、quire 面积与乘法级关键路径。
  禁止提出截断 quire、近似累加、分段重编码、乘法级流水重排或任何具体 Posit 算术单元机制；只问「宽 quire 面积/延迟 + 乘法级主导关键路径 + 短序列延迟 vs 时钟不可兼得」是否同时承重失败。
  证伪条件：若公开工作点上 es=2 Posit32/64 的 quire 已不再占算术单元约半面积且不拉长累加关键路径、或乘法级已不再主导面积/功耗/延迟并可在短序列上同时保住低延迟与高时钟，则本问题不成立。
  及格线：以 quire 宽度带来的面积与累加延迟、乘法级关键路径、以及短序列端到端延迟对照全信封。quire 宽度与乘法级路径是绑定端点；短序列 reduced-bbox 不得冒充含长/短序列与时钟的全信封。不以平均 hop 式的平均 MAC 延迟或仅权重量化代理代替。无解法提案。
