# 中文题目: 每拍单发送权的环/总线介质上，N 源扇入把每源注入上界压到约 1/N（N=12 时 ≤8.3%），完成时间相对单源 ≥N 倍
generality_score: 8
同源:
  - P-0198
  - github:lukebest/bufferless-ring-noc tests/soc_sim
  - 扩展自 P-0198/M-1 横向

CONTEXT: |
  对象是共享「每拍单个发送权」的环状或总线状介质上的 LLM/HPC 集合通信，不是某一具体 SoC 的专用控制电路。N 个源在扇入相争同一方向的发送权；无深度队列吸收突发。
  数学结构与父问题同构：零和单槽 × 多源扇入 → 注入成功率由可注入机会的几何份额决定，而不是由源端窗口大小单独决定。可注入机会在不同实现里可表现为空槽、令牌或时隙，代数角色相同。
  公开对照域包括：无缓冲/轻缓冲环上的 gather 与 alltoall、环上 allreduce、token-ring 风格介质、每拍单 grant 的片上或板级互连。缓冲式虚通道深度很大的信封不在本卡范围。

SYMPTOM: |
  - N 源扇入、每拍 1 个发送权：无份额再分配时，每源注入成功上界约 1/N；取 N=12（对照 DV200 top die 数）时单源成功率 ≤8.3%，完成时间相对单源理想情形 ≥12×。
  - 父问题公开基线对照：bufferless 环上 gather / alltoall 等在扫描设定下 collapsed=true；broadcast 未崩（峰值约 117.76 B/ns）——扇出与扇入不对称，不能用同一峰值带宽解释。
  - 同构待测：在 N∈{8,12,16} 的环 allreduce / gather 工作点上，若不显式保留每源发送权份额，扇入相完成时间是否由发送权争用主导（失败重试占比 ≥50%），而同样 N 的扇出/广播不被同一机制主导。
  - 端点：扇入完成时间、每源注入成功率、失败重试占比；并与同 N 的扇出/广播对照。
  待证伪：存在公开环或单 grant 集合工作点，使扇入完成时间不能用「字节量 / 介质峰值」解释，而必须用约 1/N 的发送权争用解释；若不存在，则该同构不成立。

CONSTRAINT: |
  不把本问题写成某一 SoC 控制电路的移植；不预设源端窗口、显式拥塞标记或令牌桶为解法。
  难在介质每拍只有一个可注入机会，扇入把 N 路需求压到 1 路上，空机会不会因拥塞本身自发增加。
  扇入完成时间与每源成功率是 endpoints；介质峰值带宽、平均利用率或只报扇出成绩是 proxies，endpoints ≠ proxies。
  只测 N=2、或深度队列已吸收突发的实验属于 reduced-bbox，不等于 N∈{8,12,16}、无深度队列、扇入+扇出对照的 full envelope；reduced-bbox ≠ full envelope。
  及格判定若采用 0.85，0.85 是 pass bar，不是 measured mean。
  同源但不并入 P-0198：P-0198 钉 DV200 无缓冲环信封；本卡问同一零和单发送权结构是否在更广的环/总线集合域上成立。
  无解法提案，不提出份额调度、令牌分配、窗口调节或其他具体机制。
