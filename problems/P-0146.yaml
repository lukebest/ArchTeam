generality_score: 7
同源:
  - arXiv:2609.05226 p.1-3
  - P-0145

CONTEXT: |
  接 P-0145：缓解路径包括地下屏蔽、能隙工程、悬空比特、逐比特准粒子势垒/陷阱、衬底声子势垒/沟槽。
  单芯片上会嵌入越来越多彼此独立的逻辑比特 / QEC 码块。

SYMPTOM: |
  - 衬底声子势垒/沟槽等若按逐比特铺满，制造成本随比特数线性上升，性价比差。
  - 铝条势垒实验衰减约在 2–100×，宽度约 10–100 µm；工程上可实现的渗透率质量因子大致落在 bp∈[0, 0.01]。
  - 若码内「逻辑相邻」的物理比特在芯片上仍挤在一起，一次局部辐射团更容易同时打中同一码的多个相关位置。
  待证伪：在公开 bp∈[0, 0.01] 与码块布局下，逻辑相邻比特的物理聚集使相关击中率
  相对打散布局可测上升，或逐比特加固成本随比特数线性不可接受。

CONSTRAINT: |
  难在：加固按比特线性计价，而相关错误按空间团计价；逻辑邻接与物理邻接重合时最伤。
  禁止提出具体势垒几何；只问布局与加固前提是否承重。
  证伪条件：若在 bp≤0.01 下，逻辑相邻比特物理打散后相关击中可忽略，
  且加固成本不随比特数线性爆炸，则本问题不成立。
