CONTEXT: |
  冻结信封：120 core / 384 DMC=2^7×3 / 18432 bank；8GiB 共享；512B；
  每核 outstanding 128（整机 15360）；stride 1B～2MiB。父问题：δ≡0 (mod 3)
  时整数取模把 n_DMC 切到 min(384,K)/3。
  旧上界：S=1.5MiB 上 n_DMC=6，S=2MiB 上 n_DMC=3（索引吃不到冻结线以上的位）。
  假设这两个工作点上 2 幂方向 128 档已满，再乘奇数坐标，n_DMC=384。
  不是在问「6 或 3 怎么变 384」，是在问 384 已经回来之后立刻露出的下一层。

SYMPTOM: |
  - 奇数坐标直方图偏置 {2,1,1}：128 档已满时，三类占用 2:1:1，热类 1.5×，
    min/mean 期望 ~0.7 < 0.85。主指标 n_DMC=384 成立，次指标 BW 比仍越线。
  - 128 档共享一个公共高位。该位在 8GiB、S=2MiB 上只翻转 2 次
    （K=4096，步长 2^12）。公共位相关，|{组}|=128 不等于 128 组均匀；
    热组/冷组比可 >1，不随「组数满了」消失。
  - S=2MiB 银行层鸽笼仍 4096/18432=22.2%。partial-good 下 120 核争 1R
    存活位图（100% good 跳过）。1/3 图案类上，两次独立重试仍可停在被杀类。
  待证伪：n_DMC=384 之后，S∈{1.5MiB,2MiB} 上 min/mean BW 仍 <0.85（偏置或公共高位相关），
  或 22.2% 鸽笼/120:1 位图口成为发行墙。

CONSTRAINT: |
  硬件冻住，不能改带 3 的资源个数，不能跨 DMC steal。
  禁止把剩余抖动写成「2 幂档还没满 / n_DMC 还没回 384」。
  难在：Amdahl 把 6→384 置零之后，剩下的是奇数坐标 2:1:1、公共高位相关、
  银行鸽笼和位图口，四者不随再映一次消失。
  证伪条件：若 S∈{1.5MiB,2MiB} 上 n_DMC=384 且三类占用 max/min=1、min/mean BW≥0.85，
  且 100% good 下所有 stride∈[1B,2MiB] 的 min/mean≥0.85，则本问题不成立。
