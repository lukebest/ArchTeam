  - P-0108
  - drafts/D-0103-M4-vertical

CONTEXT: |
  冻结信封：2 die × 192 DMC = 384；每 die 96 HA × 2 pipe。120 core / 8GiB /
  512B / outstanding 128。只改交织。
  假设 S∈{1.5MiB,2MiB} 上控制器占用已回到 384。
  控制器号是 0..383。2 幂比特把 384 切成两段时，切点落在 256，得到 0..255 与 256..383，
  即 256:128，不是信封的 192:192。HA 若再按同一编号的中段取，单 die HA 数也对不上 96。
  不是在问 n_DMC 怎么回 384，是在问 384 之后立刻露出的装箱切分。

SYMPTOM: |
  - 两 die 发行比：256:128 = 2:1。每 die 应为 192；偏差 +33% / −33%。
  - 单 die DMC ≠192，或单 die HA≥96（256 那边 HA 上界 128），装箱失败。
  - 整机 n_DMC=384 盖不住：热 die 承担 2/3 流量，冷 die 1/3。
    15360 在途按 2:1 分到两 die → 约 10240 vs 5120，不是 7680:7680。
  - 1.5MiB 与 2MiB 必须分两行。平均会用 2MiB 的满占用把 1.5MiB 的 3-adic 失败藏掉。
  待证伪：n_DMC=384 之后，按卡的 die 解码打印两 die 发行比仍为 2:1，
  或单 die ≠192，且该比在 1.5MiB 与 2MiB 上各自成立（不得平均）。

CONSTRAINT: |
  硬件冻住：必须是 192 DMC/die × 96 HA，不能改 die 数。禁止跨 DMC steal。
  禁止把剩余 2:1 写成「控制器还没铺满」。n_DMC=384 已假设。
  禁止把 die 改写成 编号/192 来消掉本问题；那是对照行，不是本问。
  1.5MiB 与 2MiB 分列，不得平均。
  难在：占用轴（384 个控制器）满分之后，物理切分轴（两 die）仍按 2 幂比特切，
  384 不是 2 幂，切出来必 256:128。
  证伪条件：若 S∈{1.5MiB,2MiB} 上 n_DMC=384 且两 die 发行比 =1（192:192）、
  单 die HA=96，且两行各自成立，则本问题不成立。
