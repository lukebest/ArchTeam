generality_score: 8
同源:
  - arXiv:2609.11590 p.1-3

CONTEXT: |
  对象是能力可自由复制环境下的时序内存安全：对象释放后仍可达；时序安全难于空间安全。
  已部署隔离区 + 地址空间扫描回收推迟复用，伤害分配器优化/占用/缓存，并叠加扫描成本 → 开销不可接受。
  有限宽度世代 ID 静态绑到分配槽：ID 耗尽时整 slab 进隔离区；既有方案主要覆盖 <~4 KiB 对象，大对象不成比例造成隔离浪费并主导许多应用。
  多数时序安全方案单核评估；多核下私有、按 VA 组织的对象 ID 缓冲难与物理一致性事件同步。
  需求张力（非方案设计）：时序元数据需与受保护内存共置以保局部性、避免中心化元结构；且须把 ID 耗尽与隔离解耦，使常见路径可立即复用底层内存。

SYMPTOM: |
  - 能力可自由复制 → 释放后对象仍可达；隔离区 + AS 扫描推迟复用，伤害分配器优化/占用/缓存，并加扫描成本 → 开销不可接受。
  - 有限宽度世代 ID 静态绑槽：ID 耗尽迫使整 slab 进隔离区；既有方案主要覆盖 <~4 KiB 对象，大对象不成比例造成隔离浪费并主导许多应用足迹。
  - 多数时序安全方案在单核评估；多核私有 VA 组织对象 ID 缓冲难与物理一致性事件同步。
  - SQLite 类分配密集负载：隔离+扫描基线可做数百次内存扫描（论文引用 267）——扫描频率与隔离占用为一阶。
  - 约束张力同时成立：元数据需与受保护内存共置（局部性、非中心化），且 ID 耗尽不得绑死底层槽隔离，否则常见路径无法立即复用内存。
  待证伪：在公开分配密集/能力系统工作点上，隔离+扫描基线的扫描次数与隔离占用仍可测一阶，或有限宽 ID 静态绑槽使整 slab 隔离浪费可测，或大对象（>~4 KiB）主导隔离浪费，或多核下 VA 私有 ID 缓冲与物理一致性不同步导致正确性/性能缺口。

CONSTRAINT: |
  难在：时序安全要求释放后不可达，但能力可复制使扫描/隔离推迟复用代价高；有限宽 ID 静态绑槽把 ID 耗尽绑成内存隔离；大对象覆盖不足；多核一致性与私有 VA ID 缓冲难对齐；同时又要求元数据共置非中心化、且常见路径可立即复用底层内存。
  禁止提出 ID 转世/再分配、隔离 ID 而非内存、反向映射/过滤器、相干 ID 缓存或任何具体硬件-软件协同设计；只问「隔离+扫描开销不可接受 + ID 耗尽绑死槽隔离 + 大对象浪费 + 多核一致性缺口 + 共置/立即复用需求」是否同时承重失败。
  将「元数据共置 + ID 耗尽与隔离解耦以使常见路径立即复用」框为需求/约束张力，不写成方案设计。
  证伪条件：若公开工作点上隔离+扫描开销已可接受、有限宽 ID 耗尽不导致整 slab 隔离浪费、大对象隔离浪费可忽略、多核下 VA ID 缓冲与物理一致性已同步且无正确性/性能缺口，则本问题不成立。
  及格线：以扫描次数、隔离占用、分配器足迹/吞吐端点对照隔离+扫描基线，不以单核微基准代理代替多核分配密集负载。