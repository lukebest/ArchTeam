generality_score: 8
同源:
  - arXiv:2609.16508 p.1-3

CONTEXT: |
  对象是边缘实时超分：约束平台上 MAC/时延/功耗卡住实时；用 LUT 替代卷积可去掉 MAC，但既有 LUT-SR 仍撞速度、存储与跨倍率可扩展性。
  增大感受野（RF）抬升 LUT 复杂度与存储；按 RGB 通道独立处理 → 吞吐下降或需多份 LUT 副本，易撑爆 FPGA/ASIC SRAM。
  根本折中：RF 覆盖 / LUT 尺寸 / 访存代价 / 部署效率；多数 LUT-SR 偏算法中心，未对齐硬件流水。
  相对既有 LUT，实用化仍约需再砍约 18.4% 存储；4K 实时与资源/功耗联合达标仍开放。

SYMPTOM: |
  - 边缘实时超分被 MAC/时延/功耗卡住；LUT 去 MAC 后，既有 LUT-SR 仍撞速度、存储与跨上采样倍率扩展。
  - 更大 RF → LUT 复杂度与存储涨；RGB 通道独立 → 吞吐掉或 LUT 多副本，可撑爆 FPGA/ASIC SRAM。
  - RF 覆盖 / LUT 尺寸 / 访存 / 部署效率根本折中；多数方案算法中心，未对齐硬件流水。
  - 相对既有 LUT-SR，实用化仍约需再减约 18.4% 存储；4K 实时与资源/功耗同时满足仍开放。
  待证伪：在公开边缘 LUT-SR 工作点上，扩大 RF 相对存储/SRAM 可测不可兼得，或 RGB 独立相对共享 LUT 可测掉吞吐或爆片上存储，或相对既有 LUT 存储仍缺口约 18.4% 量级且 4K 实时与资源功耗无法联合达标。

CONSTRAINT: |
  难在：去 MAC 后仍要同时扛 RF 覆盖、LUT 存储、跨倍率扩展与边缘 SRAM/功耗封顶；
  RGB 独立与大 RF 各自推高存储或压吞吐，算法中心 LUT 与硬件流水不对齐，4K 实时与资源功耗联合仍开。
  禁止提出 YUV 域、幂次核/旋转集成、位分解、可配置并行 LUT 加速器或任何具体 LUT-硬件共设计机制；只问「RF/LUT 尺寸/访存/部署折中 + RGB 独立爆存储或掉吞吐 + 相对既有仍约 18.4% 存储缺口 + 4K 实时与资源功耗联合开放」是否同时承重失败。
  证伪条件：若公开工作点上扩大 RF 已不抬存储到 SRAM 墙、RGB 路径已不掉吞吐且无需多副本、相对既有 LUT 存储缺口已消失且 4K 实时与资源功耗已联合达标，则本问题不成立。
  及格线：以端到端帧率（含 4K 工作点）、LUT/片上存储占用、功耗与跨倍率可运行性对照；不以单倍率 PSNR 或去 MAC 本身代理代替 RF-存储-实时联合承重。
