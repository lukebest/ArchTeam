generality_score: 8
同源:
  - arXiv:2609.23816 p.1-3
  - P-0180
  - P-0152

CONTEXT: |
  接 P-0180 / P-0152 的 HBF 容量与平面并行张力，但不并入：P-0152 问推荐侧热用户全量 KV 写回打寿命；P-0180 问 LLM 服务固定封装下细粒度 KV 与粗粒度 plane 并行是否同时失败（含约 30× 块级写放大）；本卡只问百万 token 长上下文下，HBF 容量能装下 KV 之后，稠密全历史注意力是否仍把每 GPU 吞吐与 plane 利用率压垮。
  对象是长上下文 LLM decode 的 KV 层级：Qwen3-235B-A22B 上 64 路并发、每路约 100 万 token，KV 合计约 12.9 TB，约填满 68 块 B200 的 HBM（尚未计权重）。
  仅为扩容量加 GPU 会进一步过度配置本已低利用的 decode 算力；跨 GPU 池化 KV 引入复制/通信开销。主机 DRAM/CXL/SSD 可扩容，但 PCIe/CXL 带宽约比 HBM 低 2 个数量级；预取/分块/缓冲抹不平该鸿沟。
  HBM：数百字节、ns 级；flash：约 KiB 页、µs 级。要接近 HBM 聚合带宽，需跨堆栈内数千可独立访问 plane 大规模并行。同 12.9 TB KV 用 HBF 容量约 5 个 GPU 即可装下（对比约 68 个 GPU 的 HBM）。
  表征堆栈：16 die × 64 plane = 1024 plane；页 4 KiB；erase block 256 页。可用带宽只有在读跨这 1024 plane 并行时才接近 HBM。即便分组 KV，单 token 仍可追加约 128 KiB；约 192 GB HBM3E 需同时装权重与并发 KV，长上下文可在算力耗尽前先耗尽容量。

SYMPTOM: |
  - Qwen3-235B-A22B：64 路并发 × 每路约 100 万 token → KV 合计约 12.9 TB，约填满 68 块 B200 HBM（尚未计权重）。
  - 仅为扩容加 GPU 进一步过度配置低利用 decode 算力；跨 GPU 池化 KV 引入复制/通信开销。
  - 主机 DRAM/CXL/SSD 可扩容，但 PCIe/CXL 带宽约比 HBM 低 2 个数量级；预取/分块/缓冲抹不平。
  - 同 12.9 TB KV：约 5 个 GPU 的 HBF 容量即可装下，对比约 68 个 GPU 的 HBM。
  - Fig.1 示意：HBF 上稠密全历史注意力时，每 GPU 吞吐从约 16K 上下文到 1M token 可跌超 1 个数量级，1M 时约需 17 个 GPU；若只读 query 相关历史子集，吞吐损失可压到约 2× 以内，1M 时约 5 个 GPU 且每 GPU 吞吐相对纯 HBM 方案可高约 1 个数量级。
  - 即便分组 KV，单 token 仍可追加约 128 KiB；约 192 GB HBM3E 需同时装权重与并发 KV。
  - 建模 HBF：16 die × 64 plane = 1024 plane；页 4 KiB；erase block 256 页——可用带宽仅当读跨 1024 plane 并行时才接近 HBM。
  待证伪：在公开长上下文 / HBF 工作点上，约 12.9 TB KV 相对 HBM 可测迫使约 68 GPU 量级容量配置，或 HBF 上稠密全历史注意力在 1M 上下文可测使每 GPU 吞吐相对短上下文跌超约 1 个数量级并推高 GPU 数（示意约 17），或读请求未能跨约 1024 plane 并行时可测使可用带宽远低于 HBM 聚合带宽。

CONSTRAINT: |
  难在三件事绑在同一套 HBF 读路径上：TB 级 KV 使纯 HBM 容量配置爆炸；HBF 容量能装下之后，稠密全历史读仍把每 GPU 吞吐在 1M 上下文压垮；聚合带宽依赖跨约 1024 plane 的并行，细粒度/倾斜读把完成时间钉在少数 plane。
  tokens/s/GPU 与 1M 上下文下的 plane 利用率是端点，不是可被「原始容量够不够」抹平的代理：不得以仅装得下或仅 GPU 数判过。
  稠密全历史注意力 reduced-bbox（只看容量装入、或只看短上下文）不等于选择性历史全信封；全信封含 1M 上下文下每 GPU 吞吐、plane 并行利用率，以及只读 query 相关子集相对稠密全历史的对照。
  本卡不并入 P-0180、P-0152。P-0180 的约 30× 写放大/寿命端点仍属另一张卡，不得用本卡容量/吞吐数字混过寿命约束。
  禁止提出跨介质统一 KV 视图、稀疏历史检索、plane 感知放置/搬移或任何具体层级/注意力机制；只问「TB 级 KV 容量墙 + HBF 稠密全历史吞吐崩 + 1024 plane 并行吃不满」是否同时承重失败。
  证伪条件：若公开工作点上 1M 上下文稠密全历史已使每 GPU 吞吐相对短上下文不再跌超约 1 个数量级且 plane 利用率足以接近 HBM 聚合带宽、或选择性历史相对稠密的收益已不必再作为区分信封的条件，则本问题不成立。
  及格线：以 1M 上下文下 tokens/s/GPU 与 plane 利用率对照全信封，不以原始容量代理代替。稠密注意力 reduced-bbox 不得冒充选择性历史全信封。约 30× 寿命类约束仍归 P-0180，本卡分开。无解法提案。
