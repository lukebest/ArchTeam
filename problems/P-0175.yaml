generality_score: 8
同源:
  - arXiv:2609.16898 p.1-3

CONTEXT: |
  对象是混合 HE-MPC 私有推理：线性走 HE、非线性走 MPC；单算子 HE 加速可达数量级，但接到 SOTA 协议端到端常仅约 1.37×。
  端到端被网络吃掉：每个 HE 算子无线传入/传出密文；算力加速后 NetIO 仍可主导线性层时延。
  协议改写少送出密文 → 服务端大量权值明文与中间密文；DRAM vs 片上承压（明文约从 128KB 系数形式胀到数十–数百 MB 求值形式）。
  中间密文工作集 > 片上 scratchpad → 复用差、频繁片外，是通信之外的第二道部署墙。
  旧协议出密文含大量 dummy 系数，有效系数比低 → 无线体积虚高。

SYMPTOM: |
  - 单算子 HE 加速可达数量级，接 SOTA HE-MPC 端到端常仅约 1.37×。
  - 每 HE 算子无线传 in/out 密文；算力加速后 NetIO 仍可主导线性层时延。
  - 少送出密文的协议改写 → 服务端权值明文与中间密文暴涨；明文约自 128KB 系数形式胀到数十–数百 MB 求值形式（可 >1000×）。
  - 中间密文工作集大于片上 scratchpad → 复用差、频繁片外；旧协议出密文 dummy 系数多、有效系数比低，无线体积虚高。
  待证伪：在公开 HE-MPC 私有推理工作点上，商业/公开 HE 加速相对 CPU 端到端加速可测停在约 1.37× 量级且线性层时延由 NetIO 主导，或少出密文协议使明文/中间密文相对片上容量可测爆并引发频繁片外，或出密文有效系数比低导致无线体积可测虚高。

CONSTRAINT: |
  难在：算子级 HE 加速 ≠ 端到端；无线 in/out 密文使 NetIO 在算力加速后仍可主导线性层；
  为减出密文又把压力转到明文体积（系数→求值形式胀数量级）与中间密文工作集相对 scratchpad，通信墙与片外墙同时成立。
  禁止提出新卷积编码协议、明文压缩、复用中心数据流或任何具体协议-硬件共设计机制；只问「算子加速难换端到端 + NetIO 主导 + 少出密文引发明文/中间密文片外墙 + dummy 系数虚高无线体积」是否同时承重失败。
  证伪条件：若公开工作点上 HE 加速已使端到端接近算子级加速比且 NetIO 不再主导线性层、或少出密文路径下明文与中间密文已装入片上且无可测频繁片外、或出密文有效系数比已高到无线体积不再虚高，则本问题不成立。
  及格线：以端到端时延、线性层 Compute vs NetIO 分解、明文/中间密文足迹与片外访问对照；不以单算子 HE 加速比代理代替端到端与部署墙。
