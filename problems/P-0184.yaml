generality_score: 8
同源:
  - arXiv:2609.21137 p.1-3
  - P-0156

CONTEXT: |
  接 P-0156 的 MoE 专家移动/放置张力，但不并入：P-0156 问边缘 NMP 上无副本 EP 失衡与 TP 通信；本卡只问 scratchpad 张量加速器（STA）上 MoE 解码时专家权值 DMA 是否把端到端延迟与计算忙闲同时钉死。
  对象是 STA 上的 MoE 自回归解码：软件显式管理片上 scratch，DMA 在 HBM 与 scratch 之间搬张量；路由之后才知道本 token 激活哪些专家，激活集可随 token 变化，HBM→片上 scratch 几乎无复用。
  Qwen3-30B-A3B：48 层，每 token 每层激活 128 专家中的 8 个，仍产生约 75 MB（BF16）每层每 token 的专家权值流量。
  平台例：8× NeuronCore-v4，约 144 GiB HBM（约 4.7 TB/s）；每物理核约 32 MiB SW scratch、约 2 MiB 累加、16 路 DMA；张量引擎为 128×128 脉动——专家权值仍须从 HBM DMA 进有限 scratch。
  现代 MoE 中注意力相对专家更轻：Qwen3-30B-A3B 注意力约占总体权值约 3.03%、端到端解码延迟约 10.4%。仅压注意力或只看单 token 局部框，盖不住全 MoE 解码信封。
  低秩-only 重建专家权值：Qwen3-30B-A3B PPL 约 9.82 → 约 34.91，质量严重崩坏。VQ 可缩权值流量，但码本运行时开销在 Trainium 上可达端到端解码延迟约 20%。

SYMPTOM: |
  - Qwen3-30B-A3B：48 层，每 token 每层激活 8/128 专家，仍约 75 MB（BF16）每层每 token 专家权值流量；激活专家集可随 token 变 → HBM→片上 scratch 几乎无复用。
  - 4-way TP 例 STA（每逻辑核约 64 MiB SW scratch）：Qwen3 专家权值加载约占端到端解码延迟约 56%，其中约 36.8% 落在关键路径。
  - 同设定：Gemma 4（30 层）关键路径暴露的加载约占端到端约 42.5%；Nemotron 3（52 层）约 30.5%。
  - 同一 Qwen3 trace：SIMD 引擎活跃仅约 4.1%–4.7%，向量引擎约 7%–10.1%——等权值时计算大体空闲。
  - 注意力约占总体权值约 3.03%、端到端解码延迟约 10.4%；相对专家侧不是主导。
  - 平台：8× NeuronCore-v4，约 144 GiB HBM（约 4.7 TB/s）；每核约 32 MiB SW scratch、约 2 MiB 累加、16 DMA；128×128 脉动张量引擎——专家权值仍 DMA 进有限 scratch。
  - 低秩-only 重建：Qwen3-30B-A3B PPL 约 9.82 → 约 34.91。VQ 缩流量时，码本运行时开销在 Trainium 上可达端到端解码延迟约 20%。
  待证伪：在公开 STA / MoE 解码工作点上，专家权值加载可测约占端到端约 56% 且约 36.8% 落在关键路径（或 Gemma/Nemotron 类关键路径暴露加载约 30%–43%），或等权值时 SIMD/向量引擎活跃可测仅约 4%–10%，或低秩-only 可测使 PPL 从约 9.82 崩到约 34.91，或 VQ 码本开销可测达端到端约 20%。

CONSTRAINT: |
  难在三件事绑在同一解码步：路由后才知专家 → 预取难藏、激活集随 token 变 → scratch 几乎无复用；约 75 MB/层/token 的 BF16 专家流量把端到端与关键路径钉死；缩流量的低秩-only 质量崩、VQ 又把码本开销推回关键路径，计算引擎等权值空转。
  约 56% / 36.8% 加载占比与约 4.1%–10.1% 引擎活跃是端点观测，不是可被「平均专家数或压缩比」抹平的代理：不得以专家个数、激活稀疏度或压缩倍率判过。
  注意力-only / 单 token reduced-bbox（只看注意力、只看某一层或单次 DMA）不等于全 MoE 解码信封；全信封含多层专家 DMA、关键路径暴露加载、以及异构引擎忙闲。
  本卡不并入 P-0156。只说明与 MoE 专家移动/放置侧同源张力，不是机制。
  禁止提出混合低秩/VQ 表示、多引擎重叠调度、专家预取、权值驻留或任何具体 STA 数据流/表示机制；只问「专家权值 DMA 主导端到端 + 引擎等权值空转 + 缩流量即质量/开销回弹」是否同时承重失败。
  证伪条件：若公开工作点上专家权值加载已不再主导端到端解码延迟与关键路径、或 SIMD/向量等引擎在等权值窗口已不再大体空闲、或在不明显推高端到端开销的前提下缩流量已不导致 PPL 类质量崩坏，则本问题不成立。
  及格线：以端到端解码延迟与计算忙闲分数对照全 MoE 解码信封。加载占比与引擎活跃是端点不是可被均值抹平的观测；注意力-only / 单 token reduced-bbox 不得冒充全信封。不以专家个数或压缩比代理代替。无解法提案。
