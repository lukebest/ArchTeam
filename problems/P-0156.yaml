同源:
  - arXiv:2609.08682 p.1-3
  - P-0003

CONTEXT: |
  接 P-0003 脉络：边缘侧混合专家（MoE）落到 3D 近存处理（NMP）时，张量并行 all-reduce 重，
  专家并行又易负载不均；内存受限 NMP 难以复制专家。
  路由偏好（少数专家主导、共激活、边界分数接近）与硬件代价（批次负载、通信）不对齐。

SYMPTOM: |
  - TP all-reduce 沉重，EP 则失衡；内存受限 NMP 上无专家副本。
  - Qwen2-57B-A14B：少数专家主导且共激活明显；近边界分数接近但批次负载差可观。
  - 替换低秩选中专家仍可保持高余弦相似度——路由「偏好」≠ 硬件代价；按偏好放置会与 NMP 容量/带宽错位。
  待证伪：在公开边缘 MoE/NMP 设定上，无副本 EP 失衡或 TP 通信相对计算可测主导，
  或高相似度可替换专家仍因批次负载差导致硬件代价显著。

CONSTRAINT: |
  难在：NMP 内存封死专家副本，TP 用通信换均衡，EP 用不均衡换少通信；路由分数接近时软件偏好
  与硬件批次代价脱钩。
  禁止提出具体专家放置或复制策略；只问「无副本 NMP + 路由偏好≠代价」是否同时承重失败。
  证伪条件：若公开 Qwen2 类 MoE 在 NMP 上 EP 均衡且 TP 通信可忽略，
  或路由偏好与批次硬件代价一致，则本问题不成立。
