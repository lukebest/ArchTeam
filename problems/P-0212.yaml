# 中文题目: 近端简单核已在，透明 offload 仍被检测/页移/一致性/handoff 成本与弱 ILP 吃掉带宽收益，已部署二进制跨不过采纳鸿沟
generality_score: 8
同源:
  - arXiv:2609.38454 p.1-3
  - P-0150
  - P-0195

CONTEXT: |
  近数据处理可缓解数据搬运与管脚带宽瓶颈，但多数方案仍对软件栈、数据布局与/或底层硬件合同提出沉重要求，阻碍广泛采用。
  基因组分析、数据库扫描/简单查询、大工作集密码学，以及 LLM 推理中 GEMV 偏重相位等业务/科学关键应用含大量内存受限内核，却难以被改造去使用近端算力。
  现有路径常要求程序员可见的数据搬运、新的 offload API、编译器支持、ISA 修改或近端专用数据布局，才能把工作放到近内存计算单元。
  商用方向已出现靠近 DRAM bank、面积/能耗较小的简单 in-order 近端核：灵活硬件存在，但大量已部署二进制与闭源库仍面临高集成壁垒（采纳鸿沟）。
  透明 offload 仅在近端带宽与并行收益能覆盖检测、模板存储、页移动、一致性动作、MMU/OS handoff 与 fallback 等成本、且可被重复调用摊销时才有用；成本可见性是核心约束。
  近端核相对主机 out-of-order 前端往往 ILP 更弱：即便把循环搬到近端，若调度仍按朴素顺序发射，带宽收益可能被近端执行效率吃掉。
  指针追逐、高度不规则图遍历、非常量步长、深度数据依赖控制流、以及短循环低复用等形态，更适合程序员/编译器/运行时/布局支持，而非纯透明硬件 offload 的首批目标——规则循环只是受限但常见子集。

SYMPTOM: |
  - 内存受限内核在基因组、数据库扫描/简单查询、大工作集密码学、LLM GEMV 偏重相位等负载上普遍存在，却因软件栈/布局/硬件合同要求而难以改用近端算力。
  - 靠近 DRAM bank 的简单 in-order 近端核在面积/能耗上已可见，但已部署二进制与闭源库的集成壁垒仍高：硬件可用 ≠ 可透明采纳。
  - 透明路径上的检测、模板存储、页移动、一致性、MMU/OS handoff 与 fallback 成本必须被带宽/并行收益覆盖并被重复调用摊销；摊销不足时净收益为负。
  - 近端相对主机 OOO 前端 ILP 更弱时，把规则循环搬到近端仍可能因顺序发射效率把带宽收益吃掉。
  - 指针追逐、不规则图遍历、非常量步长、深依赖控制流、短循环低复用等形态不是纯透明硬件 offload 的首批可担目标；规则循环只是受限子集。
  - 即便只针对可检测的规则循环子集，仍需在计入页移动/一致性/handoff 的口径下，对不少于约 12 个典型内存受限 kernel、并对照多核主机并行基线，证明透明 offload 的净收益可为正。
  - 端点包括相对多核主机并行基线的端到端加速比或能量、计入页移/一致性/handoff 后的净收益、可透明覆盖的已部署二进制比例，以及在不少于约 12 个公开内存受限 kernel 集合上的正收益覆盖面。
  待证伪：在公开内存受限 kernel 集合（≥约 12 个）与多核主机并行基线上，若透明 offload 在计入页移/一致性/handoff 后净收益稳定为正、近端弱 ILP 不再吃掉带宽收益、且已部署二进制无需 API/ISA/布局改造即可广泛采纳，则本问题不足以成立。

CONSTRAINT: |
  难在同一「对已部署二进制透明」的合同下同时承受：(1) 检测/页移/一致性/handoff/fallback 的固定成本摊销；(2) 近端 in-order 相对主机 OOO 的 ILP 劣势；(3) 不规则内核被排除后规则循环子集是否仍足够大——三者任一被忽略都会把「近端带宽」误写成净收益。
  端到端加速比/能量（相对多核主机并行）、计入页移与一致性后的净收益、可透明覆盖的二进制比例与 ≥约 12 kernel 正收益覆盖面是 endpoints；单 kernel 峰值带宽、忽略 handoff 的理想加速、只报规则循环命中率或不计入 fallback 的加速比都是 proxies，endpoints ≠ proxies。
  只在已改写源码/新 API/专用布局、关掉页移与一致性成本、只用远少于约 12 个 kernel、或不对照多核主机并行基线的实验属于 reduced-bbox，不等于覆盖已部署二进制透明采纳与完整成本口径的 full envelope；reduced-bbox ≠ full envelope。
  及格判定若采用 0.85，0.85 是 pass bar，不是 measured mean；不得用平均 kernel 加速过线冒充净收益与二进制覆盖端点都过线。
  同源但不并入 P-0150：P-0150 问 ANNS 图/压缩索引与 PIM SIMD 规则访存错位；本卡不问召回—吞吐三角，只问透明 offload 的采纳鸿沟与成本摊销。
  同源但不并入 P-0195：P-0195 问 DRAM 内 bit-serial 竖直/水平布局冲突；本卡不绑定体计算布局，只问近端核透明 offload 的软件合同与净收益。
  无解法提案，不提出具体循环检测、页迁移策略、一致性协议、ISA 扩展、编译器/运行时改造或任何近端微架构。
