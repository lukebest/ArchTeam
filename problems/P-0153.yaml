generality_score: 8
同源:
  - arXiv:2609.07907 p.1-3

CONTEXT: |
  对象是数字 Ising/退火机：全连接问题边数 O(N²)，稀疏硬件图需嵌入，物理自旋相对逻辑自旋膨胀。
  多芯片扩展时自旋交换必须与计算重叠，否则互连吃掉加速。
  嵌入膨胀与求解质量/时延强相关。

SYMPTOM: |
  - 稠密问题 O(N²) 边；稀疏嵌入吹胀：32-spin 全连接在 Pegasus 约 133 物理自旋，King's 约 1885。
  - 4-chip MaxCut 约 27069 节点时延约 3.3 µs 量级，要求自旋交换与计算重叠，否则扩展失效。
  - α=8 设定下 16 次中仅约 2 次精确到基态，耗时约 2.9 s / 8.9 s 量级分化，嵌入与求解质量不稳定。
  待证伪：在公开稠密 Ising 实例上，嵌入物理自旋相对逻辑可测膨胀，或无重叠交换时
  多芯片扩展收益消失、精确基态率偏低。

CONSTRAINT: |
  难在：逻辑全连接要 O(N²)，硬件稀疏图用嵌入换连通，物理资源与交换延迟一起涨。
  禁止提出具体拓扑或交换调度；只问「稀疏硬件图 + 稠密逻辑」嵌入膨胀是否不可接受。
  证伪条件：若公开 FC 实例嵌入膨胀可忽略，且多芯片无重叠交换仍保持扩展效率与高基态命中，
  则本问题不成立。
