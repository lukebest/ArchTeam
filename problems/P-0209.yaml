# 中文题目: 静态多通道时分共享的名义容量被排空税与被借类地板共同侵蚀，净增益可能消失
generality_score: 8
同源:
  - P-0198
  - github:lukebest/bufferless-ring-noc tests/soc_sim
  - 扩展自 P-0198/M-5 横向
  - 同源但不并入 P-0198 及其他 sibling expansion cards

CONTEXT: |
  对象是 K≥2 条同构物理通道、各类流量默认静态绑定、无深度侧缓冲的互连。热点类与闲类在世代边界进行有界时分共享；翻转前存在在途排空与提交同步，被借类保留最小时隙地板。问题只取这一结构，不绑定 CHI 专名。
  对照域包括封装或板级通道、光波长时分、处理器线程槽、存储通道和多队列共享物理链路等同构场景；热点/被借类的端到端结果必须分列。深度队列可完全吸收排空税的信封不在范围。
  bufferless-ring-noc tests/soc_sim 的 DV200、12+2、多环与 3:1/7:1/15:1 duty 作为源对照量纲，不能替代横向场景的独立端点。

SYMPTOM: |
  - duty_hot:duty_cold=7:1 时，理想热点容量上界≤1+7/8=1.875 倍；若扣除≥1–2 个传播延迟的排空与同步后，实测 R_eff 仅约 1.3–1.5 倍，且 R_eff≤1+0.5·duty_hot，则至少一半名义增益被税吞掉。
  - 被借类地板 duty_cold∈{1/4,1/8,1/16} 时，若其完成时间超过永不共享对照的 1.4 倍，热点的净容量不能单独作为系统端点。
  - 热点高、冷点低的时间比例 p_skew<0.4 时，可用闲类窗口稀缺；在该区间，热点完成时间与全局完成时间出现分叉。
  - 端点包括热点/被借类 makespan、完成数、R_eff、排空窗占比、duty_cold、p_skew 和尾延迟；不能只报热点字节数除以单通道峰值。

  待证伪：在静态多通道时分共享工作点上，若扣除排空税与被借类地板后 R_eff 仍接近名义上界且被借类 makespan ≤1.2× 永不共享对照，则本问题不成立。

CONSTRAINT: |
  不把问题限定为某一 CHI 重绑电路；难点是静态多通道、时分共享、排空同步与被借类地板的结构税。不得把局部名义容量当成永久额外物理槽。
  热点/被借类 makespan、完成数、R_eff、排空窗占比与尾延迟是 endpoints；热点峰值带宽、平均利用率或单类字节吞吐是 proxies，endpoints ≠ proxies。
  只测热点类、无被借类地板、无排空同步，或 K=1 的实验属于 reduced-bbox，不等于 K≥2、双类流量与世代边界均存在的 full envelope；reduced-bbox ≠ full envelope。
  若采用 0.85，0.85 is pass bar, not measured mean；不得用热点 measured mean 代替被借类与全局端到端结果。
  同源但不并入 P-0198 及其他 sibling expansion cards；  证伪条件同 SYMPTOM 末行。
  无解法提案。
