generality_score: 8
同源:
  - arXiv:2609.04040 p.1-3
  - P-0137

CONTEXT: |
  同一预取问题，负载相位会切换：LLM 推理在顺序 KV 追加与远距离 attention gather 之间切换；
  检索代理在长扫描与稀疏查找之间交替。
  经典模式匹配预取在目标流上可接近最优，但假设破裂时脆弱。

SYMPTOM: |
  - 预取若无法区分「大体规则偶发远访问」与纯噪声，会在混合相位上误行为（该发的不发、不该发的乱发）。
  - 需要与无预取基线对齐的安全语义，而不是只报覆盖率；覆盖率高仍可能相对无预取伤害 IPC。
  - 与 P-0137 叠加：混合相位上代理指标改善更易与端点脱钩。
  待证伪：存在公开 LLM 推理或检索轨迹，相位切换点上预取相对无预取基线使 IPC 下降或 DRAM reads 上升，
  同时覆盖率/准确率仍显示「变好」。

CONSTRAINT: |
  难在：规则流与噪声在同一时间轴上交错，单相位上接近最优的匹配器在切换点上脆弱。
  安全语义必须以无预取为对照，不得只用覆盖率过线；reduced 相位子集不得冒充全轨迹信封。
  证伪条件：若在公开混合相位轨迹上，相对无预取基线 IPC 与 DRAM reads 均不恶化，
  且覆盖率与端点同向，则本问题不成立。
