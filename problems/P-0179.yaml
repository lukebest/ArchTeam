generality_score: 8
同源:
  - arXiv:2609.17556 p.1-2
  - P-0178

CONTEXT: |
  接 P-0178 的轨道任务关键边缘，但不并入那张卡的静态保护与整流数值崩溃：本卡只问持续学习上的约束张力。
  观测分布随周期、光照与传感器老化漂移，在线适应不可避免。停推理去更新参数，会打断安全或任务关键决策。
  若适应与推理并发，适应窗口里的瞬态硬件故障不再只毁掉当次输出：错误经梯度更新被写进参数，成为模型的永久状态。
  既有持续学习大多假定适应可以让出主任务、且硬件执行可靠，不把「推理不中断」与「在线适应期间并发硬件故障」当成必须同时成立的约束。

SYMPTOM: |
  - 停机更新则安全/任务关键决策被打断；不停机则适应与推理争用同一在线参数，不能分时独占。
  - 适应窗口内 1 次瞬态故障（SEU 改写正在更新的参数）经后续梯度步永久写入；当次推理的置信度或后处理撤不掉已固化的参数。
  - 日食等功率窗把可用能量压到近 0 时，分布仍在漂：适应既不能等到「干净硬件、可停机」的窗口，也不允许为更新而停推理。
  - 现有方法大体不覆盖「推理不中断 + 适应期并发硬件故障」这一对同时成立的约束；只做分布漂移或只做静态容错都隔开了写入不可逆这一步。
  待证伪：在公开任务关键持续学习工作点上，停推理更新可测打断决策闭环，或适应期单次参数故障经梯度后在后续推理步可测残留且不能仅靠后处理清除。

CONSTRAINT: |
  难在两条约束对打，不是缺一个更新技巧：不中断推理与在线改参数挤在同一执行窗；窗内硬件故障的代价不是一次坏输出，而是模型被写坏，且不能靠后处理回滚。
  只证明「能边推理边学习」但忽略并发故障，或只证明「故障可检出」但适应必须停推理，都不算这条张力解开。与 P-0178 的静态保护/整流崩溃问题不得合并验收。
  禁止提出参数隔离、冻结关键区、双副本轮换、可靠区限制更新或任何具体适应–容错机制；只问「不停推理的在线适应」与「适应期故障被梯度永久写入」是否同时承重失败。
  证伪条件：若公开工作点上在线适应已可不打断任务关键推理，且适应期瞬态故障不会经梯度固化进后续推理，则本问题不成立。
  及格线：以决策是否被中断、适应后模型相对注入前的持久误差、故障后后续推理步是否仍失效对照；不以单次推理准确率或离线再训练质量代理代替「推理不中断 + 故障不固化」。
