  假设在已记录点 δ∈{3,9,24,3072} 上 n_DMC 已回到 384。不是在问怎么再映。

SYMPTOM: |
  奇数坐标只有 3 个剩余类；把 3 bit 图案（8 种）压到 3 类时直方图 3、3、2：
  - 两类各占 3/8=0.375，一类占 2/8=0.250；max/min=1.5。
  - 三类均值 8/3，min/mean=2/(8/3)=0.75 < 0.85。
  - 384=128×3 全被触摸时，最瘦那类相对均值仍是 0.75。
  未列入 {3,9,24,3072} 的步长上，相邻低位切片沿进位相关：两切片完全相关时
  名义 2 个活切片的联合熵掉到 1 个切片，已恢复的 384 可能再被切开。
  待证伪：已记录四点上 n_DMC=384，但三类占用 max/min 仍=1.5，min/mean BW<0.85；
  或存在未列 stride 使相邻切片联合熵≈单切片熵，且 n_DMC<384 或 min/mean BW<0.85。

CONSTRAINT: |
  硬件冻住。禁止把剩余抖动写成「再哈希」。
  难在：「奇数坐标被步长冻死」置零之后，剩下 8→3 图案计数不均和进位链相关性，
  两项都不随再映一次消失。
  证伪条件：若已记录四点上三类占用 max/min=1 且 min/mean BW≥0.85，
  并且所有未列 stride 上 n_DMC=min(384,K) 且 min/mean BW≥0.85，则本问题不成立。
