generality_score: 8
同源:
  - arXiv:2609.07175 p.1-3

CONTEXT: |
  对象是推荐/序列模型中的用户侧 KV（如 HSTU 类）：热用户历史极长，工作集远超单卡 HBM。
  高带宽闪存（HBF）容量远大于 HBM，但读写寿命（P/E）与缺失时全量写回模式冲突。
  全历史体积远大于增量更新。

SYMPTOM: |
  - HSTU-10B：热 25% 的约 10K 用户工作集可达约 3.62 TB；8K 历史在约 20 ms 窗口需约 403 GB/s。
  - HBF 容量可 >10× HBM4（约 512 GB vs 36 GB），带宽约 1.6 TB/s，但寿命约 100K P/E。
  - LRU 缺失写回整段 KV 时，按 7 栈估算寿命可压到约 1 年；全历史体积 ≫ 增量，热写放大严重。
  待证伪：在公开推荐/HSTU 工作点上，热用户 KV 使 HBM 容量不足且 HBF 全量写回寿命
  相对增量路径可测不可接受。

CONSTRAINT: |
  难在：容量要 HBF，带宽窗口要近 HBM，寿命却按全量 KV 写回计价；热用户倾斜把写放大集中到少数键。
  禁止提出具体分层缓存或增量写协议；只问「大容量慢闪 + 全量 KV 写回」是否同时不可接受。
  证伪条件：若公开负载下热集可装入 HBM，或缺失写回不显著消耗 P/E、寿命远长于约 1 年量级，
  则本问题不成立。
