generality_score: 7
同源:
  - arXiv:2609.03125 p.1-3
  - P-0139

CONTEXT: |
  接 P-0139：硅光波导/微环可提供高带宽、低寄生并随距离扩展优于电气链路。
  既有光学 interposer 多只支持数字传输。现在问的是跨片保真传递模拟激活时的物理裕度，不是具体链路电路。

SYMPTOM: |
  - 微环消光比通常仅 15–25 dB；用幅度直接编码模拟电平时，高偏置下电平间距收缩，直传模拟裕度不足。
  - 若数字光子链路按精度为每个值分配多路波长，精度与卷积核尺寸上升时波长需求可超出平台 FSR。
  - 模拟直传受消光比限制，数字多波长受 FSR 限制——跨片保真卡在精度–波长–幅度裕度三角中。
  - 与 560×560 级输入叠加时，三角任一角绷紧都会把 P-0139 的能量–延迟积差距重新打开。
  待证伪：在公开微环消光比 15–25 dB 与公开 FSR 预算下，无法同时满足目标位宽、核尺寸与模拟电平间距，
  使跨片误差超过任务可接受阈值。

CONSTRAINT: |
  难在：消光比、FSR 波长数、模拟电平间距三者互斥，抬一个会挤另一个；不是「光比电快」一句话能消掉的。
  禁止把数字-only 光学 interposer 的带宽成绩单冒充模拟激活直传过线。
  证伪条件：若在 15–25 dB 消光比与平台 FSR 内，目标位宽与核尺寸下模拟或等效数字多波长传递
  均保持任务精度且能量–延迟积不差于电气基线，则本问题不成立。
