generality_score: 8
同源:
  - arXiv:2609.10126 p.1-3

CONTEXT: |
  对象是 NoC/chiplet/晶圆/HBM 上的 AI 张量传输：低尾数翻转近似量化噪声；高指数翻转产生离群/NaN，主导归约并污染状态。
  固定跳数恢复基线在给定 BER 下是主对照；语义敏感故障与固定重试预算耦合时，有限重试被无害或低害故障耗尽，投递语义质量与丢包一起恶化。

SYMPTOM: |
  - DenseNet-121/ESC-50 故障注入：指数 MSB 故障 → 训练精度约 2.0%（机会水平）且停留；干净约 83.3%。
  - 固定 34 跳恢复基线在 BER 约 3×10⁻⁵（10 种子）为主对照；语义感知地理恢复相对其报 Ψdel 约 −30.1%、平均延迟约 −28.0%——数字仅作固定基线存在差距的证据，不作为方案提案。
  - 更高 BER、同注入负载：固定基线积压堆积；间隔可自适应者队列有界——暴露固定间隔失效症状。
  - 若有界 Class-M 故障也触发重放：同一有限重试预算 → DATA flit-hop 重试约 ×2.30 / 原包，丢包 7.42%→21.64%，投递语义质量约 −8.3%。
  待证伪：在公开张量/NoC 故障点上，指数类故障使精度塌到机会水平，或固定跳数/间隔基线相对可对照设定在 Ψdel/延迟/队列上可测落后，或 Class-M 耗尽重试使丢包与语义质量同时恶化。

CONSTRAINT: |
  难在：尾数噪声可忍，指数翻转不可忍；固定跳数/间隔恢复在升高 BER 下积压；有限重试预算被 Class-M 类故障稀释，有害与无害争同一预算。
  禁止提出地理恢复、语义感知路由或自适应间隔机制；只问「指数 MSB 灾难 + 固定恢复基线失效 + Class-M 耗尽重试」是否同时承重失败。
  证伪条件：若公开注入下指数 MSB 不使精度塌到机会水平、固定 34 跳/固定间隔在升高 BER 下队列仍有界且 Ψdel/延迟无显著差距、或 Class-M 触发重放不抬高丢包与语义质量损失，则本问题不成立。
  及格线：以训练精度、Ψdel、延迟、丢包端点对照固定基线，不以中间 hop 代理代替。
