# 中文题目: DRAM 存内计算缺行内相邻比特通路：只能 bitline 内算，逼出比特切片布局，与主机行主序互切必付转置，串行加还是 O(n) 行操作深度
generality_score: 8
同源:
  - arXiv:2610.02502 p.1-3
  - P-0195
  - P-0141
  - P-0142

CONTEXT: |
  基于电荷共享的 DRAM 存内计算只能在单条 bitline 内完成运算；同一行内相邻比特位在电气上相互隔离，没有原生的相邻位通信通路。
  因缺少水平数据移动，现有 DRAM 存内计算把数据重排成列向/比特切片布局（每个比特位占一行），与 CPU/加速器的行主序、字并行布局根本不兼容；每次在主机执行与存内执行之间切换都要付一次昂贵的布局转置。
  比特串行加法是 O(n) 深度：每个全加器步要执行固定的 c 条行级原语操作，总计 O(c·n) 次行操作，以单元素延迟换取整行吞吐；并行前缀加法理论上只需 O(log n) 深度。
  进位传播、部分积累加、前缀计算等算术结构大多只需相邻或近邻比特位之间的局部通信，但现有方案为了任意逻辑移位的灵活性，长期维持与主机不兼容的布局。
  已有把比特并行算法跑在比特切片数据上的做法（把操作数比特分散到多个 subarray 并利用 subarray 级并行），物理布局仍是比特切片，与行主序主机数据交互时仍需转置。
  同一程序依赖图中不同算术操作偏好的布局不同，而布局间转换的重组成本必须在结果交给 CPU 或后续比特并行计算前付清。
  一次行级批量拷贝可在单个 DRAM 时序周期内操作整行（典型 8 KB），但该行内各比特位之间仍无法交换数据，行宽并行与位间通信能力之间存在结构性断层。

SYMPTOM: |
  - 同一行内相邻比特电气隔离：电荷共享存内算只能在单条 bitline 内完成，没有原生行内相邻位通信通路。
  - 为做存内算被迫采用列向/比特切片布局，与主机行主序、字并行布局不兼容；主机↔存内每次切换都付布局转置。
  - 比特串行加法深度 O(n)：每全加器步固定 c 条行级原语，合计 O(c·n) 次行操作；并行前缀理想深度仅 O(log n)，深度差距是结构性的。
  - 进位/部分积/前缀等只需近邻比特局部通信，却因维持任意移位灵活性而长期锁在与主机不兼容的布局上。
  - 即便把比特并行算法映射到多 subarray 的比特切片数据，物理布局仍是切片态，与行主序主机交互仍要转置。
  - 同一依赖图内不同算术操作偏好不同布局时，布局间重组成本必须在交给 CPU 或后续比特并行步之前付清。
  - 单周期可批量拷贝整行（典型约 8 KB），但行内比特仍不能互换：行宽并行 ≠ 位间通信能力。
  - 端点包括主机↔存内切换的端到端转置开销、算术内核的行操作次数与延迟（相对 O(log n) 下界）、整行吞吐下的单元素延迟，以及同一依赖图内多布局偏好时的重组总成本。
  待证伪：在公开商用 DRAM 行宽与电荷共享存内原语下，若行内相邻比特可原生通信、比特串行/近邻算术无需比特切片即可达接近 O(log n) 的行操作深度、且主机行主序与存内执行互切不再付转置，则本问题不足以成立。

CONSTRAINT: |
  难在同一 DRAM 阵列合同上同时承受：(1) 无行内相邻比特通路；(2) 主机行主序 ABI；(3) 近邻算术想要的低深度——缺水平位通信就把布局锁成切片，把加法钉在 O(c·n) 行操作，并把转置推给每次主机↔存内边界。
  端到端转置开销、行操作次数/延迟、单元素延迟与依赖图重组总成本是 endpoints；单次行拷贝带宽、只计阵列内不计转置的加速比、或峰值行并行度都是 proxies，endpoints ≠ proxies。
  只在已切片好的数据、单 mat、忽略主机交互、或只测行拷贝不测位间通信的实验属于 reduced-bbox，不等于覆盖行主序主机共存与多操作依赖图的 full envelope；reduced-bbox ≠ full envelope。
  及格判定若采用 0.85，0.85 是 pass bar，不是 measured mean；不得用平均行吞吐过线冒充转置与算术深度端点都过线。
  同源但不并入 P-0195：P-0195 用公开工作点钉死竖直/水平布局冲突的实测转换税（约 3.9×/3.7×）与 cache 写回；本卡钉在「无行内相邻比特通路」这一结构断层、O(c·n) vs O(log n) 算术深度，以及同一依赖图多布局偏好的重组成本。
  同源但不并入 P-0141/P-0142：那两张问模拟 CIM 上的 softmax 类算子；本卡只问数字 DRAM 存内电荷共享路径上的行内位通信与布局。
  无解法提案，不提出具体行内互连、新 DRAM 命令、转置单元、前缀加法映射、subarray 调度或任何阵列微架构。
