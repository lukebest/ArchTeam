generality_score: 7
同源:
  - arXiv:2609.04266 p.1-3
  - P-0141

CONTEXT: |
  接 P-0141：既有模拟存内 attention 为避开序列维互连，会用固定斜率的近似替代真正的 softmax 归一化。
  CIM 分数范围随 head、层、阵列增益与模拟非理想性漂移。

SYMPTOM: |
  - 用 HardSigmoid 等近似替代真正 softmax 时，牺牲向量归一化语义（权重和不必为 1，层间不可比）。
  - 分数范围漂移时，需要可调的 score→weight 映射，而不是固定斜率的指数律；固定映射在 head/层间错位。
  - 与 P-0141 的 128 路后仿对照：即便 RMSE 约 24.46 mV 量级，若映射斜率不可调，
    跨 head 误差会在归一化后被放大到注意力分布上。
  待证伪：存在公开模型/head，固定斜率近似使任务指标相对真 softmax 可测下降，
  或同一芯片上不同 head 的分数动态范围比超过固定映射的线性区。

CONSTRAINT: |
  难在：避开序列维互连的近似丢掉归一化语义；保留归一化又碰上分数分布漂移。
  禁止提出具体可调电路；只问「固定映射 / 丢归一化」两条路是否同时不可接受。
  证伪条件：若固定斜率近似在公开模型上与真 softmax 任务指标无差别，
  且跨 head 分数范围始终落在同一线性区，则本问题不成立。
