generality_score: 8
同源:
  - P-0106
  - P-0125
  - drafts/D-0106-M5-horizontal

CONTEXT: |
  对象是片上 mesh 在部分路由器退役后的集体通信，不是 DRAM bank 映射。
  公开规模：8×8（64 点）或 16×16（256 点）。退役率 6.25%/12.5%/25%。
  流量是规则步长的全对全或 reduce（目的 = base + i·δ），在选定路由算法之前已是算术级数。

SYMPTOM: |
  - 8×8、δ=8：满好类数 8；退役后 60/gcd(8,60)=15、56/gcd(8,56)=7、48/gcd(8,48)=6。
    25% 时占用 6/48=12.5% 活点。
  - 8×8、δ=3：满好类数 64。6.25% 时 gcd(3,60)=3、类数 20；25% 时 gcd(3,48)=3、类数 16，
    占用 16/48=33%。丢掉 2 幂、引入因子 3 后，原本满占用的步长流塌到三分之一。
  - 16×16、δ=3：满好 256；活集 240/224/192 的类数 80/224/64。25% 时 64/192=33%。
  - 全对全消息数：8×8 从 4032 降到 2256（56%）。若仍按旧模 64 散列，
    均匀死像叠加比 64/48=1.33。
  待证伪：存在上述退役率与公开集体，使占用 < n_live/gcd(δ,n_live) 的满占用，
  或完成时间不能用「只少了 25% 节点」解释。

CONSTRAINT: |
  不把本问题写成 DRAM 交织移植。
  难在活集是运行时集合，规则步长与剩余 radix 的 gcd 锁死像集；
  沿用旧模叠死像，改成 n_live 仍可能引入新公因子。
  证伪条件：若上述退役率下规则集体占用均达 n_live、完成时间仅按活点数线性下降、
  且无死像叠加，则该同构不成立。
