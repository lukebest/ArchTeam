generality_score: 8
同源:
  - arXiv:2609.16244 p.1-3

CONTEXT: |
  对象是扩散 Transformer 推理相对自回归（AR）解码：AR 每层每步 token 串行；扩散在固定形状 latent 上做完整前向，唯一串行维是去噪步数 T，且形状在编译前已知。
  产品指标是单步时延而非批吞吐：单步时延减半 → 出图时间减半；批吞吐翻倍 ≠ 更短出图时间。
  同权值在轨迹上约复用 T×B 次（相对单次前向），权值加载摊销是一阶；相对 AR 无增长 KV cache，片上容量按层工作集而非序列历史定界。
  流式 soft-max：运行最大值上升须重标已累积 out+denom；低精度分数饱和/近 one-hot 时数值脆弱。
  原始 DiT 头维在给定片上容量下装不进融合注意力流水；guidance 对批处理在该程序上不摊销权值流。

SYMPTOM: |
  - AR 每层每步 token 串行；扩散每步固定形状全前向，串行维仅 T；形状编译前已知。
  - 产品指标=单步时延：单步时延减半 → 出图时间减半；2× 批吞吐 ≠ 更短出图时间。
  - 同权值约复用 T×B 次；无增长 KV，片上按层工作集定界；权值加载摊销一阶。
  - 流式 soft-max：运行 max 上升须重标 out+denom；低精度饱和/近 one-hot 时脆弱。
  - 原始 DiT 头维（如 dh=64 工作点）在给定片上容量下不进融合注意力流水；guidance 对批处理不摊销该程序权值流。
  待证伪：在公开扩散 Transformer 推理工作点上，端到端出图时间随单步时延近似线性而批吞吐提升不可测缩短出图时间，或流式 soft-max 重标在低精度饱和下可测数值失败，或原始头维相对融合注意力片上容量可测装不下，或 guidance 对批相对单样本权值流摊销无可测收益。

CONSTRAINT: |
  难在：产品指标锁在单步时延（批吞吐≠出图），权值须沿 T×B 轨迹摊销，片上无 KV 增长却仍按层工作集封顶；
  同时流式 soft-max 重标在低精度近 one-hot 脆弱，且原始头维与融合注意力流水、guidance 对批与权值流摊销可同时失败。
  禁止提出 VLIW 调度、权值驻留阵列、单遍 soft-max 流水、软件流水或任何具体扩散推理加速机制；只问「单步时延产品指标 + T×B 权值摊销 + 流式重标脆弱 + 头维/片上容量与 guidance 对批摊销失败」是否同时承重失败。
  证伪条件：若公开工作点上批吞吐提升已可测缩短出图时间、或流式 soft-max 在低精度饱和下无可测重标失败、或原始 DiT 头维已装入融合注意力片上容量且 guidance 对批已可测摊销权值流，则本问题不成立。
  及格线：以单步时延、出图时间、权值加载次数/带宽、注意力中间驻留与数值误差对照；不以批吞吐代理代替出图时间，不以层平均占用代理代替头维装入与权值摊销。
