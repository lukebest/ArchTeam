CONTEXT: |
  对象是公开 LLM 集合通信，不是 DRAM 内部 bank 映射。
  取 k=3 的 2D mesh：3×8=24 秩（公开 24 卡工作点）。
  流量是专家下标或 token 下标的等差步进 all-to-all / all-gather，维序路由。
  问：δ≡0 (mod 3) 时，该维占用是按整数剩余掉到 1/3，还是低位数字仍在动而保持满维。

SYMPTOM: |
  3×8 mesh，k=3 那一维只有 3 个节点。
  - 整数诊断：v_3(δ)≥1 ⇒ 该维占用 1/3，整网占用 8/24≈33.3%，集合时间相对满维 ≥3×。
  - 数字诊断：该维 3 个节点仍都进流量，整网占用 24/24，时间按满维 bytes/β。
  - 公开对齐：24 卡 MoE all-to-all，专家数 E 为 3 的倍数（E=24/48/64 量级），
    专家下标步长 δ_E≡0 (mod 3)。
  待证伪：存在公开 (E, 3×8 或 3×N) 工作点，使 δ_E≡0 (mod 3) 时
  该维占用 ≠1/3 且 ≠1，逐步时间不能用其中单一诊断解释。

CONSTRAINT: |
  不改片内 bank 映射，不写新的路由设计。
  难在同一条等差流上并存两套占用不变量——整数剩余类 vs 低位数字——
  像集基数不再单由 gcd(δ,k) 锁死。
  证伪条件：若所有公开工作点上，δ≡0 (mod 3) 时该维占用恒为 1/3 或恒为 1，
  则该同构不构成可测的新问题。
