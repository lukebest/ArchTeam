generality_score: 8
同源:
  - arXiv:2609.12208 p.1-3
  - P-0143

CONTEXT: |
  对象是脉动阵列类加速器上的 LLM 推理：decode 退化成 GEMV，带宽绑定。
  向量量化（VQ/码本）可达 sub-2-bit、端到端约 ~1.4-bit 平均位宽，压缩比高；
  但片上反量化/码本查找把复杂度从 DRAM 搬到片上不规则访存，压缩≠加速。
  解析式低比特在高度非均匀权值上弱；VQ 算法侧能压到 sub-2-bit，硬件却难兑现吞吐。

SYMPTOM: |
  - 多 PE 并发码本查找 → 片上存储冲突；高压缩比常无真实加速。
  - Llama2-7B 2-bit AQLM 端到端约 1.88× 慢于全精度（图示约 ~1.9×）。
  - 按码本预计算部分和再按索引累加：瓶颈从 MAC 挪到 accumulate，负载失衡、利用率仍低。
  - 解析式低比特难贴合高度非均匀权值；VQ 可达 sub-2-bit / ~1.4-bit 平均，硬件吃不到对应吞吐。
  待证伪：在公开脉动阵列/类脉动 LLM decode 工作点上，VQ/码本路径相对全精度端到端可测变慢（约 ≥1.8×），
  或片上并发码本冲突使压缩比无法兑现 ≥1× 加速，或部分和预计算路径使 accumulate 相对 MAC 可测失衡。

CONSTRAINT: |
  难在：decode GEMV 带宽绑定下，VQ 把带宽节省换成片上不规则码本冲突；预计算部分和又把瓶颈从 MAC 推到累加与负载失衡；
  算法 sub-2-bit 与硬件可兑现吞吐不对齐。
  禁止提出查找单元、双流执行、码本复制/分银行、LUT 数据流或任何具体硬件-算法协同设计；只问「高压缩无加速 + 码本冲突 + MAC→accumulate 失衡」是否同时承重失败。
  证伪条件：若公开工作点上 VQ/码本路径端到端相对全精度已达 ≥1× 加速、片上码本冲突可忽略、且 MAC/accumulate 无负载失衡，则本问题不成立。
  及格线：以端到端加速比对照全精度基线，压缩比仅为代理；通过线为端到端加速 ≥1，不以压缩比或 MAC 利用率代理代替。
