generality_score: 8
同源:
  - arXiv:2609.17057 p.1-3

CONTEXT: |
  对象是片上 2D mesh：易布线，但多种流量模式挤过少数行/列/割边，这些边决定饱和吞吐，其余容量闲置。
  小额额外连线预算下：随机长程捷径可能吸流却不泄真瓶颈；最短路或纯局部路由把过多包灌入同一 express，或看不见数跳外的拥塞。
  拓扑与路由耦合：有用长边须把容量放到流量需要处；路由须用上该容量且不把新边变成新热点。
  合法放置还受总 Manhattan 线长预算、每路由器 express 度数上限、最小有用长度约束；静态图指标对仿真吞吐/时延是差预测器。

SYMPTOM: |
  - 2D mesh 易布线，但多种流量挤过少数行/列/割边 → 割边定饱和吞吐，其余容量闲置。
  - 小额线预算：随机长边可吸流不泄真瓶颈；最短路/纯局部路由灌同一 express 或看不见数跳外拥塞。
  - 拓扑+路由耦合：长边须对准流量需求，路由须用容量且不造新热点。
  - 合法放置受总 Manhattan 线预算、每路由器 express 度数上限、最小有用长度约束；静态图指标相对仿真吞吐/时延是差预测器（含 16×16 等规模工作点）。
  待证伪：在公开 mesh/express-mesh 工作点上，饱和吞吐由少数割边决定而大量链路可测闲置，或预算匹配的随机长边相对流量感知放置可测不泄瓶颈甚至造热点，或静态图指标（如加权最短路）对仿真高载吞吐/时延可测预测失败。

CONSTRAINT: |
  难在：割边饱和与全局闲置并存；小预算长边放置与路由互相决定成败——放错吸流、路由错造新热点；
  合法解还绑线长预算、度数上限与最小长度，静态图最优 ≠ 仿真吞吐/时延最优。
  禁止提出流量感知贪心放置、仿真引导退火、committed top-K 路由、拥塞广告或任何具体拓扑-路由共设计机制；只问「割边定饱和 + 随机/局部长边与路由耦合失败 + 静态图指标差预测仿真」是否同时承重失败。
  证伪条件：若公开工作点上 mesh 饱和已不被少数割边主导且容量利用近似均匀、或预算匹配随机长边已稳定泄真瓶颈且最短路/局部路由不再造 express 热点、或静态图指标已可可靠预测仿真高载吞吐/时延，则本问题不成立。
  及格线：以高载饱和吞吐、时延、割边/express 利用率与闲置容量对照；不以 ASPL 或静态跳数代理代替仿真吞吐/时延承重。
