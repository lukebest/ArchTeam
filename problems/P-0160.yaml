generality_score: 8
同源:
  - arXiv:2609.09643 p.1-3

CONTEXT: |
  对象是工具调用型智能体循环：工具等待期间 KV 前缀持续增长；多会话共享 SRAM/HBM 池，驱逐/分层是会话级效率问题，与计算模式优化正交。
  同一 12 轮会话：常驻智能体跨工具等待保留前缀；请求作用域在每次解码后丢弃；工具等待 ≠ 人类聊天停顿。
  近存调度决策预算约个位数 µs；学习型替换在数百 µs–ms，慢约 2 个数量级。

SYMPTOM: |
  - 1415 会话、3 个模型族的编码/网页智能体轨迹：前缀 token 长入边云 SRAM/HBM 包络；预算装不下存活集时，会话调度不可避免。
  - 同一 12 轮会话：常驻保留跨工具等待前缀，请求作用域每次解码后丢弃——工具等待 ≠ 人类停顿。
  - 近因/超时/ETA 代理：在 6 条轨迹 × 6 个容量包络上，AMAT、额外 prefill、TTFT 均差于 Bélády 下一引用上界。
  - 近存调度决策预算约个位数 µs；学习型替换数百 µs–ms，约慢 2 个数量级。
  待证伪：在公开智能体轨迹与容量包络上，代理驱逐相对 Belady 使 AMAT/TTFT 可测变差，或学习替换超出 µs 级决策预算。

CONSTRAINT: |
  难在：会话级前缀跨工具等待存活，与请求作用域生命周期不同；共享池装不下时必须调度，但代理启发相对 Belady 端点指标落后，且决策窗口卡在个位数 µs。
  禁止提出具体替换策略或学习调度器；只问「会话级前缀膨胀 + 代理驱逐劣于 Belady + µs 预算」是否同时承重失败。
  证伪条件：若公开设定上前缀不涨出包络、或近因/超时/ETA 在 AMAT/TTFT 上已贴 Belady、或学习替换可在个位数 µs 内决策，则本问题不成立。
  及格线：以 AMAT/TTFT 相对 Belady 对照，不以命中率代理代替；µs 决策预算为硬约束；缩减 bbox ≠ 完整包络。
