generality_score: 8
同源:
  - P-0106
  - drafts/D-0106-M5-vertical

CONTEXT: |
  冻结信封：120 core / 384 DMC / 18432 bank；8GiB；512B；outstanding 128（整机 15360）；
  stride 1B～2MiB。禁止跨 DMC steal。
  假设每 DMC 在活集上已双射、死命中=0。2 幂步长下每 DMC 并行类为 n/gcd(δ,n)。
  不问怎么把 gcd 再压小。

SYMPTOM: |
  - 25% 均匀：每 DMC n=36，大 2 幂 δ 下 gcd=4，类数 9，活 bank 占用 9/36=25%。
    整机 N'=13824，类数 384×9=3456。每 DMC 约 40 笔在途落到 9 类，队列深 40/9≈4.4
    （对比 n=36 全用时 40/36≈1.1）。公开 HBM2 tRC≈48 ns，同类串行附加约 4.4×48≈0.21 μs。
    12.5% 时 n=42、类数 21，占用 50%；6.25% 时 n=45、gcd(2^k,45)=1，不是本层。
  - 聚集退役可使整 DMC n=0。25% 按整 DMC 聚集可零掉 96 台，剩余 288 台吃 15360，
    约 53.3 笔/DMC（+33%）；禁止 steal，这些地址无处可去。
  - 修复必须 drain 15360 笔在途。下界 ~1×tRC≈48 ns；按 3456 类并行 ≈0.21 μs；
    单核 128 笔落同一类则 128×48 ns≈6.1 μs。
  待证伪：大 2 幂 δ 上因 9/36 绝对并行度使队列/BW 越出可接受窗，
  或 n=0 造成空 DMC 像，或 drain 停顿 ≥0.21 μs。

CONSTRAINT: |
  硬件冻住，禁止跨 DMC steal。禁止把剩余现象写成「gcd 没优化好」。
  n=0 的 DMC 不能靠邻居补洞。
  证伪条件：若在 6.25/12.5/25% 均匀与聚集退役下，大 2 幂 δ 的 min/mean BW≥0.85、
  无空 DMC 像、且 drain 对作业不可见（≪tRC），则本问题不成立。
