# 中文题目: 安全关键 OoO 核异构并行检错：不护特权态覆盖率掉到 ASIL-A/B，护了快照胀 5.4×、减速近翻倍，小核特权切换与共享锁争用再拖垮
generality_score: 8
同源:
  - arXiv:2610.03045 p.1-3

CONTEXT: |
  传统锁步复制整颗核心逐周期比对引脚，面积与功耗超过单核 2 倍；对 OoO 超标量核尤为昂贵，且逐周期引脚级比对需要长距离、高扇出互连，妨碍时序收敛、降低可达频率。
  以「大核执行、多个小核分段重放校验」的异构并行检错方案，此前报告的约 1.02× 减速 / 24% 面积开销来自高度抽象的 syscall 仿真或理想化原型，只覆盖用户态，特权态执行完全不受保护。
  在 OoO 核上跑完整 Linux 时，若不保护特权态：用户态密集的 PARSEC 也达不到 ASIL-C 要求的 97% 故障覆盖率；MiBench 几乎全部低于 ASIL-B 的 90%，只能满足最低的 ASIL-A。特权态时间占比按负载为约 0.7%–43%，几何平均约 4.98%。
  要覆盖特权态，检查点须捕获全部约 347 个控制与状态寄存器（定制扩展可达约 4,096 个），外加约 64 个架构寄存器，快照体积膨胀约 5.4×；沿用用户态方法做全系统保护，几何平均减速约 1.91×（相对仅用户态保护），频发非对齐访存触发特权切换的负载峰值约 3.7×，减速几乎与快照体积成正比。
  超过 60% 的控制与状态寄存器在任何负载中都从未被访问；但即便是同一类陷入（两次定时器中断），实际访问的寄存器集合也差异很大，静态预选不可靠。
  校验小核要在与大核相同的特权级重放碎片化分段：须先切换到目标特权级、把 PC 重定向到分段起点、校验后再切回；用原生陷入处理流程做这些准备会让小核大量时间花在进出特权态的前导开销上而非校验本身，示例中 1 个大核需要约 3 个小核才能跟上。
  大核与小核在无法被访存日志记录的共享 OS 锁（如缺页处理）上发生争用，会扰乱 OS 资源管理与校验调度，甚至导致系统级死锁；同时所有小核忙时大核必须停顿等待。
  工业安全标准（ISO 26262、DO-178C）要求检错后的缓解流程在毫秒级的故障容忍时间间隔内完成，检错延迟预算受此约束。

SYMPTOM: |
  - 传统全核锁步：面积/功耗超过单核约 2×，OoO 上引脚级逐周期比对的长距离高扇出互连妨碍时序与频率。
  - 仅用户态的异构并行检错在完整 Linux+OoO 上：PARSEC 达不到 ASIL-C 的 97% 覆盖；MiBench 几乎全部低于 ASIL-B 的 90%，只够 ASIL-A。特权态时间占比约 0.7%–43%（几何平均约 4.98%）却足以把覆盖率打穿。
  - 为护特权态快照须含约 347 个 CSR（扩展可达约 4,096）+ 约 64 架构寄存器，体积约胀 5.4×；全系统保护相对仅用户态几何平均减速约 1.91×，峰值约 3.7×，减速与快照体积近似正比。
  - >60% CSR 在任何负载中从未被访问，但同类陷入实际触及的 CSR 集合仍差异大，静态预选不可靠。
  - 小核用原生陷入流程做特权级切换与 PC 重定向时，大量时间花在前导开销而非校验；示例口径下 1 大核约需 3 小核才能跟上。
  - 大核与小核在不可日志化的共享 OS 锁上争用可扰乱调度甚至死锁；小核全忙时大核必须停顿。
  - 检错+缓解须落在毫秒级故障容忍时间间隔内（ISO 26262 / DO-178C），延迟预算硬约束。
  - 端点包括故障覆盖率（相对 ASIL-A/B/C 阈值）、全系统相对基线的减速与面积、检查点/快照体积、检错延迟（相对 FTTI）、以及共享锁争用下的正确推进（无死锁）。
  待证伪：在完整 Linux + OoO 公开负载上，若仅用户态保护即可稳定达到 ASIL-C 的 97% 覆盖，或全系统特权保护在快照不胀约 5.4×、减速不明显劣于仅用户态、且无共享锁死锁的前提下仍满足毫秒级 FTTI，则本问题不足以成立。

CONSTRAINT: |
  难在同一安全关键 OoO + 完整 OS 合同上同时承受：(1) 特权态虽时间占比中位不高却打穿 ASIL 覆盖；(2) 全 CSR 快照体积与减速近似正比膨胀；(3) 小核特权切换前导与不可日志化共享锁争用——只报用户态理想原型的 1.02×/24% 不等于全系统过线。
  故障覆盖率、全系统减速/面积、快照体积、检错延迟（FTTI）与无死锁推进是 endpoints；仅用户态加速比、抽象 syscall 仿真覆盖率、静态从未访问 CSR 比例、或忽略共享锁的小核吞吐都是 proxies，endpoints ≠ proxies。
  只在用户态、抽象仿真、理想化原型、或关掉特权切换/共享锁的实验属于 reduced-bbox，不等于覆盖完整 Linux + OoO + 毫秒级 FTTI 的 full envelope；reduced-bbox ≠ full envelope。
  及格判定若采用 0.85，0.85 是 pass bar，不是 measured mean；不得用平均负载覆盖率过线冒充 ASIL-C 阈值与最差负载（如约 3.7× 减速点）都过线。
  无解法提案，不提出具体检查点压缩、CSR 动态追踪、小核特权快路径、锁避让协议或任何微架构/OS 改造。
