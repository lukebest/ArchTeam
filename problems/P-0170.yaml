generality_score: 8
同源:
  - arXiv:2609.13563 p.1-3

CONTEXT: |
  对象是模拟脉冲神经元/突触：固定硬件资源、无 TDM 复用，仿真规模被物理副本封顶（单芯片 ≤512 神经元、131072 突触）。
  模拟核面积不像嵌入式数字那样吃先进节点红利；混合神经形态横向扩展 → chiplet 互联压力。
  模拟为连续时间、不能停钟，扩展系统须全局异步；拥塞改变脉冲到达时刻 → 拥塞脉冲常只能丢弃，无法暂停排队保时序。
  脉冲几乎无载荷、信息在到达时刻，系统可容忍部分丢失；配置数据与片上 CPU 消息必须可靠——同一织物同时承载两类流量。

SYMPTOM: |
  - 单芯片模拟核上限约 512 神经元 / 131072 突触；无 TDM 复用 → 规模=物理副本数，横向扩展必然打互联。
  - 芯片相对生物实时约 1000× 加速；嵌入式 CPU 跑复杂可塑性——配置/CPU 流量与脉冲流量共存且可靠性需求对立。
  - 连续时间全局异步下，拥塞改到达时刻 → 脉冲常须丢弃；配置与 CPU 消息不可丢。
  - 若互联硬分割或静态划分配置/CPU 与脉冲带宽，失衡会同时伤实时与可用性。
  待证伪：在公开混合神经形态/chiplet 工作点上，模拟规模仍被物理副本封顶，或同一织物上脉冲可丢 vs 配置/CPU 必达两类流量在拥塞下可测互伤实时与可用性，或静态带宽分割相对统一承载可测恶化。

CONSTRAINT: |
  难在：模拟核不可 TDM、不可停钟，扩展靠副本与异步；脉冲可丢但时刻敏感，配置/CPU 必达；
  同一互联若硬分带宽，两类流量失衡同时打实时加速比与系统可用性。
  禁止提出路由 chiplet、ARQ/信用流控、加权仲裁或任何具体双类流量统一互连机制；只问「物理副本封顶 + 连续时间可丢脉冲 vs 必达配置/CPU + 静态分割互伤」是否同时承重失败。
  证伪条件：若公开工作点上模拟规模已可 TDM/停钟扩展而不靠副本、或脉冲与配置可分到互不干扰的独立可靠路径且静态分割不再伤实时与可用性，则本问题不成立。
  及格线：以可仿真规模、脉冲到达抖动/丢弃率、配置/CPU 可靠交付与端到端实时加速比（相对生物实时约 1000× 工作点）对照；不以单一链路利用率代理代替双类流量共承。
