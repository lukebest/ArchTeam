generality_score: 8
同源:
  - arXiv:2609.04724 p.1-3

CONTEXT: |
  对象是边缘侧 LLM 的压缩/加速协同：内存、存储与算力预算受限。
  算法侧混合精度已能在层内/组内露出丰富精度–效率权衡；加速器多锁在少数离散精度档。

SYMPTOM: |
  - 量化粒度越细（小块共享 scale）越贴合局部权值、保住精度，但 scale/控制元数据与硬件复杂度上升；
    粒度越粗（按通道一个 scale）数据流更规整，低位宽下精度损失更大。
  - 激进低比特（≤4-bit）下，固定资源预算的最优点常落在离散精度档（如仅 4 与 8）之间的「分数」空隙，硬件吃不到。
  - LLM 权值呈重尾且高度异质，均匀间距低比特难以在通道内同时覆盖动态范围与精度；
    异常值感知量化能保住精度，但引入不规则布局与硬件开销。
  - 面向 CNN/DNN 的精度可调加速器多停在层粒度与常规整数类型，吃不到 Transformer 权值的层内异质性。
  待证伪：在公开边缘 LLM 工作点上，算法最优混合精度落在加速器离散档之间，
  被迫选邻档时精度或效率相对算法最优可测变差。

CONSTRAINT: |
  难在：算法连续权衡 vs 硬件离散档，最优点掉进空隙就不是「再量化一次」能对齐的。
  细粒度要元数据与不规则，粗粒度要精度；层粒度可调吃不到层内异质。
  证伪条件：若公开工作点上算法最优精度组合总落在加速器已实现离散档内，
  且无额外精度损失，则本问题不成立。
