# 中文题目: 边缘 VLA 动作头多步去噪在 GPU 上内存绑定：占参很小却成延迟瓶颈，共享 L2 留不住权重，跨器件同步吃掉异构收益
generality_score: 8
同源:
  - arXiv:2610.00311 p.1-3
  - P-0189
  - P-0172

CONTEXT: |
  边缘 GPU 擅长并行化计算密集的视觉 Transformer，但对 Diffusion Action Expert 类动作头模块：多步去噪需反复从 DRAM 装载参数，表现为内存绑定，宽计算通路利用率低。
  即便紧凑 VLA 相对早期模型缩小数量级，高端桌面 GPU 工作点仍约 17 / 13 it/s、功耗约 200 W，难以进入移动操作、仓储与野外功率/热/成本包络。
  动作头参数仅约占模型很小比例（约 1.7–1.8M vs 总约 27M / 93M），却因约 T≈20 步迭代采样成为边缘端到端延迟瓶颈。
  边缘 GPU 上 INT8 动作头足迹约 1.8 MB，接近名义 2 MiB L2；共享、不可钉住的 L2 无法保证跨全部去噪步的权重驻留。
  大型图像扩散 FPGA 加速器仍常依赖片外存储器，因其网络比机器人动作头大几个数量级——小到可全片上、却迭代到成瓶颈的工作点未被优先。
  异构划分要求：感知骨干留在 GPU、动作头在另一器件上以确定性计算流水运行且去噪循环中无动态片外取参；否则 I/O 特性与计算特性错配依旧。
  量化策略影响片上资源与并行度权衡：更高并行的整型通路 vs 更省片上存储的低比特分组，会改变动作头延迟与可容纳模型规模。
  端到端需在真实边缘异构平台上证明延迟与能效收益，并显式计入跨器件传输与主机同步。

SYMPTOM: |
  - 紧凑 VLA 在高端桌面 GPU 上仍约 17 / 13 it/s、约 200 W，进不了移动操作/仓储/野外功率与热包络。
  - 动作头参数仅约 1.7–1.8M（相对总约 27M / 93M 很小），却因约 T≈20 步迭代采样主导边缘端到端延迟。
  - 动作头多步去噪反复从 DRAM 装参：内存绑定，宽 GPU 计算通路利用率低；视觉骨干算密、动作头访存密，错配并存。
  - INT8 动作头足迹约 1.8 MB，接近名义 2 MiB L2；共享、不可钉住的 L2 无法保证跨全部去噪步权重驻留，每步或反复回 DRAM。
  - 大图像扩散加速器常因网络更大而依赖片外存储；「小到可全片上却因迭代成瓶颈」的动作头工作点未被优先覆盖。
  - 感知骨干与动作头分到不同器件时，若去噪循环仍动态片外取参，或跨器件传输与主机同步未计入，异构划分的延迟/能效收益会被吃掉。
  - 更高并行整型通路 vs 更省片上存储的低比特分组会改变动作头延迟与可容纳规模；量化选择直接牵动片上资源—并行度权衡。
  - 端点包括端到端 it/s 或控制 Hz、动作头延迟（含全部去噪步）、整机功耗/能效、跨器件传输与主机同步开销，以及在移动/仓储/野外功率热包络内是否可部署。
  待证伪：在公开紧凑 VLA 与真实边缘异构平台上，若动作头不再因约 T≈20 步 DRAM 回装成为延迟瓶颈、共享级缓存可跨步驻留权重或等价消除反复取参、且计入跨器件传输与同步后延迟/能效仍进入移动功率热包络，则本问题不足以成立。

CONSTRAINT: |
  难在同一边缘功率/热/成本包络上同时承受：(1) 动作头虽小参却多步迭代的内存绑定；(2) 共享不可钉住缓存无法跨步保权重；(3) 异构划分后的跨器件传输与主机同步——只加速视觉骨干或只报动作头峰值算力都不等于端到端过线。
  端到端 it/s（或控制 Hz）、动作头全去噪步延迟、整机功耗/能效、跨器件+同步开销是 endpoints；单步峰值吞吐、忽略同步的器件本地加速、只报动作头参数占比或只测桌面 200 W 级 GPU 都是 proxies，endpoints ≠ proxies。
  只在桌面高端 GPU、关掉多步迭代、假设 L2 可钉住全权重、或不计入跨器件传输/主机同步的实验属于 reduced-bbox，不等于覆盖移动操作/仓储/野外全信封；reduced-bbox ≠ full envelope。
  及格判定若采用 0.85，0.85 是 pass bar，不是 measured mean；不得用平均步加速或平均利用率过线冒充端到端延迟与功耗端点都过线。
  同源但不并入 P-0189：P-0189 问单 GPU 上 VLA 视觉/动作相位共跑与 HOL/低利用率；本卡钉在动作头多步去噪的内存绑定、L2 驻留失败与边缘异构跨器件同步。
  同源但不并入 P-0172：P-0172 问扩散 Transformer 相对 AR 的单步时延与权值摊销；本卡是机器人 VLA 动作头在边缘包络下的部署，不绑定出图产品指标。
  无解法提案，不提出具体异构划分、片上驻留策略、量化位宽选择、FPGA/ASIC 流水或任何微架构。
