# 中文题目: 边缘音频去噪在耳机/助听器功耗信封下，SNN 仍要混合乘加、权重量级压垮片上 SRAM，操作数能量代理过线也不等于跟上帧率
generality_score: 8
同源:
  - arXiv:2609.37711 p.1-3
  - P-0155
  - P-0171
  - P-0196

CONTEXT: |
  智能手机、无线耳机与助听器等边缘设备需在严重电池功耗约束下跑音频去噪神经网络，用户仍期望长续航。
  传统 ANN 去噪依赖大量稠密 MAC 与较大内存，难以部署在无线耳机类高约束 SoC 上。
  即便改用高激活稀疏的 SNN，许多公开工作点仍要求硬件同时支持多种算子混合：尖峰层可走纯加，但编码层常需矩阵乘，泄漏/门控项常需逐元素乘，而非「只加即可」。
  去噪按音频帧推进（公开叙述常以约 32 ms/帧为能量单位），边缘部署隐含实时约束：仅降低操作数能量代理，并不足以保证在可行时钟下跟上帧率。
  该类音频 SNN 计算模式高度异构（矩阵乘 + 纯加 + 逐元素乘，以及多帧深度滤波类子图），与「主要面向同构 MAC」的常规神经网络加速器假设不匹配。

SYMPTOM: |
  - Intel N-DNS Challenge 操作数能量代理口径下，公开竞赛尖峰工作点约 1.48 µJ/帧、参数约 965K（FP32）、SI-SNR 约 15.20 dB；同表 ANN 基线约 12.51 µJ/帧，另一 ANN 工作点约 0.09 mJ/帧——操作数代理跨数量级，但都不自动等于可部署在耳机/助听器 SRAM 与时钟信封内。
  - FP32 权重量级约 4 MB 时，对助听器/蓝牙耳机类低功耗 SoC 的片上 SRAM 容量而言不可行：权重足迹单独即可压垮片上存储预算。
  - 高激活稀疏的 SNN 仍常同时需要矩阵乘、纯加与逐元素乘；「尖峰=只加」在编码层与泄漏/门控项上不成立，异构算子混合仍在。
  - 计算图与「主要面向同构 MAC」的加速器假设不匹配：同构 MAC 阵列对矩阵乘以外的纯加/逐元素乘/多帧滤波子图要么空转要么另开通路，端到端能量与时延仍受异构部分支配。
  - 帧推进约 32 ms/帧量级时，边缘实时约束要求在可行时钟下跟上帧率；只把操作数能量代理压到 µJ 级，不等于端到端推理在该帧窗内完成。
  - 端点包括帧能量（µJ/帧或 mJ/帧）、端到端帧时延相对帧长、片上/片外权重足迹（MB）、可支撑的 SI-SNR（或同等公开指标），以及在耳机/助听器级功耗与 SRAM 信封下的可持续帧率。
  待证伪：在助听器/蓝牙耳机级功耗与 SRAM 信封、公开 N-DNS 或同等音频去噪工作点上，若权重足迹不再压垮片上预算、异构乘加混合不再支配端到端能量/时延、且操作数能量代理过线即同时保证帧窗内实时完成，则本问题不足以成立。

CONSTRAINT: |
  难在同一耳机/助听器功耗与 SRAM 信封上同时承受：(1) 稠密 ANN 或大参数足迹；(2) SNN 仍残留的矩阵乘与逐元素乘异构算子；(3) 约 32 ms/帧的实时帧率——三者任一单独缓解都不够，且「尖峰稀疏」与「操作数 µJ 代理」都不能替代片上足迹与帧窗端点。
  帧能量、帧时延相对帧长、权重足迹、SI-SNR 与可持续帧率是 endpoints；单算子操作数计数、峰值尖峰稀疏率、只计尖峰层纯加而忽略编码/门控乘、或不计入片外权重搬运的加速比都是 proxies，endpoints ≠ proxies。
  只在更大 SRAM/功耗信封、更短序列/更小参数、关掉编码层矩阵乘或门控逐元素乘、或只报操作数能量代理不报帧窗是否跟上的实验属于 reduced-bbox，不等于覆盖耳机/助听器全信封与完整异构去噪图；reduced-bbox ≠ full envelope。
  及格判定若采用 0.85，0.85 是 pass bar，不是 measured mean；不得用平均层稀疏率或平均操作数能量过线冒充帧能量、帧时延与足迹端点都过线。
  同源但不并入 P-0155：P-0155 问移动端 DVS/SNN 的 CIM 形状对齐与膜电位存储；本卡只问音频去噪在耳机/助听器信封下的异构算子、权重足迹与帧率。
  同源但不并入 P-0171：P-0171 问卷积 GEMM 层内 ANN/SNN 元素级能-时不均与整层空转；本卡不绑定视觉卷积 tile，只问音频去噪帧路径。
  同源但不并入 P-0196：P-0196 问边缘 SViT 的 MHSA 参数访存与片上拥堵功耗；本卡是音频去噪而非视觉 Transformer。
  无解法提案，不提出具体尖峰编码、算子融合、量化位宽、片上存储分层、多帧滤波实现或任何加速器微架构。
