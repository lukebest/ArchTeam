generality_score: 7
同源:
  - address-interleaving-lab knowledge/implementation-and-validation.md（target_id 单独允许多对一；完整元组才可逆）
  - knowledge/ipoly-primer.md

CONTEXT: |
  冻结信封：2×Die2；120 core / 384 DMC / 18432 bank。只改 interleave；512B；4K 页；8GiB 共享；
  outstanding 128；stride 1B～2MiB。必须覆盖 bank partial good。
  库规定 map 必须能 inverse：完整输出是 {target_ids, local_address}。target_id 单独允许多对一。
  库内多个 mapper 的 getHAID 返回 0 或只返回扁平 bank 号。

SYMPTOM: |
  只拿 target_id 反演块地址会丢高位。8GiB=2^33，粒度 512B=2^9，块地址宽 24 bit；
  18432 目标只编码 14.17 bit，单独 target 至少丢 9.8 bit。
  partial good 下目标集合更小，丢失更多。
  待证伪：库映射在冻结信封上 inverse(map(A))≠A 的比例 >0，或写路径与读路径用不同残缺输出导致同一 A 落到不同 DMC。

CONSTRAINT: |
  只改 interleave。读、写、coherence/home-agent 必须用同一 mapping epoch。
  难在：资源选择本身信息量小于块地址；没有 local_address 就不可逆，不可逆映射不能在 partial good 下重放。
  证伪条件：若仅用 target_id 即可在 8GiB 窗内对所有 A 做到 inverse(map(A))=A，则本问题不成立。
