generality_score: 8
同源:
  - arXiv:2609.03125 p.1-3

CONTEXT: |
  对象是分布式多芯片边缘 AI：物理分离的传感器前端与下游神经网络加速器。
  像素内模拟计算可降低前端数据量，仍须跨 chiplet 导出模拟激活。
  现有系统多用电气 interposer，并常被迫插入 ADC/DAC。

SYMPTOM: |
  - 传感器前端与加速器之间的通信成为瓶颈；距离增大时电阻损耗与电容负载恶化带宽。
  - 电气通路上 ADC/DAC 插入抬高能量与延迟；激活以模拟形式在前端产生却被数字化只为过片。
  - 面向 560×560 视觉唤醒类输入，像素平面需密集、低漏电地暂存激活以供跨片传输；
    大金属电容方案面积代价高。
  - 相对 8-bit 数字电气基线，长距离链路上能量–延迟积成为关键差距（公开 560×560 VWW 上约 2.04×；
    差距随链路长度相对 6-bit 电气基线仍扩大）。
  待证伪：在公开 560×560 级视觉唤醒工作点上，跨片通信的能量–延迟积相对 8-bit 电气基线 ≥约 2×，
  且随距离相对 6-bit 基线继续扩大。

CONSTRAINT: |
  难在：前端已是模拟激活，电气 interposer 却逼出 ADC/DAC 与距离敏感的 R/C，面积/能量/延迟绑在一起。
  禁止把问题改写成「只换更短的板级线」而不面对 chiplet 间距。
  证伪条件：若公开工作点上跨片能量–延迟积相对 8-bit 电气基线 ≤1（且不随距离恶化），
  则本问题不成立。
