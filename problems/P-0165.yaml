generality_score: 8
同源:
  - arXiv:2609.11044 p.1-3

CONTEXT: |
  对象是计算病理学全流程加速：病理人力约十年 −>17%，诊断不一致，院内数据不足；扫描仪/软件升级使模型失效 → 反复重训。
  流水线含细胞核分割/特征、kNN 图、迭代 GCN Aggregation/Combination；早期阶段规则卷积/MLP，后期不规则 kNN 与顶点中心聚合。
  专用 GCN 加速器常假设幂律边分布，但病理 kNN 度数相近 → 负载均衡等策略失效；非 AI 小市场加速器无法匹配 AI 芯片商业规模——需同一片上资源集同时承规则 CNN/MLP 与不规则 kNN/聚合，否则制造成本无法摊销。

SYMPTOM: |
  - 病理人力约十年 −>17%；诊断不一致 + 院内数据不足；扫描仪/软件升级使模型失效 → 反复重训压力持续。
  - 4× TITAN V 上仅 139 张 WSI（4548×7520，20×）训练 CGC-Net 约 12h；真实 WSI 约 150000×100000 px，规模更糟。
  - 流水线：核分割/特征 → kNN 图 → 迭代 GCN Aggregation/Combination；kNN 顺序/暴力，顶点中心聚合数据移动主导，不规则 GPU 线程发散。
  - 分阶段模块重复片上缓冲 + 设计期固定资源配比 → 运行时失衡；专用 GCN 加速器常假设幂律边，病理 kNN 度数相近 → 既有策略失效。
  - 基线 CPU/GPU/AI/GCN 平台端到端低效；非 AI 小市场加速器无法摊销到 AI 芯片商业规模——规则与不规则算子若分芯片，制造成本不可摊销。
  待证伪：在公开计算病理 WSI/GCN 工作点上，端到端相对基线平台吞吐仍可测落后，或分阶段固定资源配比在运行时失衡可测，或幂律假设策略在病理 kNN 上失效，或规则 CNN/MLP 与不规则 kNN/聚合无法共享同一可摊销片上资源集。

CONSTRAINT: |
  难在：流水线跨规则与不规则算子；kNN/聚合数据移动与线程发散主导；分阶段重复缓冲与固定配比失衡；病理 kNN 度数相近使幂律导向 GCN 加速策略失效；小市场专用芯无法摊销。
  禁止提出具体脉动阵列改装、可重构数据通路、负载均衡电路或「AI+X」产品方案；只问「端到端低效 + 运行时失衡 + 幂律策略失效 + 规则/不规则必须共摊同一资源集」是否同时不可接受。
  证伪条件：若公开工作点上现有 CPU/GPU/AI/GCN 基线已端到端高效、分阶段资源配比无运行时失衡、幂律导向策略在病理 kNN 上仍有效、或独立小市场加速器已可摊销到商业规模，则本问题不成立。
  及格线：以端到端吞吐/能效与阶段间利用率对照基线平台，不以单核微基准代理代替全流水。