# 中文题目: 翻译密集负载上地址翻译仍占约 40–45% 执行时间，不规则跨页转移让空间/淘汰序预取失效，固定小表装不下 delta 对，覆盖率跟不上内存足迹
generality_score: 8
同源:
  - arXiv:2610.08483 p.1-3
  - P-0149

CONTEXT: |
  地址翻译在现代数据密集型应用中可占总执行时间约 40–45%（使用大页时仍约 15–20%），并预计随内存解耦与分层内存带来的更大物理地址空间进一步增长。
  翻译密集型负载常呈稀疏、指针密集的不规则访存，依赖空间规律（相邻页、按指令步长）的翻译预取无法捕获这些模式。
  依据 L2 TLB 淘汰顺序链接页的做法不可靠：时间上相邻被淘汰的页，未来并不一定相邻被访问。
  用固定容量片上表记录「哪个 delta 跟在当前 delta 之后」时，翻译密集型负载的重复 delta 对数多于表容量，已学到的对在复现前就被丢弃，限制覆盖率。
  页表为 4–5 级基数树，每个叶表项 8 B，8 个连续叶表项（映射 32 KB）同处一个 64 B cache block；页表遍历每级一次内存访问，页遍历缓存只在非叶项高复用时有效。

SYMPTOM: |
  - 翻译密集负载上地址翻译约占总执行时间 40–45%；即便用大页仍约 15–20%，且物理地址空间随解耦/分层内存继续变大。
  - 稀疏、指针密集的不规则访存下，基于相邻页或指令步长的空间翻译预取几乎抓不到模式。
  - 按 L2 TLB 淘汰顺序链接页不可靠：淘汰时相邻 ≠ 未来访问时相邻。
  - 固定容量片上 delta 关联表：重复 delta 对数超过表容量，对在复现前被逐出，覆盖率封顶。
  - 在约 200 个翻译密集负载上，以 32 KB（8×4 KB 页）区域按指令追踪：源区域前 4（8）个最常见目的区域覆盖约 86%（93%）页表遍历转移；>94% 转移距离可用 18-bit 有符号数表示——转移有集中性，却超出空间规律与小表容量的覆盖。
  - 区域粒度存在覆盖率—浪费权衡：256 KB 区域（64 页，32 KB 的 8×）一次覆盖更多页，但取目的区域需 64 个页表项、跨 8 个 cache block（对比 8 项占 1 个 block），部分页可能永不被访问。
  - 4–5 级基数树每级一次内存访问；页遍历缓存只在非叶项高复用时有效，不规则负载下叶级遍历成本仍在。
  - 端点包括地址翻译占执行时间比例、页表遍历次数与延迟、翻译预取覆盖率与准确率、预取引入的多余页表项/cache block 流量、硬件存储成本，以及覆盖率随应用内存足迹增长的扩展性。
  待证伪：在约 200 个公开翻译密集负载上，若空间/步长或淘汰序翻译预取已能覆盖绝大多数页表遍历转移、固定小表不因 delta 对溢出而封顶、且覆盖率随足迹扩展而无需按比例增加专用存储，则本问题不足以成立。

CONSTRAINT: |
  难在同时满足三项互相冲突的要求：(1) 捕获不规则、指针密集的跨页翻译转移；(2) 低硬件成本，排除大块专用表；(3) 覆盖率随应用内存足迹扩展——大足迹需为大量区域记住转移，而低成本不允许按足迹放大片上存储；区域粒度变大又把多余页表项与 cache block 流量计入成本。
  翻译时间占比、页表遍历次数/延迟、预取覆盖率与准确率、多余流量、存储成本与足迹扩展性是 endpoints；只报 TLB 命中率、只报单个负载的覆盖率、不计多余页表项流量的加速比、或只在大页配置下的结果都是 proxies，endpoints ≠ proxies。
  只用小足迹负载、只用大页、只测规则步长负载、或假设片上表容量随足迹无限增长的实验属于 reduced-bbox，不等于覆盖约 200 个翻译密集负载与 4–5 级页表全信封；reduced-bbox ≠ full envelope。
  及格判定若采用 0.85，0.85 是 pass bar，不是 measured mean；不得用平均负载覆盖率过线冒充最差足迹负载与多余流量端点都过线。
  同源但不并入 P-0149：P-0149 问多 GPU 统一内存下翻译与页表一致性经 CPU-IOMMU 集中处理、PTE 广播随卡数平方扩张；本卡只问单机 CPU 上翻译密集负载的不规则跨页转移与预取覆盖/成本。
  无解法提案，不提出具体预取器结构、关联表组织、页表项编码复用、区域粒度选择或任何 MMU 微架构。
