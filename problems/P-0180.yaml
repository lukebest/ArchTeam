generality_score: 8
同源:
  - arXiv:2609.18675 p.1-4
  - P-0152

CONTEXT: |
  接 P-0152 的 HBF 容量/寿命张力，但不并入：P-0152 问推荐侧热用户全量 KV 写回打寿命；本卡问 LLM 服务在固定封装下，细粒度 KV 与粗粒度 HBF plane 并行是否同时失败。
  对象是加速器本地内存：DeepSeek-V4-Pro 约 1.6 万亿参数、100 万 token 上下文，模型与持续增长的 KV 一起装不进 HBM；摊到更多 GPU 则加上通信与协调。
  HBF 按 stack–die–plane–block–page 组织。阵列读与编程约 4 KiB 物理页，擦除以块为单位；同 plane 访问串行，最重 plane 决定完成时间，其余 plane 空闲。
  固定封装预算下保留 HBM，会挤掉本可做成 HBF 的叠层或 die，plane 数与聚合读带宽一起被卡住，权值侧可用带宽也上不去。
  把动态 KV 直接放上 HBF 之后：细粒度读在放置与访问两层打乱 plane；增量写要聚齐才填得满 plane 并行，但编程不可抢占；不同寿命的页落在同一块则擦除必须迁移。

SYMPTOM: |
  - DeepSeek-V4-Pro：约 1.6 万亿参数、100 万 token 上下文。HBM 同时装不下模型与增长中的 KV；多 GPU 分摊容量则通信/协调上升。
  - 表征工作点例：6 栈 × 16 die/栈 × 32 plane/die = 3072 plane。读延迟约 4 μs，编程约 75 μs 且不可抢占；物理页约 4 KiB，擦除粒度为块。同 plane 访问串行，最重 plane 决定完成时间。
  - 固定封装下保留 HBM 即挤占 HBF 叠层/die，plane 数与聚合读带宽下降，权值侧可用带宽仍被卡住。
  - 放置失衡：请求完成或再激活改变活跃 KV 工作集，页不必移动，先前均衡的放置即可被打乱。
  - 访问失衡：即便放置均衡，PagedAttention 加 CTA 分块调度仍可读到少数 plane，迫使额外读波，其余 plane 空闲。
  - 增量 KV 要聚合成能填满 plane 并行的写；单次编程约 75 μs 且不可抢占。权值读与 KV 读把计算切成可能藏不住整段编程的窗口；推迟写回会被缓冲压力顶回去。
  - 原始 KV 写在该负载假设下仍可落在寿命预算内；但不同寿命的 KV 页共块时，擦除必须迁移有效页。DeepSeek-V4-Pro 表征：块级 GC 平均写放大约 30×，超出可用寿命裕度。按请求独占块能少迁移，却收紧 plane 条带。
  待证伪：在公开 LLM/HBF 工作点上，固定封装保 HBM 可测压低 HBF plane 数与聚合读带宽，或放置均衡之后细粒度 KV 读仍可测把负载集中到少数 plane 并增加读波，或约 75 μs 不可抢占编程在交错读写窗口中可测藏不住，或块级 GC 写放大可测达到约 30× 并超出寿命裕度。

CONSTRAINT: |
  难在三件事绑在同一套 plane 上，不能拆开过线：细粒度 KV 读在放置与访问两层打乱并行；增量写要聚合，但约 75 μs 的编程不可抢占，计算窗与缓冲压力对着干；混寿命共块则擦除迁移把写放大推到约 30×。
  约 30× 写放大是寿命端点，不是可以忽略的均值：表征上的平均放大一旦落到这个量级，不得以「只是平均值」判过。单 plane 的 reduced-bbox（局部忙闲、局部页分布）不等于全信封；全信封含全部 plane、放置与访问两层、以及写与擦。
  本卡不并入 P-0152。按请求独占块与跨 plane 条带互斥，只说明张力，不是机制。
  禁止提出 plane 均衡放置、运行时读再平衡、窗口写回、寿命分块回收或任何新机制；只问「封装挤占 plane + 放置/访问失衡 + 75 μs 编程藏不住 + 约 30× 块级写放大」是否同时承重失败。
  证伪条件：若公开工作点上保 HBM 已不削减 HBF 聚合读带宽、或放置均衡后细粒度读不再把完成时间钉在少数 plane、或交错计算窗已稳定藏住约 75 μs 编程且缓冲压力不迫使提前写回、或块级 GC 写放大远低于约 30× 并留在寿命裕度内，则本问题不成立。
  及格线：以最重 plane 的完成时间、额外读波、写–读互扰和块级 GC 写放大对照全 plane 信封。约 30× 是端点不是可被均值抹平的观测；单 plane reduced-bbox 不得冒充全信封。不以平均 plane 利用率或未计迁移的原始 KV 写次数代理代替。
