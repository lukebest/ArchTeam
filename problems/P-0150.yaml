generality_score: 8
同源:
  - arXiv:2609.06270 p.1-3

CONTEXT: |
  对象是高维近似近邻搜索（ANNS，D≥100）：精确扫描复杂度 O(N×D)，实际吞吐受内存带宽绑定。
  压缩索引抬吞吐常牺牲召回；图索引深遍历带来间接访存，与 PIM/SIMD 规则访存形态错位。
  分布外与数据新鲜度迫使周期性重建。

SYMPTOM: |
  - D≥100 时精确路径 O(N×D) 且带宽绑定；压缩索引在高吞吐点 recall-k@k 常 ≤0.6。
  - 图索引深遍历以间接、不规则带宽为主，与 PIM SIMD 偏好的规则向量访存不匹配。
  - OOD/新鲜度场景需重建索引，在线服务窗口内压缩质量与时效难以同时保住。
  待证伪：在公开高维 ANNS 基准上，压缩索引高吞吐点召回 ≤0.6 可复现，或图遍历带宽形态
  相对规则扫描使 PIM/SIMD 利用率可测下降。

CONSTRAINT: |
  难在：带宽上限把精确扫描封死，压缩与图索引分别用召回与间接访存换吞吐，且与近存 SIMD 形态冲突。
  禁止提出具体索引结构或 PIM 调度；只问「召回—吞吐—访存规则性」三角是否同时不可接受。
  证伪条件：若存在公开高维设定，压缩索引在目标吞吐下 recall-k@k 稳定 >0.6，
  且图/压缩访存可被 PIM SIMD 高效消化、无需频繁重建，则本问题不成立。
