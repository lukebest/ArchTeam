generality_score: 8
同源:
  - P-0101
  - drafts/D-0101-M3-vertical

CONTEXT: |
  冻结信封：2×Die2；120 core / 384 DMC / 18432 bank；8GiB 共享；512B；每核 outstanding 128
  （整机 15360）；stride 1B～2MiB。每 DMC 单发行口、48 bank。不能跨 DMC steal。
  父问题：S=2MiB 时 K=4096，bank 占用上界 22.2%。
  假设控制器占用已做到 ≈1.0（4096 点盖住 384 个 DMC）。不是在问怎么把 DMC 再铺匀。

SYMPTOM: |
  - 发行口：15360/384=40 outstanding/DMC。旧「约 9 个热 DMC」时约 15360/9≈1707/DMC。
    瓶颈从占用 9/384≈2.3% 换成每口 40 深的单发行队列。
    公开 HBM2 tRC≈48 ns 量级时，同类串行仍是 ~40×tRC，只是不再被 9 口放大。
  - DMC 内：每 DMC 约 K/384=10.67 点 / 48 bank。S=2MiB 时奇数因子位冻结，
    每 DMC 候选槽从 48 收到 16，10.67/16≈67% 的候选仍空。整机 bank 占用仍 ≤22.2%。
  - 热控制器从 9 变 384，×42.7。内存侧耗散随占用修复按控制器数涨，不必随 BW 线性。
  待证伪：DMC 占用≈1.0 之后，min/mean BW 仍越出 0.85，或 40/DMC 成为发行墙，
  或每 DMC 只用 16/48 槽，或 384 热口相对 9 热口功耗/热密度可测上涨。

CONSTRAINT: |
  硬件冻住，不能改 DMC/bank 数，不能跨 DMC steal。
  禁止把剩余抖动写成「DMC 还没铺满」。
  难在：控制器占用置零之后，剩下单发行队列、DMC 内空槽、384 口全热的功耗，
  三者都不随再映一次消失。
  证伪条件：若 DMC 占用≈1.0 之后所有 stride∈[1B,2MiB] 的 min/mean BW≥0.85，
  40/DMC 不构成发行上限，每 DMC 48 槽按 min(48,K/384) 使用，
  且 384 热口相对 9 热口无额外功耗密度问题，则本问题不成立。
