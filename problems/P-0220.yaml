# 中文题目: LLM decode 在脉动阵列上 M=1 复用崩塌、利用率塌到 1/S，连续批处理形状来回切换，两相共置/分设与统一量化都不贴合
generality_score: 8
同源:
  - arXiv:2610.07443 p.1-3
  - P-0167
  - P-0168
  - P-0144

CONTEXT: |
  自回归生成把推理分成两相：prefill 以大规模 GEMM 为主、加速器利用率高；decode 逐 token 生成，每步以并行度与算术强度都很低的 GEMV 为主，造成严重硬件低利用，并成为端到端 LLM 服务的主导瓶颈。
  decode 是访存受限负载，权重访问常占内存流量 >90%，激活足迹很小。
  二维脉动阵列在 decode（token 维 M=1）时复用崩塌：激活无法跨行复用、权重也无法在阵列内高效共享；在 S×S 阵列上空间利用率项塌缩到 1/S，大部分 PE 闲置；输出驻留与权重驻留两种数据流均如此。
  阵列满利用需同时满足 M≥m、N≥n、K≫k 三个条件；归约深度 k 不由阵列尺寸单独决定，而取决于操作数如何送入与传播。
  连续批处理按活跃 token 数聚合请求，使 GEMM 形状随请求到达与完成持续波动，计算在扁平的访存受限 GEMV 与更大更并行的 GEMM 之间来回切换，硬件利用率不稳定；它并未消除 decode 负载与阵列执行模型之间的结构性失配。
  prefill 与 decode 同设备共置会因资源争用造成显著时延波动；分到不同设备虽缓解干扰，但相比例随负载持续变化，静态分设导致资源失衡。
  已有可重构阵列多只重塑空间维 (m, n) 且对称切分（如 128×128 切成 32×32 或 4×4 方阵），目标是多 DNN 共置/扩展；固定阵列类 LLM 量化/稀疏加速器（16×32 到 192×256 不等）的执行块都固定、面向 prefill GEMM。

SYMPTOM: |
  - decode 每步以 GEMV 为主，权重访问常占内存流量 >90%，是端到端服务主导瓶颈；prefill GEMM 利用率高，两相负载形态截然不同。
  - S×S 脉动阵列在 M=1 时空间利用率项塌到 1/S：激活跨行不复用、权重阵列内不共享，输出驻留与权重驻留数据流同样塌缩。
  - 满利用需 M≥m、N≥n、K≫k 同时成立；decode 首条即失败，而归约深度 k 还取决于操作数送入/传播方式而非阵列尺寸。
  - 连续批处理让 GEMM 形状随请求到达/完成持续波动，计算在 GEMV 与较大 GEMM 间来回切换，利用率不稳；结构性失配仍在。
  - 两相同设备共置：资源争用带来显著时延波动；分设备：相比例随负载变化，静态分设资源失衡。
  - 统一量化配置不贴两相：W8A8 利 prefill 计算但对带宽受限 decode 收益有限；W4A16 减 decode 访存却几乎不加速 prefill 且降精度。
  - 既有可重构阵列只对称切分空间维 (m, n)，固定阵列 LLM 加速器（16×32 到 192×256）执行块固定且面向 prefill GEMM，未针对 decode 形状。
  - 端点包括 decode 每 token 时延（TBT）与 prefill TTFT、阵列 PE 利用率（两相分别计）、端到端服务吞吐与尾时延、两相精度，以及在连续批处理形状波动与相比例变化下的稳定性。
  待证伪：在公开 LLM 服务工作点与连续批处理负载上，若脉动阵列在 decode 下利用率不再塌到约 1/S、同一量化配置即可同时满足两相效率与精度、且共置/分设都不再引入显著时延波动或资源失衡，则本问题不足以成立。

CONSTRAINT: |
  难在同一阵列与同一服务系统上同时承受：(1) decode M=1 带来的复用崩塌与 >90% 权重流量；(2) 连续批处理下形状持续波动；(3) 两相相比例随负载变化，使共置争用与分设失衡二选一；(4) 两相对量化精度/位宽的诉求相反——只优化 prefill GEMM 或只压 decode 访存都不等于端到端过线。
  TBT、TTFT、两相分别的 PE 利用率、端到端吞吐与尾时延、两相精度是 endpoints；只报 prefill 峰值 TOPS、只报 decode 带宽节省、单一固定 batch 形状的利用率或不计精度损失的加速比都是 proxies，endpoints ≠ proxies。
  只测固定大 batch、只测 prefill、关掉连续批处理、或单一量化配置下只报一相的实验属于 reduced-bbox，不等于覆盖两相共存、形状波动与相比例变化的 full envelope；reduced-bbox ≠ full envelope。
  及格判定若采用 0.85，0.85 是 pass bar，不是 measured mean；不得用平均利用率过线冒充 decode 相与尾时延端点都过线。
  同源但不并入 P-0167 / P-0168 / P-0144：那三张分别问 VQ/码本压缩在脉动阵列上换不成加速、激活稀疏的不规则性、按组量化 rescale 与列对齐；本卡只问 decode M=1 下阵列复用崩塌、连续批处理形状波动与两相共置/分设/统一量化的失配。
  无解法提案，不提出具体阵列重构方式、数据流、两相量化配置、调度或任何加速器微架构。
