generality_score: 8
同源:
  - arXiv:2609.08446 p.1-3

CONTEXT: |
  对象是移动端脉冲神经网络（SNN）与动态视觉传感（DVS）：事件稀疏、延迟预算紧，但权重搬运与膜电位存储仍重。
  固定 SNN-CIM 形状与层宽不对齐；高稀疏度反使 ADC 型 CIM 利用率低下。
  时间步优先调度与 DVS 亚百微秒延迟目标冲突。

SYMPTOM: |
  - 参数搬运可占约 60% 功耗；DVS 活跃度常 <1–10%，事件延迟预算 <100 µs。
  - 权 8b、膜 16b 时，膜电位存储可达非脉冲 CNN 存储的约 25–67%；固定 SNN-CIM 难贴合层形状。
  - 稀疏度 >90% 时 ADC CIM 欠利用；timestep-first 调度破坏 DVS 延迟。IBM DVS gesture 约 95.8% 精度点上，
    相对固定站立基线公开可报约 45% 能量 / 52% 延迟量级差距——暴露调度与存储形态不匹配。
  待证伪：在公开 DVS/SNN 移动工作点上，参数搬运或膜存储占比可测主导，或 timestep-first
  使事件延迟相对 <100 µs 预算不可接受。

CONSTRAINT: |
  难在：事件稀疏要低延迟与低搬移，膜电位与固定 CIM 却按稠密/层形状计价；高稀疏反而浪费 ADC。
  禁止提出具体事件驱动数据流或可重构 CIM；只问「稀疏事件 + 稠密存储/固定阵列 + 时间步优先」
  是否同时不可接受。
  证伪条件：若公开 DVS 负载下参数搬运与膜存储不再主导，且固定 CIM + timestep-first
  仍满足 <100 µs 与能效目标，则本问题不成立。
