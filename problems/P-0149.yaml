generality_score: 8
同源:
  - arXiv:2609.06125 p.1-3

CONTEXT: |
  对象是多 GPU 统一内存（UM）：应用希望跨卡透明寻址，但互连/内存带宽比与地址翻译路径决定可否真正「统一」。
  晶圆级互连可把带宽比推高，翻译与页表一致性却常经 CPU-IOMMU 与集中式故障处理。
  全局 PTE 广播随 GPU 数平方扩张。

SYMPTOM: |
  - B200 类系统互连/内存带宽比约 0.225；晶圆级可达约 7.5 TB/s，带宽比可 >1，
    但地址翻译仍经 CPU-IOMMU，带宽优势落不到缺页/迁移路径。
  - 集中式故障处理（FT）成为串行瓶颈；N×N 全局 PTE 广播复杂度 O(N²)。
  - 仿真量级：HBM 约 1.23 TB/s、100-cycle；晶圆约 1.85 TB/s、38-cycle；Wafer2CPU 约 180-cycle，
    翻译往返远长于本地访存。
  待证伪：在公开多 GPU UM 工作点上，翻译/FT 路径使有效带宽相对裸互连可测塌陷，
  或 N 增大时 PTE 广播/集中 FT 成为主项。

CONSTRAINT: |
  难在：互连带宽可按晶圆抬高，一致性与翻译仍按 CPU 中心与 O(N²) 广播计价。
  禁止提出具体分布式页表或旁路 IOMMU 方案；只问「高带宽互连 + 中心翻译」前提是否承重。
  证伪条件：若公开配置下翻译延迟相对 HBM/晶圆访存可忽略，且 PTE 更新不随 N² 爆炸，
  则本问题不成立。
