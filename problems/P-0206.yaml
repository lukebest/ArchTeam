# 中文题目: 双向单槽介质在双忙时没有额外注入机会，负载镜面抬升使高负载窗口进一步收紧
generality_score: 8
同源:
  - P-0198
  - github:lukebest/bufferless-ring-noc tests/soc_sim
  - 扩展自 P-0198/M-4 横向
  - 同源但不并入 P-0198 及其他 sibling expansion cards

CONTEXT: |
  对象是双向、每方向每拍仅一个发送权、无深度队列的共享介质上的多源注入，不限定某一 SoC 的路由电路。N 个端点在扇入或置换中争用两侧发送权：单侧空闲时存在可测的额外注入机会，双侧都忙时零和约束使额外机会为 0。
  公开对照域包括双向环、双轨或双总线、光双向环及其他同样的双向单槽介质；N∈{8,12,16}，以扇入与扇出/广播作方向性对照。深度队列充分吸收突发的信封不在范围。
  bufferless-ring-noc tests/soc_sim 的 12+2 DV200、512 B 基线和读写饱和不对称作为具体量纲对照，不把某一硬件专名当作同构条件。

SYMPTOM: |
  - N=12 的高负载扇入或 alltoall 中，双忙时间比例 f_dual≥40% 时，单侧空闲所能提供的窗口不足以覆盖完成时间；双忙桶的额外注入机会为 0。
  - 公开基线中均匀读 makespan 约 4403.2 ns，峰值后 goodput 约从 5761 B/ns 降至 2.8–3.4 TB/s；写侧约 5.5 TB/s 而未见同样崩塌，集合扇入与扇出表现不同。
  - 负载迁移后对向利用率相对关闭对照上升≥15%，同时不对称窗口时长缩短≥20%，说明高负载下可用窗口会被自身的对向占用收紧。
  - 端点是 N∈{8,12,16} 下扇入/扇出完成时间、f_dual、双忙桶可注入机会、对向利用率与窗口时长；不能用介质峰值带宽单独解释。

  待证伪：在 N∈{8,12,16} 双向单槽介质上，若高负载扇入/alltoall 的完成时间不被 f_dual≥40% 的双忙零洞与对向镜面抬升主导，则本问题不成立。

CONSTRAINT: |
  不把问题写成某一 crossbar 或某一环的移植；难点是双向每向单槽与双忙零和的结构，不是名称。不得把额外资源或跨通道统计混入该介质的端点。
  扇入/扇出完成时间、f_dual、双忙桶可注入机会、对向利用率与窗口时长是 endpoints；峰值带宽、平均利用率或只报扇出成绩是 proxies，endpoints ≠ proxies。
  只测 N=2、低负载、单向流量，或使用深度队列吸收突发的实验属于 reduced-bbox，不等于 N∈{8,12,16}、高负载扇入/扇出对照的 full envelope；reduced-bbox ≠ full envelope。
  若采用 0.85，0.85 is pass bar, not measured mean；不得以不对称窗口单项结果替代双忙高负载端到端结果。
  同源但不并入 P-0198 及其他 sibling expansion cards；  证伪条件同 SYMPTOM 末行。
  无解法提案。
