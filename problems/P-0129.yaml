generality_score: 8
同源:
  - P-0103
  - P-0117
  - drafts/D-0103-M4-horizontal

CONTEXT: |
  对象是 LLM decode 的 KV 铺通道，或 mesh 上 rank 步进的集体通信，
  不是 DRAM 内部 bank 映射。通道/维索引如果只吃下标低 b 位，大步长会把这些位冻住。
  忽略通道内部 bank。公开工作点：13B 级、已发表 (B,S)，C=8 或 16。

SYMPTOM: |
  13B 级、S≈2048 时单序列 KV 约 1.7GB。
  - 通道索引只用 token[b-1:0]：当 token 步长 δ≥2^b，低 b 位冻，n_hot→1。
    C=16、b=4 时 δ≥16 就把占用打到 1/16；逐步时间相对满通道 ≥16×。
  - 对照源信封：索引窗口若整个落在冻结线以下，S=1.5MiB 给出 n_DMC=6（2 档×3），
    S=2MiB 给出 n_DMC=3（1 档×3），不是 384。
    同构数字：n_hot = 2^r ×（奇数因子），r 是冻结线以上仍进入索引的位数。
    r=0 ⇒ n_hot 等于奇数因子（3 或 1）。
  - 待证伪：存在公开 (B,S) 或集体步长，使通道/维占用 = 冻结低位所允许的上界
    （远小于 C），且逐步时间不能用满通道 bytes/β 解释。

CONSTRAINT: |
  不改通道内部 bank 映射，不把本问题写成 DRAM 交织的移植，不写新索引电路。
  难在占用上界由「索引窗口相对冻结线的位置」锁死，与窗内如何打散无关。
  证伪条件：若所有公开 decode/集体工作点上，即便步长冻住低 b 位，
  通道占用仍 =C，则该同构不成立。
