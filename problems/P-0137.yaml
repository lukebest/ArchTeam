generality_score: 8
同源:
  - arXiv:2609.04040 p.1-3

CONTEXT: |
  对象是 memory-bound 负载上的硬件预取：L1 miss 代价达数十周期，常主导执行时间。
  评测习惯把「地址预测准不准」与「要不要发预取」捆成一个自变量，并与始终发请求的经典预取器对比。
  端点是 DRAM reads / IPC，不是准确率或覆盖率。

SYMPTOM: |
  - 在二十个 SPEC CPU2017 上，砍掉 35% 预取、准确率从 11% 提到 15% 时，DRAM reads 仅变化 −0.07%。
  - 代理指标（准确率、覆盖率、插入比例）改善不意味着 DRAM 或 IPC 端点改善。
  - 未学习流上预测误差中位数居高仍强行插入预取行会改变缓存状态；可学习流上误差下降后才放行，
    代理指标仍可能换不来 DRAM/IPC 端点收益。
  待证伪：存在公开 SPEC CPU2017 子集，准确率/砍预取比例可测改善，而 DRAM reads 与 IPC
  相对「始终发」或「无预取」基线变化 <0.1% 量级。

CONSTRAINT: |
  难在：预测模型与放行策略被混成一个自变量，架构决策被代理指标误导。
  0.85 式合格线在这里对应的是端点（DRAM reads / IPC），不是准确率均值；准确率上移不得冒充端点过线。
  禁止把「相对始终发请求的准确率差」写成因果收益，若消融关断放行后端点仍几乎不变。
  证伪条件：若在同一二十个 SPEC CPU2017 上，准确率从 11%→15% 且砍 35% 预取时，
  DRAM reads 或 IPC 出现与准确率同量级的可测端点改善，则本问题不成立。
