generality_score: 8
同源:
  - arXiv:2609.17555 p.1-2
  - P-0143

CONTEXT: |
  接 P-0143 的边缘压缩精度空隙，但不并入：P-0143 问算法混合精度最优点掉进加速器离散档；本卡问压缩与故障保护绑在同一固定宽寄存器空隙上。
  对象是易错硬件上的边缘 DNN 加速：必须激进压缩，又必须在电压缩放、辐射或工艺偏差引起的故障下仍可靠。
  层对量化误差的灵敏度不同，齐比特宽盖不住「又小又稳」；现有混合精度路径常要重训或昂贵 NAS，故障保护又常与量化分开决定。
  固定宽寄存器上的 SWAR 把多个低比特操作数塞进一个字，但既有做法假定操作数等宽，或依赖运行时硬件重配，并不把灵敏度量化与故障保护嵌进打包过程。
  混合精度的权值–激活对在固定字宽（仿真例 16 bit 或 32 bit）里对齐后留下未用空隙；两套旋钮分开时，这段空隙既不成有用并行，也不低成本携带冗余。

SYMPTOM: |
  - 层间量化误差灵敏度不同；齐比特宽不能同时压存储与保精度。混合精度常要重训或昂贵 NAS；故障保护与量化分决策。
  - 既有 ECC、冗余或比特保护抬高内存、面积与能耗，压缩之外再付一套保护税。
  - 固定宽寄存器仿真例为 16 bit 或 32 bit。SWAR 既有路径假定操作数同宽，或要运行时硬件重配，打包过程不带灵敏度量化与故障保护。
  - 混合精度权值–激活对占不满字宽，留下未用空隙；空隙不成为有效并行，也不廉价承载冗余，则压缩与可靠同时落空。
  待证伪：在公开边缘 DNN 加速工作点上，齐比特宽相对层间灵敏度差可测无法同时达到压缩与精度，或 16/32 bit 固定寄存器上混合精度配对后的未用位可测既不成有效并行、又不在无额外大额 ECC 税下维持故障下可用，或独立 ECC/冗余/比特保护相对存储、面积、能耗可测大幅上升且仍盖不住层间敏感差。

CONSTRAINT: |
  难在：压缩与保护不是独立旋钮；未用空隙是绑定资源。要并行就占满空隙，要廉价冗余也要占同一段空隙，分开优化则两边都不算数。
  齐比特宽盖不住层间灵敏度；重训或 NAS 式混合精度又不把保护嵌进字内布局。既有 ECC/冗余税不能当成压缩之外的免费第二旋钮。
  禁止提出灵敏度搜索、编译期打包、把空隙填成冗余、选择位复制或任何量化–保护共设计机制；只问「齐宽盖不住 + 独立保护税 + 固定字宽空隙两边落空」是否同时承重失败。
  证伪条件：若公开工作点上齐比特宽已同时满足压缩与精度、或 16/32 bit 字内未用空隙已可测同时提供有效并行与无额外大额 ECC 税的可靠性、或独立 ECC/冗余的内存面积能耗开销可忽略且故障下仍可用，则本问题不成立。
  及格线：可靠性（故障下功能不崩）且不再另付大额 ECC/冗余的内存、面积、能耗税。不以无故障压缩率或打包密度代理代替故障下可用，也不以单独加 ECC 的面积税代理「空隙已绑定两边」。
