# 中文题目: 乘数受限、外存接口窄的边缘 FPGA 上，学习型图像压缩的实际延迟无法由 MAC 数或缩小大加速器预测（720p、0.1–0.5 bpp）
generality_score: 8
同源:
  - arXiv:2609.29727 p.1-3
  - P-0173

CONTEXT: |
  学习型图像压缩（LIC）在 GPU 上的主流形态依赖较大的分析/合成变换、hyperprior、自回归上下文与注意力；其算术量、权重与激活存储、激活流量以及熵模型成本使其难以部署到低成本嵌入式平台，即便数值已量化。
  目标平台是资源严重受限的边缘 FPGA：乘数（DSP）数量有限，片外存储接口窄。先前 FPGA LIC 工作大多面向明显更大的资源信封，把大型加速器按比例缩小并不能可靠预测小信封上的延迟。
  网络中常见深度可分离卷积：逐通道（depthwise）滤波与跨通道混合（pointwise）对乘数、片上缓冲与外存带宽的需求形态不同；潜在表示的量化/码本搜索若与变换各占一份硬件，会再次争用稀缺乘数。
  工作点：720p（1280×720）输入，目标码率约 0.1–0.5 bpp；总下采样 8×、潜在通道 64；中间激活 INT8，最终潜在以无符号 INT8 存放。下采样 16× 约对应 0.125 bpp，4× 约对应 2 bpp 且潜在位置多 4 倍，下采样比同时决定码率区间、潜在位置数与存储流量。

SYMPTOM: |
  - 在有限乘数与窄外存接口上，LIC 的实测速度不只由算术量决定，还受存储流量、算子间负载不平衡与硬件批处理方式共同决定；按 MAC 占比或缩小大型加速器推断延迟不足以预测结果。
  - 深度可分离卷积中，固定乘数预算在 depthwise 与 pointwise 之间如何分割，无法单靠两者的 MAC 占比推断；外存带宽受限时两类算子的瓶颈位置不同。
  - 720p、通道日程 (16,48,64) 的分析变换仅约 4,491 个卷积权重，权重本身很小，但全分辨率激活流量与潜在写回仍经过窄外存接口。
  - 潜在量化的代价随码本组织剧烈变化：用 2 个子码本达到同等码率需 K=65,536 个码字，每位置搜索乘法约多 256×；子码本过多则退化为近似标量量化。未编码速率上界 0.5 bpp（M=4、每子码本维度 16、K=256）已贴住目标区间上沿。
  - 在该信封上，张量几何（通道数、下采样比、码本规模）的选取会让预测延迟相差约 24%，说明几何选择本身是一阶延迟变量，而非训练后的细调。
  - 端点包括 720p 单帧编码延迟、吞吐、乘数/BRAM/外存带宽占用、码率（bpp）与重建质量（率失真）；完整率失真与硅上实测在线索中未给出。
  待证伪：在乘数受限、外存接口窄的公开边缘 FPGA 工作点上，若 720p、0.1–0.5 bpp 的 LIC 编码延迟可由 MAC 数或等比缩小的大型加速器直接预测（误差很小），且 depthwise/pointwise 乘数分割与潜在量化代价不再主导延迟，则本问题不足以成立。

CONSTRAINT: |
  难在三个稀缺资源同时受限且相互耦合：乘数少，使变换与潜在量化/码本搜索争用同一池；外存接口窄，使全分辨率激活与潜在写回成为瓶颈；码率目标 0.1–0.5 bpp 又把下采样比、潜在维度和码本规模锁在窄区间内，改其一会同时改变码率、质量、存储流量与乘数需求。depthwise 与 pointwise 的需求形态不同，任何固定分割都会在某一层失衡。
  720p 单帧编码延迟、吞吐、资源占用、bpp 与率失真是 endpoints；MAC 总数、权重参数量、单算子峰值利用率或大平台延迟按比例缩小都只是 proxies，endpoints ≠ proxies。只报告变换延迟而忽略潜在量化与外存写回，也不算完整端点。
  只在更大 FPGA、更宽外存或更低分辨率上测得的结果属于 reduced-bbox，不等于乘数受限、窄接口、720p、0.1–0.5 bpp 的 full envelope；reduced-bbox ≠ full envelope。只测单一码率点也不覆盖目标区间。
  及格判定若采用 0.85，0.85 是 pass bar，不是 measured mean；不得用平均层利用率达到 0.85 冒充每层与整帧端点都过线。证伪条件同 SYMPTOM 末行。
  同源但不并入 P-0173：P-0173 问 LUT 超分辨率的寄存器堆/存储开销；本卡只问边缘 FPGA 上学习型图像压缩编码端在乘数、外存带宽与码率目标联合约束下的延迟可预测性与资源分割。
  无解法提案，不提出具体量化/码本方案、周期模型、网络几何搜索、熵模型取舍、编解码端职责划分或任何加速器微架构。
