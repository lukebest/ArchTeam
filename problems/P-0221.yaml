# 中文题目: 无缓冲环上上游节点注入把下游环段空槽填满，下游节点注入被饿死，拉长 LLM 推理通信端到端完成时间；逐节点上限管不住
generality_score: 8
同源:
  - github:lukebest/bufferless-ring-noc tests/soc_sim
  - P-0198
  - 人给题 2026-10-09（来源：设计验证对第二轮机制的 T0 结论，机制名不写入正文）

CONTEXT: |
  评估平台钉死为 https://github.com/lukebest/bufferless-ring-noc，模型入口 tests/soc_sim（DV200：最多 12 颗 top die 叠在 2 颗 bottom die 上；CHI 四通道 Req/Rsp/Snp/Dat 各自成环；环间经 RBRG 互联）。
  无缓冲双向环：每个方向每拍只有一个 highway 槽位，过路 flit 恒优先于本地注入；无片上 flit 队列吸收突发。
  环结构须按现有实现核对，不得臆造：Dat 为 2 个子环；Snp 为 1 个环且无数据字段；各通道字段宽按 CHI 规范。
  问题对象是同一环上的空间不公平：沿环方向靠上游的节点先看到空槽、先注入，可把流向下游环段的空槽全部填满；下游节点即使自身负载合法，也长期等不到空槽，注入被饿死。
  受影响的是 LLM 推理通信：decode 阶段 KV 读取与点对点搬运，以及推理期集合通信（gather / reduce / allreduce / allgather / alltoall / broadcast）。主指标是推理通信的端到端 makespan（完成时间），不是注入率。
  已有观察：只按每个节点各自设注入上限的约束，管不住「上游合计把下游环段填满」——单节点都合规，环段仍被占满。

SYMPTOM: |
  - 基线信封（12 top + 2 bottom、512 B 请求、AIC 读 outstanding 512 / 写 256、关闭额外流控）：均匀读 makespan 约 4403.2 ns、均匀写约 4834.6 ns；均匀读峰值 goodput 约 5761 B/ns 后崩塌到约 2.8–3.4 TB/s；gather / reduce / allreduce / allgather / alltoall 在公开扫描设定下 collapsed=true，broadcast 约 117.76 B/ns 未崩塌。
  - 上游节点注入把下游环段空槽填满时，下游节点注入等待/失败次数与单笔完成时间显著高于上游节点；makespan 由被饿死的下游节点尾部决定，而非由环总吞吐决定。
  - 逐节点注入上限下，每个节点均未超限，下游环段仍被上游合计流量占满：节点级约束与环段级占用之间存在缺口。
  - 推理集合通信的完成时间由最慢参与者决定：只要一个下游节点被饿死，gather / reduce 类集合的 makespan 被整体拉长。
  - 必测量（未签数字不得当卡声称，以下为待测而非已知）：逐节点注入等待分布（P50/P99/max）沿环位置的梯度；逐环段空槽率；decode KV/P2P 与各集合类的端到端 makespan；Snp 15:1 小包路径延迟。
  - 端点：tests/soc_sim 上分流量类（decode KV/P2P、各推理集合）的端到端 makespan、完成事务数、是否进入崩塌区、最差节点完成时间，以及 Snp 小包延迟是否在阈值内。
  待证伪：在同一 DV200 / tests/soc_sim 信封、公开推理流量设定下，若沿环位置的注入等待无显著上下游梯度、下游节点不再被饿死、且推理通信 makespan 不由最慢下游节点决定，则本问题不足以成立。

CONSTRAINT: |
  硬约束：不加线、不改 RTL；仿真器结构只能在新分支上改；以推理通信端到端 makespan 为主指标。
  难在同一无缓冲环上，每方向每拍单槽让注入与过路零和，上游先看到空槽是结构性优势；节点各自守上限不等于环段不被填满，集合通信又把最慢下游节点的尾部放大成整体完成时间。
  闭合判定：只给逐节点上限、不能对逐环段（而非逐节点）占用密度给出上界的方案不算闭合；靠丢数据打破依赖不算合法。
  淘汰约束（第一、二轮，必带）：
  - T2 解析增益不得直接贴到 T3；T3 必须在诚实周期仿真下优于基线。
  - 只提高注入率而不缩短 makespan / 尾（r≈1 或 T_mix≈1）按淘汰论。
  - 与教科书 / slotted-ring / TDM / 最短 CW-CCW 功能等价的，不算新问题收益。
  - 环库已有功能（Dat 多播、i-tag、发射顺序、UturnConnect）算先例，不能当新收益。
  - Snp 15:1 小包路径延迟超阈值即 KILL；不得用未过线的 Snp 数字当卖点。
  - 借 Snp 槽运 Dat 的路线已关闭。
  - 位宽与环数必验：Dat 2 子环、Snp 1 环且无数据字段，字段宽按 CHI 规范。
  - 仿真中所有容量 / 位宽类物理假设须单独列表，供审计逐项核对。
  - 未签数字不得写成卡声称。
  端到端 makespan（分流量类）、最差节点完成时间、是否崩塌、Snp 小包延迟是 endpoints；注入成功率、平均 hop、瞬时链路利用率、单节点注入速率都是 proxies，endpoints ≠ proxies。
  只测单环、只开 top die 子集、只测均匀读、或假设完美预测 / 无限带宽的实验属于 reduced-bbox，不等于 12+2 DV200、CHI 多环、decode KV/P2P + 推理集合的 full envelope；reduced-bbox ≠ full envelope。
  及格判定若采用 0.85，0.85 是 pass bar，不是 measured mean；min/mean 须作为约束过线，不得用平均流量类过线冒充最差节点与各集合都过线。
  同源但不并入 P-0198：P-0198 问无缓冲环上 LLM 搬运与集合通信被环槽争用拖垮的总体问题；本卡钉在「上游填满下游环段 → 下游注入饿死」这一空间不公平根因，以及逐节点上限管不住环段占用。
  无解法提案：不预设、不点名、不偏向任何具体拥塞控制、令牌、预约、tag、窗口或其他机制。
