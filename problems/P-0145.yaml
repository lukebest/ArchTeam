generality_score: 8
同源:
  - arXiv:2609.05226 p.1-3

CONTEXT: |
  对象是超导量子器件上的量子纠错（QEC）：码设计常面向稀疏、非相关错误。
  外部辐射会在同一衬底上触发多比特同时、空间相关的缺陷。

SYMPTOM: |
  - 量子比特对辐射的敏感度比 CMOS 晶体管高约数千倍，可能成为规模化量子计算机的绑定约束。
  - 辐射诱发事件频率约从每小时一次到每分钟多次；瞬态可持续微秒至数十秒，
    而一轮 QEC 纠错约数微秒或更短，故单次事件常跨越多轮纠错。
  - 面向稀疏非相关错误的 QEC 在空间相关、多轮持续的缺陷团上失效。
  待证伪：在公开事件率与纠错周期下，单次辐射瞬态跨越 ≥2 轮 QEC，
  且同一事件打中同一码块内多个相关物理比特的概率不可忽略。

CONSTRAINT: |
  难在：错误模型假设（稀疏、非相关、单轮）与辐射物理（相关、持续多轮）同构失败。
  禁止把问题改写成「只加深码距离」而不面对相关突发；地下屏蔽降低通量但难以规模化（见同源卡）。
  证伪条件：若公开工作点上辐射事件不跨多轮，或不产生码内空间相关多比特击中，
  则本问题不成立。
