CONTEXT: |
  父问题能成立，是因为冻结信封把控制器个数写成 N_DMC=384=2^7×3。
  整数模占用 |im|≤N/gcd(δ,N)：δ≡0 (mod 3) 时 n_DMC 掉到 min(384,K)/3，X_rel=3。
  现在不问映射怎么做，问「控制器个数必须带因子 3」这一前提是否承重。
  硬件仍冻：120 core / 384 DMC / 18432 bank。禁止改带 3 的资源个数，禁止提出新芯片。

SYMPTOM: |
  同一组 δ=3·2^k，对比 3∈N 与 3∉N 的公式：
  - N=384=2^7×3：k=0（δ=3）时 |im|=128，占用 128/384=1/3。
  - N=256=2^8（3∉N）：k=0 时占用 1。
  - N=512=2^9：k=0 时占用 1。
  待测：冻结 384 信封、S∈{1536B, 4608B, 1.5MiB} 上，实测 n_DMC 是否等于 min(384,K)/3。
  判定：若 /3 切出现，则因子 3 承重；若实测已是 min(384,K)，则前提为空。

CONSTRAINT: |
  禁止提出新芯片，禁止把控制器个数改成 256 或 512。禁止改映射。
  只问因子 3 是否承重：在冻结信封上测占用，并用 N/gcd(δ,N) 对比 3∈N 与 3∉N。
  证伪条件：若对所有 S=3·2^k 测得 n_DMC=min(384,K)（公式中的 /3 不出现），
  则因子 3 非承重，本问题不成立。
