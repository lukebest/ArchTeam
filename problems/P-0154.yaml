generality_score: 8
同源:
  - arXiv:2609.08424 p.1-3

CONTEXT: |
  对象是神经网络加速 PE：乘加中的乘法器长期主导面积、能量与关键路径。
  稀疏/近似乘仅覆盖部分图；Winograd、FIP 等变换仍把大量工作落在乘法上。
  n-bit 乘法产生约 n² 级部分积，对称平方类运算部分积量级可低约一半——对照揭示乘法密度本身过重，
  而非指向某一替代单元。

SYMPTOM: |
  - PE 内乘法器主导面积/能量/关键路径；稀疏与近似乘无法覆盖一般稠密层。
  - Winograd/FIP 等仍乘法受限；n-bit 乘约 n² 部分积，相对对称平方类约一半量级的部分积密度，
    暴露通用乘的组合爆炸。
  - 公开相对基线 PE 的精确计算对照：面积约 11–36%、能量约 5–48%、周期约 11–19% 的可测差距，
    表明「乘主导」在精确算子集合下仍成立。
  待证伪：在公开 PE/算子集合上，乘法器面积或能量占比相对其余逻辑可测主导，
  或变换类算子结束后仍乘法受限。

CONSTRAINT: |
  难在：一般层要通用精确乘，而乘的部分积按位宽平方涨；稀疏/近似/变换都不能普遍拆掉乘主导。
  禁止提出平方单元、专用乘替代或具体近似电路；只问乘法器是否在精确通用 PE 上持续主导开销。
  证伪条件：若公开精确工作点上乘法器不再主导面积/能量/关键路径，
  或 Winograd/FIP 等已使乘不再成主项，则本问题不成立。
