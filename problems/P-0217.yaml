# 中文题目: 新 DRAM 技术几乎都要改接口加命令、改控制器，N 种技术改 N 次，等标准又锁死已部署系统，叠加组合更难
generality_score: 8
同源:
  - arXiv:2610.06475 p.1-3
  - P-0212
  - P-0215
  - P-0195

CONTEXT: |
  对 32 种已发表 DRAM 技术（覆盖 7 个类别：存内计算、低成本维护如读干扰缓解/刷新/擦洗/在线错误画像、暴露 subarray 级并行、降低访问延迟等）的梳理显示，它们几乎都需要改动系统的 2 处：DRAM 接口（新增非标准命令）与内存控制器硬件（决定何时触发、如何执行）。
  当前 DRAM 接口与内存控制器支持的命令与控制逻辑在设计时固定；每采用一种新技术就要再改一次接口和控制器，逐个采用 N 种技术意味着 N 次重复修改。
  需要新命令的技术往往要等一版新的 DRAM 标准，而标准化要求 DRAM 厂商与系统设计方全体利益相关方达成一致；各方目标与利益冲突，只惠及部分方的技术会被拖慢或搁置。
  即使标准方同意在未来系统中支持，已部署系统也无法采用：服务器类系统在现场服役数年，卫星与航天系统可达数十年，期间新出现的、应对 AI/ML 等快速演进负载内存需求的技术无法落地。
  不同技术的控制器侧工作流高度重复却各自独立实现：例如 2 种利用近期预充电行/刚被拷贝行中较高单元电荷来缩短行激活延迟的技术，都要求控制器跟踪合格行、把每个到达请求与之比对、命中时发出降时延操作——同一结构被实现两遍。
  新 DRAM 命令之间同样结构相似：不做感放的部分行激活与源行到目标行的行拷贝，都是在特定 DRAM 局部（如某个 bank）上对 1 个或多个行地址操作数执行操作，却各自需要一次接口变更。
  控制器必须在 JEDEC 时序约束下调度命令，至少涉及 4 个关键约束：ACT→RD/WR 的 tRCD、连续 RD（或 WR）间 tCCD、PRE→ACT 的 tRP、同 bank 连续 ACT 间 tRC；任何新命令都必须嵌入这套固定时序框架。

SYMPTOM: |
  - 32 种已发表 DRAM 技术（7 类）几乎都要同时改 2 处：接口（新增非标准命令）与控制器硬件（何时触发、如何执行）。
  - 接口命令集与控制逻辑设计时固定：采用 N 种技术 = N 次接口+控制器重复修改，没有一次改动可复用到下一种。
  - 需新命令的技术要等新一版 DRAM 标准；标准化需全体利益方一致，只惠及部分方的技术被拖慢或搁置。
  - 即使未来标准支持，已部署系统也采纳不了：服务器服役数年、卫星/航天可达数十年，期间新出现的 AI/ML 内存需求技术无法落地。
  - 控制器侧工作流高度重复却各自实现：2 种降激活延迟技术都要「跟踪合格行→比对每个请求→命中发降时延操作」，同一结构实现两遍。
  - 新命令之间结构相似（部分行激活 vs 行拷贝：都在某 bank 上对 1 个或多个行地址操作），却各要一次接口变更。
  - 跨领域叠加（如 subarray 级并行 + 延迟降低）需同时完成两套接口与控制器改动，组合收益无法低成本获得。
  - 任何新命令都须嵌入 JEDEC 固定时序框架（至少 tRCD、tCCD、tRP、tRC 4 个约束）。
  - 端点包括采纳一种新技术所需的接口/控制器改动量、N 种技术累计改动量、从发表到可部署的时间（含标准周期）、已部署系统能否采纳，以及多技术叠加时的端到端性能/能效/可靠性收益是否兑现。
  待证伪：在 32 种公开技术与 JEDEC 时序约束下，若多数技术无需新增非标准命令或控制器硬件改动即可部署、累计改动不随 N 线性增长、已部署系统可在服役期内采纳、且两类技术叠加不需两套独立改动，则本问题不足以成立。

CONSTRAINT: |
  难在同一 DRAM 接口与控制器合同上同时承受：(1) 设计时固定的命令集与控制逻辑；(2) 多方一致的标准化周期与数年到数十年的现场服役；(3) JEDEC 固定时序框架（tRCD/tCCD/tRP/tRC）——任何新技术都要穿过这三层，而结构重复的控制器工作流与相似命令仍被逐个重做。
  每技术改动量、N 技术累计改动量、发表到部署时间、已部署系统可采纳性与叠加后端到端收益是 endpoints；单技术在定制控制器上的峰值加速、只计 DRAM 侧不计接口/控制器成本的收益、或只在仿真中加命令不经时序框架的结果都是 proxies，endpoints ≠ proxies。
  只评估单一技术、在可任意改接口的仿真器里加命令、忽略标准化与服役周期、或绕过 JEDEC 时序约束的实验属于 reduced-bbox，不等于覆盖 32 种技术/7 类、已部署系统与固定时序框架的 full envelope；reduced-bbox ≠ full envelope。
  及格判定若采用 0.85，0.85 是 pass bar，不是 measured mean；不得用「多数技术」平均可部署率过线冒充每类技术与叠加组合都过线。
  若涉及地址映射改写：经典高低位 XOR-fold、BIOS bit-mux、Intel DRAM map 是已知对照，不得作为新机制。
  同源但不并入 P-0212：P-0212 问近端核透明 offload 对已部署二进制的软件采纳鸿沟；本卡问 DRAM 接口命令与控制器硬件的逐技术重复改动与标准化/服役壁垒。
  同源但不并入 P-0215 / P-0195：那两张问 DRAM 存内计算的行内位通信与布局冲突；本卡不绑定存内计算，覆盖维护、并行、降延迟等 7 类技术的采纳路径。
  无解法提案，不提出具体可编程接口、通用命令格式、控制器框架、标准化流程改造或任何微架构。
