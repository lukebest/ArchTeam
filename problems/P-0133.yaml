generality_score: 8
同源:
  - arXiv:2609.02352 p.1-3

CONTEXT: |
  对象是移动端沉浸式渲染（含 VR）上的城市场景级神经点绘 / 神经场景表示。
  表示必须在渲染期可离线访问：不能假设渲染帧期间有稳定网络把大体量模型留在远端。
  设备侧是典型移动 GPU 显存预算，不是数据中心加速卡。

SYMPTOM: |
  - 城市场景级神经点绘表示常驻体量可达约 66 GB；典型移动 VR 设备 GPU 内存 <12 GB，差一个数量级以上。
  - 层次细节（LoD）表示额外占用树/节点元数据，在已超容量的场景上进一步抬高驻留下限。
  - 依赖网络把模型卸到远端的路径，在移动 VR 无法保证连通时不可用；目标场景要求渲染期离线。
  待证伪：在公开移动 VR 显存预算（<12 GB）与公开城市场景表示上，驻留体量仍 ≥约 66 GB 量级，
  且加上 LoD 元数据后仍无法整模型常驻，同时离线约束使远端卸模型不可用。

CONSTRAINT: |
  难在：表示体积相对设备容量固定差一个数量级，LoD 元数据只加不减，离线又砍掉「远端当内存」这条路。
  不能把问题改写成「换一块更大显存的卡」或「渲染期允许断线不可接受的联网」。
  证伪条件：若存在公开城市场景表示，在 <12 GB 移动预算内可离线常驻（含其 LoD 元数据），
  则本问题不成立。
