generality_score: 8
同源:
  - arXiv:2609.01948 p.1-3

CONTEXT: |
  对象是用新兴非易失器件阵列做训练期权重更新（算存靠近或同阵列），不是推理只读权值。
  理想更新要求电导变化与目标增量近似线性、对称。阵列规模大到写入误差会跨器件累积。

SYMPTOM: |
  - 算存分离下训练中权重/激活频繁搬运，带来显著延迟与能耗（数量级由片外往返决定）。
  - 实际单元电导调制呈高非线性与不对称：同幅更新落到偏离目标的电导态，拉低训练精度。
  - 大规模阵列存在 cycle-to-cycle 与 device-to-device 波动，误差在阵列上累积，破坏更新精度与收敛稳定性。
  - LTP/LTD 中电导常在脉冲初期快速变化、随后饱和，偏离与脉冲数成正比的理想直线。
  待证伪：在公开阵列规模与公开更新轨迹上，同幅脉冲后电导偏差使任务精度相对理想线性基线可测下降，
  且 C2C/D2D 波动使收敛不稳定（方差随阵列尺寸上升）。

CONSTRAINT: |
  难在：训练精度绑在「电导增量 ≈ 目标增量」这条直线上，而物理调制是非线性、不对称、且随脉冲饱和的。
  波动是阵列级累积，不是单器件标定能一次消掉的。
  禁止把问题改写成「换一种更线性的先进制程/材料」（那是工艺绑定，见同源扩展卡）。
  证伪条件：若在目标阵列规模上，电导-脉冲关系在训练动态范围内近似线性对称，
  且 C2C/D2D 波动不造成可测的精度/收敛损失，则本问题不成立。
