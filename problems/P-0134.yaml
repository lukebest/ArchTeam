generality_score: 8
同源:
  - arXiv:2609.02352 p.1-3
  - P-0133

CONTEXT: |
  同一套移动 VR 渲染流水线：前段做可见性 / 细节等级选择，后段对着色集合做着色。
  VR 同时产出左右眼两路紧耦合视图。设备显存仍按移动预算（公开对照 <12 GB）。

SYMPTOM: |
  - 前段触达的图元 / 节点集合远大于后段实际着色集合；内存峰值出现在前段，不是着色核。
  - 左右眼若不共享中间结果（可见性、排序、LoD 选择），预处理与排序会对第二只眼重复付费，
    峰值与带宽近似 ×2。
  - 与容量缺口叠加时（场景表示约 66 GB 量级 vs <12 GB），前段峰值先于着色把预算打穿。
  待证伪：在公开双目 VR 工作点上，前段工作集 / 后段着色集比值 ≫1，且不共享中间结果时
  第二眼预处理代价接近第一眼；峰值内存由前段而非着色解释。

CONSTRAINT: |
  难在：选择集合与着色集合的基数不匹配是流水线结构问题，不是后段着色更省一点能消掉的。
  双目紧耦合却默认按两路独立预处理计费，共享一旦缺席就近似翻倍。
  禁止把问题写成「只优化着色带宽」。
  证伪条件：若公开工作点上前段工作集 ≈ 着色集，或双目共享后第二眼预处理增量可忽略，
  且峰值由着色而非前段解释，则本问题不成立。
