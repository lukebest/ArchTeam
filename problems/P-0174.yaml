generality_score: 8
同源:
  - arXiv:2609.16600 p.1-3

CONTEXT: |
  对象是边缘设备上识别/语音等动态实时负载：通用核撞功耗墙，需要灵活且高效的加速衬底。
  CGRA 相对通用核更节能、相对专用加速器更可重配，是候选；但典型 CGRA 把 MAC 拆成 MUL+ADD 两条指令 → 每次 MAC ≥2 拍。
  神经网络推理、FFT 等 MAC 密负载因此被拉长；在 GeMM 类映射上，两拍 MAC 抬升周期与能耗。
  需要在不牺牲可重配灵活性的前提下压低 MAC 路径周期。

SYMPTOM: |
  - 边缘识别/语音等动态实时；通用核撞功耗墙，需要灵活高效加速衬底。
  - 典型 CGRA：MAC = MUL+ADD 两指令 → 每次 MAC ≥2 拍；NN/FFT 等 MAC 密负载端到端拉长。
  - GeMM 类映射上，两拍 MAC 相对更短 MAC 路径可测抬升周期与能耗。
  - 压低 MAC 路径周期与保持可重配灵活性同时成立，现有两拍拆分难以兼顾。
  待证伪：在公开边缘 CGRA 工作点上，MAC 密负载（如 GeMM/NN/FFT）因 MUL+ADD 两拍映射相对单拍 MAC 路径可测拉长周期与抬升能耗，或压周期必须以牺牲可重配灵活性为代价。

CONSTRAINT: |
  难在：边缘要灵活（多负载可映射）又要能效；典型 CGRA PE 单拍单运算 → MAC 必拆成 ≥2 拍，
  MAC 密负载周期与能耗被结构性拉长，缩短 MAC 路径又容易伤可重配。
  禁止提出可配置 MAC 单元、动态截断、单拍 MUL/ADD/MAC 合一或任何具体 PE 微架构机制；只问「两拍 MAC 映射拉长 GeMM/NN/FFT + 压周期与可重配不可兼得」是否同时承重失败。
  证伪条件：若公开工作点上典型 CGRA 已能在不改灵活性的前提下以单拍完成 MAC 且 GeMM/NN/FFT 周期与能耗不再相对两拍映射恶化，则本问题不成立。
  及格线：以 MAC 密负载周期数、能耗/能效与可映射工作负载集合对照；不以峰值 GOPS 或仅 MUL/ADD 微基准代理代替端到端 MAC 路径承重。
