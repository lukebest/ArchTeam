generality_score: 8
同源:
  - P-0006
  - P-0101
  - drafts/D-0101-M3-horizontal

CONTEXT: |
  对象是 LLM decode 的权值/KV 重读铺放，不是 DRAM 内部 bank 映射。
  粗资源是 HBM 通道（C=8 或 16，公开量级）；细资源是通道内 bank。
  流量已经存在：decode 逐步权值重读是持久带宽流；KV 按 token 下标行走。
  忽略通道内部怎么交织。公开工作点：8B/70B 与已发表 (B,S)。

SYMPTOM: |
  13B 级、S≈2048 时单序列 KV 约 1.7GB；decode 单 token 对权值算术强度约 1 FLOP/字节。
  - 若最高熵位先打进 bank 而不是通道，C=16 时通道占用可停在 9/16=56%，
    或更差（对照：区分位不够时约 9 个控制器热 / 384）。
  - C=8 时上界 min(K_token, C)。K 足够仍可能只热少数通道，
    每 token 时间相对满通道 bytes/β 差 C/n_hot。
  待证伪：存在公开 (B,S)，使通道占用 < C，且逐步时间不能用满通道 bytes/β 解释，
  即便通道内 bank 占用已经打满。

CONSTRAINT: |
  不改通道内部 bank 映射，不把本问题写成 DRAM 交织的移植。
  难在占用分层：粗层先饱和时，细层「有占用」解释不了带宽。
  证伪条件：若所有公开 decode 工作点上通道占用 = C，且逐步时间由满通道带宽解释，
  则「粗层先于细层饱和」不成立。
