  - drafts/D-0106-M5-foundational

CONTEXT: |
  源问题把 partial-good 写成映射可见的活集：退役 6.25/12.5/25% 时每 DMC n 从 48
  变成 45/42/36。现在问这个「n 对映射可见」的前提在公开 HBM 上是否成立。
  硬件仍冻：120 core / 384 DMC / 48 bank 每 DMC。只引用 JESD 与已发表 RAS。
  禁止设计 spare 方案。

SYMPTOM: |
  - JESD235（HBM2）每通道 8/16/32/48 bank；JESD238（HBM3）16/32/48/64 bank。
    信封 48 bank/DMC 是合法密度，BA 宽度由密度冻死，不是运行时变量。
  - JEDEC 公开的是 CHANNEL_DISABLE（整通道，初始化）与 lane/行列冗余，
    不是把每通道活 bank 数从 48 改成 45/42/36 的映射接口。
  - 已发表 GPU 控制器：spare 行 / 行重映射，文档写明不在软件地址空间留洞，bank 数不变；
    触顶后是整通道替换。粒度是「行」或「整通道」，不是「12/48 bank」。
  - 对比信封：6.25/12.5/25% bank 退役 = 每 DMC 砍 3/6/12 个 bank。公开通路无此粒度。
    若 n 恒为 48，则 Δn=0，运行时重绑对象体积为 0。

CONSTRAINT: |
  禁止改映射，禁止把「加 spare / 隐藏退役」写成机制。
  只问：公开 HBM 的 bank 禁用是映射可见，还是控制器隐藏。
  证伪条件：若公开控制器/JEDEC 通路一律保持常数 n（修复发生在行重映射或整通道替换，
  BA 宽度不变），则本问题不成立。若存在已发表控制器向地址映射暴露可变活 bank 掩码
  （n∈{36,42,45,48} 运行时可变），则前提成立，本扩展关闭。
