# 中文题目: 单侧空闲带来的注入机会置零后，双忙零洞、对向镜面拥塞与重入等待仍限制完成时间
generality_score: 8
同源:
  - P-0198
  - github:lukebest/bufferless-ring-noc tests/soc_sim
  - 扩展自 P-0198/M-4 纵向
  - 同源但不并入 P-0198 及其他 sibling expansion cards

CONTEXT: |
  评估信封钉死 bufferless-ring-noc tests/soc_sim：DV200 最多 12 top + 2 bottom，CHI 四通道各自成环，环间经 RBRG；无缓冲双向环每方向每拍只有一个 highway 槽，无片上 flit 队列。
  本卡只研究不对称占用所带来的注入机会已经被单独计量、且不再由注入失败单项主导的条件。双向同时忙时，两侧已有流量，额外注入机会为 0；错向流量重新进入首选方向还需等待可用槽。读、写、集合和跨环路径均需分列。
  目标是分流量类 makespan、完成数、双忙/单忙时间分桶与对向利用率，不把“有洞”当作充分的完成性指标。

SYMPTOM: |
  - 公开基线为 12+2、512 B、读 outstanding 512 / 写 256：均匀读 makespan 约 4403.2 ns，峰值后 goodput 从约 5761 B/ns 降至约 2.8–3.4 TB/s；写侧平台约 5.5 TB/s；集合多类 collapsed=true，广播约 117.76 B/ns 未崩。
  - alltoall 或双向同时活跃的高负载相中，双忙比例 f_dual≥40% 时，双忙桶的可注入机会保持 0；若该相 makespan 相对不对称窗对照≥1.3 倍且仍 collapsed，则零洞几何主导剩余时间。
  - 对向利用率 U_opp 相对关闭对照上升≥15%，且单侧空闲窗口时长缩短≥20% 时，负荷镜面抬升正在收紧可用窗口。
  - 首选方向长期满载时，重入等待 p99≥8 个环周，或完成数下降≥10%，则尾部完成时间由等待而非单纯注入成功率主导。
  - 端点按流量类报告 f_dual、单忙/双忙分桶可注入机会、U_opp、p99 等待、完成数、makespan 与 collapsed。

  待证伪：在单侧空闲注入机会已单独计量之后，若 f_dual、U_opp 与重入 p99 均不再主导分流量类 makespan/collapsed，则本问题不成立。

CONSTRAINT: |
  硬件信封固定为无缓冲、每方向每拍单槽、无 flit 队列；双忙时可注入机会为 0。不得跨 Req/Rsp/Snp/Dat 通道合并统计，也不得把剩余症状改写为单侧空闲机会不足以外的机制名。
  makespan、完成数、collapsed、f_dual、分桶可注入机会、U_opp 与 p99 等待是 endpoints；只报 inject-success 或单一平均利用率是 proxies，endpoints ≠ proxies。
  只测单向、低负载、单一集合，或不包含双忙相与重入尾延迟的实验属于 reduced-bbox，不等于 12+2 DV200、多通道、多类流量的 full envelope；reduced-bbox ≠ full envelope。
  若采用 0.85，0.85 is pass bar, not measured mean；不得用单侧空闲桶的通过率代替双忙桶与端到端结果。
  同源但不并入 P-0198 及其他 sibling expansion cards；  证伪条件同 SYMPTOM 末行。
  无解法提案。
